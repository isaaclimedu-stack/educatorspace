        <div class="tn-grid">${Array.from({ length: this.nTeams }, (_, i) => `<label class="fld" for="tn${i}"><span style="display:flex;gap:8px;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:${this.colors[i]};display:inline-block"></i>Team ${i + 1}</span><input type="text" id="tn${i}" maxlength="22" value="${esc(this.names[i])}"></label>`).join('')}</div>
        <div class="row"><button class="btn primary" id="gStart">${ico('play')}Start the showdown</button></div>
      </section>`;
    const seg = (id, key, num) => $$(`#${id} button`, m).forEach(b => b.onclick = () => { this[key] = num ? +b.dataset.v : b.dataset.v; LS.set({ band: 'gBand', nTeams: 'gTeams', secs: 'gSecs' }[key], this[key]); this.saveNames(); this.setup(); });
    seg('sTeams', 'nTeams', 1); seg('sSecs', 'secs', 1);
    $('#gStart', m).onclick = () => { this.saveNames(); this.start(); };
  },
  saveNames() { for (let i = 0; i < 4; i++) { const el = $('#tn' + i); if (el) this.names[i] = el.value.trim() || `Team ${i + 1}`; } LS.set('gNames', this.names); },
  start() {
    const B = QBANK[this.band], tiles = {};
    for (const c of B.cats) for (const v of [100, 200, 300, 400, 500]) { const pool = B.q.filter(q => q[0] === c && q[1] === v); tiles[c + v] = { c, v, q: pool[Math.random() * pool.length | 0], used: false }; }
    const keys = Object.keys(tiles).filter(k => tiles[k].v >= 300); tiles[keys[Math.random() * keys.length | 0]].bonus = true;
    this.G = { cats: B.cats, tiles, teams: Array.from({ length: this.nTeams }, (_, i) => ({ name: this.names[i], c: this.colors[i], s: 0, tag: '' })), turn: 0, cur: null, over: false };
    SND.win(); this.board();
  },
  teamsHTML(active) { return `<div class="teams">${this.G.teams.map((t, i) => `<div class="team ${i === active ? 'turn' : ''}" style="--tc:${t.c}"><div class="nm"><i></i>${esc(t.name)}</div><div class="sc">${t.s}</div><div class="tag">${esc(t.tag || (i === active ? 'Your turn' : ''))}</div></div>`).join('')}</div>`; },
  board() {
    const G = this.G, m = this.m; G.teams.forEach(t => t.tag = ''); clearInterval(this.timer);
    const left = Object.values(G.tiles).filter(t => !t.used).length;
    if (!left) { G.over = true; return this.final(); }
    m.innerHTML = `<div class="game"><div class="sec-h"><div style="display:grid;gap:4px"><span class="eyebrow">Science Showdown · ${this.band === 'hs' ? 'High School' : 'Middle School'}</span><h2><span style="color:${G.teams[G.turn].c}">${esc(G.teams[G.turn].name)}</span>, pick a tile</h2></div><div class="row"><span class="chip">${left} tiles left</span><button class="btn sm" id="gEnd">End game</button></div></div>
      ${this.teamsHTML(G.turn)}
      <div class="board"><div class="cats">${G.cats.map(c => `<div class="cat">${esc(c)}</div>`).join('')}</div>
      ${[100, 200, 300, 400, 500].map(v => `<div class="rw">${G.cats.map(c => { const t = G.tiles[c + v]; return `<button class="tile ${t.used ? 'used' : ''}" data-k="${esc(c + v)}" ${t.used ? 'disabled aria-label="used"' : ''}>${v}</button>`; }).join('')}</div>`).join('')}</div></div>`;
    $$('.tile:not(.used)', m).forEach(b => b.onclick = () => this.pick(b.dataset.k));
    $('#gEnd', m).onclick = e => { const b = e.currentTarget; if (b.dataset.sure) { G.over = true; this.final(); } else { b.dataset.sure = 1; b.textContent = 'Click again to end'; b.classList.add('warn'); } };
  },
  pick(k) {
    const G = this.G, t = G.tiles[k]; t.used = true; SND.pick();
    const order = [0, 1, 2, 3].sort(() => Math.random() - .5);
    G.cur = { t, order, team: G.turn, steal: false, tried: [], done: false };
    this.question();
  },
  question() {
    const G = this.G, C = G.cur, t = C.t, q = t.q, m = this.m, team = G.teams[C.team], pts = t.bonus ? t.v * 2 : C.steal ? t.v / 2 : t.v;
    m.innerHTML = `<div class="game">${this.teamsHTML(C.team)}
      <div class="qcard"><div class="qtop"><div class="row"><span class="chip">${esc(t.c)}</span><span class="chip">${pts} points</span>${t.bonus ? '<span class="chip" style="background:#ffd27a;color:#102d4b">Lab Bonus · double points</span>' : ''}${C.steal ? '<span class="chip" style="background:#e2572b">Steal!</span>' : ''}</div><span class="who" style="color:${team.c === '#2f7fd6' ? '#8fc2ff' : '#ffd27a'}">${esc(team.name)} answers</span></div>
        <div class="timer"><i id="qT"></i></div>
        <div class="qq">${esc(q[2])}</div>
        <div class="ans">${C.order.map((oi, j) => `<button data-o="${oi}" ${C.tried.includes(oi) ? 'disabled class="wrong"' : ''}><b>${'ABCD'[j]}</b><span>${esc(q[3][oi])}</span></button>`).join('')}</div>
        <div id="qX"></div></div></div>`;
    if (t.bonus && !C.steal && !C.shown) { C.shown = true; SND.win(); }
    $$('.ans button:not([disabled])', m).forEach(b => b.onclick = () => this.answer(+b.dataset.o));
    const total = C.steal ? Math.max(10, Math.round(this.secs / 2)) : this.secs, t0 = Date.now(); clearInterval(this.timer);
    this.timer = setInterval(() => { const el = $('#qT'); if (!el) return clearInterval(this.timer); const left = total - (Date.now() - t0) / 1000; el.style.width = clamp(left / total, 0, 1) * 100 + '%'; if (left < 5 && left > 0 && Math.abs(left - Math.round(left)) < .06) SND.tick(); if (left <= 0) { clearInterval(this.timer); this.answer(-1); } }, 50);
  },
  answer(oi) {
    const G = this.G, C = G.cur; if (!C || C.done) return; clearInterval(this.timer);
    const t = C.t, q = t.q, ok = oi === 0, team = G.teams[C.team], pts = t.bonus ? t.v * 2 : C.steal ? t.v / 2 : t.v;
    if (oi >= 0) C.tried.push(oi);
    if (ok) { team.s += pts; team.tag = `+${pts}`; SND.win(); return this.reveal(true, `${team.name} gets ${pts} points.`); }
    SND.nope();
    if (!C.steal && !t.bonus && G.teams.length > 1) {
      team.tag = oi < 0 ? 'Time’s up' : 'Missed';
      C.steal = true; C.team = (C.team + 1) % G.teams.length;
      const m = this.m; const btn = oi >= 0 ? $(`.ans button[data-o="${oi}"]`, m) : null; if (btn) btn.classList.add('wrong');
      $('#qX', m).innerHTML = `<div class="exp">${oi < 0 ? 'Time’s up!' : 'Not quite.'} <b>${esc(G.teams[C.team].name)}</b> can steal it for ${t.v / 2} points.</div><div class="row" style="margin-top:12px"><button class="btn primary" id="qSt">${esc(G.teams[C.team].name)}: steal</button></div>`;
      $$('.ans button', m).forEach(b => b.disabled = true); $('#qSt', m).onclick = () => this.question(); return;
    }
    team.tag = oi < 0 ? 'Time’s up' : 'Missed'; this.reveal(false, 'Nobody got it this time.');
  },
  reveal(ok, line) {
    const G = this.G, C = G.cur, q = C.t.q, m = this.m; C.done = true;
    $$('.ans button', m).forEach(b => { b.disabled = true; if (+b.dataset.o === 0) { b.classList.add('right'); b.classList.remove('wrong'); } });
    $$('.team', m).forEach((el, i) => { el.querySelector('.sc').textContent = G.teams[i].s; el.querySelector('.tag').textContent = G.teams[i].tag; });
    $('#qX', m).innerHTML = `<div class="exp"><b>${esc(line)}</b> ${esc(q[4])}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="qB">Back to the board</button></div>`;
    $('#qB', m).onclick = () => { G.turn = (G.turn + 1) % G.teams.length; G.cur = null; this.board(); };
    if (ok) confetti(1200);
  },
  final() {
    const G = this.G, m = this.m; clearInterval(this.timer); const rank = G.teams.slice().sort((a, b) => b.s - a.s), top = rank[0].s, winners = rank.filter(t => t.s === top);
    m.innerHTML = `<div class="game"><header style="display:grid;gap:6px"><span class="eyebrow">Final scores</span><h1>${winners.length > 1 ? 'It’s a tie!' : `<span style="color:${winners[0].c}">${esc(winners[0].name)}</span> wins!`}</h1></header>
      <div class="teams">${rank.map((t, i) => `<div class="team ${t.s === top ? 'turn' : ''}" style="--tc:${t.c}"><div class="nm"><i></i>${i + 1}. ${esc(t.name)}</div><div class="sc">${t.s}</div></div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="fA">Play again with the same teams</button><button class="btn" id="fN">New setup</button></div></div>`;
    $('#fA', m).onclick = () => this.start(); $('#fN', m).onclick = () => { this.G = null; this.setup(); };
    SND.win(); confetti(3000);
  }
};

/* ═══════════ Line-model (skeletal) molecules for Molecule Blaster ═══════════
   Built from bond geometry: every bond is 1 unit long, angles in degrees (y up). Carbons are corners and line ends;
   other atoms are labeled. Each molecule belongs to one macromolecule class. */
const MOLCLASS = {
  carb: { name: 'Carbohydrates', one: 'carbohydrate', tip: 'Rings (or chains) with an O in the ring and an OH on almost every carbon.' },
  protein: { name: 'Proteins', one: 'protein', tip: 'An N–C–C(=O) backbone repeating: amine (H₂N or N–H) and carbonyl groups. Amino acids and peptides.' },
  lipid: { name: 'Lipids', one: 'lipid', tip: 'Long zig-zag hydrocarbon chains with few O atoms, or four fused rings (steroids).' },
  nucleic: { name: 'Nucleic acids', one: 'nucleic acid', tip: 'Nucleotides: a phosphate (P), a five-carbon sugar ring, and a nitrogen base ring with several N atoms.' }
};
function Mol(name, cls) {

/* ═══════════ Classes: lab codes, the student version, and student results ═══════════
   A teacher makes a lab code (13 characters) that carries the chosen labs, options and a short teacher key, signed with
   SITE_KEY. Students join with it (no account), run the labs, and each finished lab is posted to the sign-up Apps Script,
   which saves it in the "educator-space.com · Lab results" tab. Teachers read back only their own students' results.
   LAB_ORDER is the bit order inside codes: only ever ADD new labs at the end, never reorder. */
const LAB_ORDER = ['dna-strawberry', 'titration', 'flame', 'pendulum', 'ohm', 'mass', 'erosion', 'onion', 'heart'];
/* GAME_ORDER is also append-only. A code with games = the usual 13 signed characters + a short tail holding a bitmask
   (labs in bits 0–11, games from bit 12). The 13-character core is version 2 and carries a 10-bit check of the tail, so the
   tail can't be edited. Only the core is sent with results, so the Apps Script needs no change. */
const GAME_ORDER = ['game', 'blaster', 'g-match', 'g-names', 'g-bomb', 'g-contaminated', 'g-gene', 'g-race', 'g-sort', 'g-launch', 'g-hazard', 'zombies', 'g-mitosis'];
const gameTitle = id => (GAMES.find(g => g.id === id) || {}).title || id;
const extHash = async ext => parseInt((await sha256hex('x|' + SITE_KEY + '|' + ext)).slice(0, 3), 16) & 1023;
const OPT = { hints: 1, blaster: 2, repeat: 4 };

const teacherKey = async email => parseInt((await sha256hex('t|' + SITE_KEY + '|' + normEmail(email))).slice(0, 5), 16);
const fmtLabCode = c => c.slice(0, 4) + '-' + c.slice(4, 8) + '-' + c.slice(8);
async function makeLabCode(email, labIds, opts, set, gameIds = []) {
  let labs = 0, ver = 1n, ext = '';
  if (gameIds.length || labIds.some(id => LAB_ORDER.indexOf(id) >= 10)) {
    let mask = 0n; labIds.forEach(id => { const i = LAB_ORDER.indexOf(id); if (i >= 0) mask |= 1n << BigInt(i); }); gameIds.forEach(id => { const i = GAME_ORDER.indexOf(id); if (i >= 0) mask |= 1n << BigInt(12 + i); });
    let mm = mask; do { ext = CODE_ABC[Number(mm % 31n)] + ext; mm /= 31n; } while (mm > 0n); while (ext.length < 6) ext = CODE_ABC[0] + ext;
    labs = await extHash(ext); ver = 2n;
  } else labIds.forEach(id => { const i = LAB_ORDER.indexOf(id); if (i >= 0) labs |= 1 << i; });
  const th = await teacherKey(email);
  const payload = (ver << 38n) | (BigInt(labs) << 28n) | (BigInt(opts & 15) << 24n) | (BigInt(set & 15) << 20n) | BigInt(th);
  const sg = parseInt((await sha256hex(SITE_KEY + '|lab|' + payload.toString(16).padStart(10, '0'))).slice(0, 6), 16);
  let n = (payload << 24n) | BigInt(sg), s = '';
  for (let i = 0; i < 13; i++) { s = CODE_ABC[Number(n % 31n)] + s; n /= 31n; }
  return fmtLabCode(s) + (ext ? '-' + ext : '');
}
async function readLabCode(code) {
  const all = normCode(code); if (all.length !== 13 && (all.length < 19 || all.length > 25)) return null; const c = all.slice(0, 13), ext = all.slice(13);
  let n = 0n; for (const ch of c) { const i = CODE_ABC.indexOf(ch); if (i < 0) return null; n = n * 31n + BigInt(i); }
  if (n >= (1n << 64n)) return null;
  const payload = n >> 24n, sg = Number(n & 0xFFFFFFn);

  else { if (ver === 2) return null; labs = LAB_ORDER.filter((id, i) => field & (1 << i)); if (opts & OPT.blaster) games = ['blaster']; }

}

/* ═════ sending a finished lab to the teacher ═════ */
async function postResult(p) {
  try { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(SIGNUP_ENDPOINT, { method: 'POST', signal: ac.signal, body: JSON.stringify(p) }); clearTimeout(tm); const d = await r.json(); return d && d.ok ? 'ok' : (d && d.msg) || 'refused'; }
  catch (e) { return 'offline'; }
}
async function submitResult(rec) {
  const S = APP.student; if (!S) return;
  const p = { type: 'labresult', code: S.k.core || S.k.code, name: S.name, email: S.email, period: S.period, lab: rec.lab, labId: APP.curLab, mistakes: rec.mistakes, quiz: rec.quiz, secs: rec.secs, stars: rec.stars, at: rec.at,
    review: (Kit.mistakes || []).map(x => x.step + ': ' + x.title).join('; ').slice(0, 400) };
  const done = LS.get('stuDone', {}), key = S.k.code + '|' + APP.curLab; done[key] = { stars: rec.stars, sent: false, at: rec.at }; LS.set('stuDone', done);
  showSend('pending', 'Sending your results to your teacher…');
  const r = await postResult(p);
  if (r === 'ok') { done[key].sent = true; LS.set('stuDone', done); showSend('ok', '✓ Sent to your teacher.'); return; }
  if (r === 'offline') { const ob = LS.get('outbox', []); ob.push(p); LS.set('outbox', ob.slice(-30)); }
  const txt = `${S.name}${S.period ? ' (' + S.period + ')' : ''} · ${rec.lab} · mistakes ${rec.mistakes} · quiz ${rec.quiz} · time ${fmtTime(rec.secs)} · code ${S.k.code}`;
  showSend('bad', r === 'offline' ? 'Couldn’t reach your teacher’s results right now. They’ll be sent automatically next time you open Educator Space. You can also show your teacher this:' : 'Your results weren’t accepted (' + esc(r) + '). Show your teacher this:', txt);
}
let SEND_ID = 0;
function showSend(kind, msg, txt) {
  const id = ++SEND_ID; let tries = 0; const put = () => { if (id !== SEND_ID) return; const box = $('#kSide .results'); if (!box) { if (tries++ < 30) setTimeout(put, 100); return; }
    let el = $('#sendBox', box); if (!el) { el = document.createElement('div'); el.id = 'sendBox'; box.insertBefore(el, box.children[2] || null); }
    el.className = 'send-box ' + kind; el.innerHTML = `<span class="small">${msg}</span>${txt ? `<code class="small" style="user-select:all;display:block;margin-top:6px">${esc(txt)}</code>` : ''}`;
    if (kind === 'ok') Kit.msg && Kit.live && Kit.msg('Results sent to your teacher', 'ok', 2200); };
  put();
}
async function flushOutbox(manual) {
  const ob = LS.get('outbox', []); if (!ob.length) return; const keep = []; const done = LS.get('stuDone', {});
  for (const p of ob) { const r = await postResult(p); if (r === 'ok') { const k = p.code + '|' + p.labId; if (done[k]) done[k].sent = true; } else if (r === 'offline') keep.push(p); }
  LS.set('outbox', keep); LS.set('stuDone', done);
  if (APP.student && !Kit.live) renderStudent();
  if (manual && keep.length) alertBox('Still offline', 'Your results are saved on this computer and will be sent when you’re back online.');
}
function alertBox(t, msg) { const sc = document.createElement('div'); sc.className = 'scrim'; sc.innerHTML = `<div class="modal" style="width:min(420px,100%)"><div class="mh"><h2>${esc(t)}</h2><p class="muted">${esc(msg)}</p></div><div class="mf"><button class="btn primary">OK</button></div></div>`; document.body.appendChild(sc); $('button', sc).onclick = () => sc.remove(); }

/* ═══════════ Characters: Pippin the otter and Puff the sheep ═══════════
   Soft, plush, toy-like style (felt fur, big dot eyes, cozy knit sweaters).

let CH_N = 0;
const CHAR = {
  otter: { fur: '#97705f', furLt: '#b88f7c', furDk: '#6c4c40', dark: '#5f4339', cream: '#f3dcc0', creamDk: '#e2c3a2', nose: '#6a4335', knit: '#3f6e60', knitLt: '#56887a', knitDk: '#2f5649', yarn: '#efe6cf' },
  sheep: { wool: '#fbf6ec', woolSh: '#e9dfcd', face: '#f2d7bd', faceDk: '#ddb796', dark: '#5d4a42', nose: '#b9776f', knit: '#d9774f', knitLt: '#ec9a72', knitDk: '#b35c3b', yarn: '#fff1d9' }
};
function chDefs(p, k) {

  const fuzz = `<filter id="${p}fz" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>`;

    <radialGradient id="${p}knS" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>`;

    <radialGradient id="${p}fur" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="${C.furLt}"/><stop offset=".55" stop-color="${C.fur}"/><stop offset="1" stop-color="${C.furDk}"/></radialGradient>

    <radialGradient id="${p}fc" cx=".42" cy=".32" r=".85"><stop offset="0" stop-color="#fae6d2"/><stop offset=".6" stop-color="${C.face}"/><stop offset="1" stop-color="${C.faceDk}"/></radialGradient>

/* eyes + mouth for a mood, in head coordinates (eyes at ±40,-2) */
function chFace(p, mood, k) {
  const C = CHAR[k], ink = '#2e211d';
  const open = (sx = 1, sy = 1) => [-1, 1].map(s => `<ellipse cx="${s * 40}" cy="-2" rx="${14 * sx}" ry="${17.5 * sy}" fill="url(#${p}ey)"/><circle cx="${s * 40 + 4}" cy="-9" r="${5 * sx}" fill="#fff"/><circle cx="${s * 40 - 4}" cy="5" r="2" fill="#fff" opacity=".8"/>`).join('');
  const shut = (up = true) => [-1, 1].map(s => `<path d="M${s * 40 - 14},${up ? 2 : -4} Q${s * 40},${up ? -14 : 8} ${s * 40 + 14},${up ? 2 : -4}" fill="none" stroke="${ink}" stroke-width="5.5" stroke-linecap="round"/>`).join('');
  let eyes = open(), mouth = '', extra = '';
  const smile = `<path d="M-24,46 Q-12,40 0,46 Q12,40 24,46 Q20,76 0,78 Q-20,76 -24,46Z" fill="#6b3a33"/><path d="M-13,66 Q0,56 13,66 Q8,77 0,78 Q-8,77 -13,66Z" fill="#ef8f86"/>`;
  const tiny = `<path d="M-9,52 Q-4,58 0,52 Q4,58 9,52" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
  if (mood === 'happy') { eyes = shut(true); mouth = smile.replace('Q-20,76', 'Q-20,80').replace('Q20,76', 'Q20,80'); }
  else if (mood === 'grin') { mouth = smile; }
  else if (mood === 'think') { eyes = open(.95, .95); mouth = `<ellipse cx="2" cy="56" rx="7" ry="8" fill="#6b3a33"/>`; extra = `<path d="M-56,-30 q16,-12 30,-4 M26,-34 q16,-6 30,4" fill="none" stroke="${ink}" stroke-width="4" stroke-linecap="round" opacity=".7"/>`; }
  else if (mood === 'oops') { eyes = open(1.12, 1.12); mouth = `<ellipse cx="0" cy="58" rx="10" ry="12" fill="#6b3a33"/><ellipse cx="0" cy="63" rx="6" ry="5" fill="#ef8f86"/>`; extra = `<path d="M96,-52 q12,20 0,28 q-12,-8 0,-28Z" fill="#9fdcff" stroke="#5f9fc4" stroke-width="2"/>`; }
  else if (mood === 'sleepy') { eyes = shut(false); mouth = tiny; }
  else if (mood === 'angry') { eyes = open(.9, .78) + `<path d="M-58,-26 L-22,-14 M58,-26 L22,-14" stroke="${ink}" stroke-width="6" stroke-linecap="round"/>`; mouth = `<path d="M-14,62 Q0,50 14,62" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round"/>`; }
  else mouth = tiny;
  const blush = `<ellipse cx="-66" cy="34" rx="15" ry="8" fill="#f09a9a" opacity="${k === 'otter' ? .35 : .55}"/><ellipse cx="66" cy="34" rx="15" ry="8" fill="#f09a9a" opacity="${k === 'otter' ? .35 : .55}"/>`;
  return blush + eyes + mouth + extra;
}

/* the head, centered on (0,0) */

    const ears = [-1, 1].map(s => `<circle cx="${s * 98}" cy="-62" r="24" fill="url(#${p}fur)"/><circle cx="${s * 99}" cy="-60" r="12" fill="${C.furDk}"/>`).join('');

    const whisk = [-1, 1].map(s => `<path d="M${s * 70},40 l${s * 22},-5 M${s * 72},50 l${s * 24},2 M${s * 70},60 l${s * 20},8" stroke="#5a3f35" stroke-width="2.6" stroke-linecap="round"/>`).join('');

      ${puffs.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="38" fill="url(#${p}wl)"/>`).join('')}
      <ellipse cx="0" cy="8" rx="94" ry="88" fill="url(#${p}fc)"/>
      <path d="M-92,-16 Q-70,-70 0,-74 Q70,-70 92,-16 Q66,-42 34,-34 Q16,-56 0,-40 Q-16,-56 -34,-34 Q-66,-42 -92,-16Z" fill="url(#${p}wl)"/></g>
      ${o.soot ? sootMarks() : ''}
      <path d="M-11,28 Q0,23 11,28 Q8,38 0,40 Q-8,38 -11,28Z" fill="${C.nose}"/>

/* sweater with a knit motif: Pippin gets the zig-zag and fish, Puff gets a zig-zag and a heart */
function chSweater(p, k) {
  const C = CHAR[k];
  const body = `M-74,-176 Q-88,-120 -76,-62 Q0,-46 76,-62 Q88,-120 74,-176 Q0,-196 -74,-176Z`;
  let zig = 'M-80,-140'; for (let i = 0; i <= 16; i++) zig += ` L${-80 + i * 10},${i % 2 ? -150 : -136}`;
  const motif = k === 'otter'
    ? `<g transform="translate(0 -104) scale(1.35)"><path d="M-18,0 Q-4,-13 12,0 Q-4,13 -18,0Z" fill="${C.yarn}"/><path d="M10,0 L22,-9 L22,9Z" fill="${C.yarn}"/><circle cx="-9" cy="-2" r="2" fill="${C.knitDk}"/><path d="M-3,-6 q3,6 0,12" stroke="${C.knitDk}" stroke-width="1.5" fill="none"/></g>`
    : `<path transform="translate(0 -104)" d="M0,10 C-22,-4 -14,-20 0,-10 C14,-20 22,-4 0,10Z" fill="${C.yarn}"/>`;
  return `<g filter="url(#${p}fz)"><path d="${body}" fill="url(#${p}kn)"/><path d="${body}" fill="url(#${p}knS)"/>
    <path d="M-76,-72 Q0,-56 76,-72 L76,-60 Q0,-44 -76,-60Z" fill="${C.knitDk}"/>${Array.from({ length: 16 }, (_, i) => `<line x1="${-70 + i * 9.4}" y1="${-69 + Math.abs(i - 7.5) * .6}" x2="${-70 + i * 9.4}" y2="${-57 + Math.abs(i - 7.5) * .6}" stroke="${C.knit}" stroke-width="2"/>`).join('')}
    <path d="M-40,-184 Q0,-170 40,-184 Q40,-196 0,-200 Q-40,-196 -40,-184Z" fill="${C.knitDk}"/>
    <path d="${zig}" fill="none" stroke="${C.yarn}" stroke-width="7" stroke-linejoin="round"/><path d="${zig.replace(/-150/g, -80).replace(/-136/g, -72).replace(/-140/, -76)}" fill="none" stroke="${C.yarn}" stroke-width="3.5" stroke-dasharray="2 6" stroke-linecap="round" opacity=".8"/>
    ${[-56, -28, 28, 56].map(x => `<circle cx="${x}" cy="-168" r="3.2" fill="${C.yarn}"/>`).join('')}
    ${motif}</g>`;
}

      <path d="M-12,-170 L-30,-132 L-8,-112 M12,-170 L30,-132 L8,-112" fill="none" stroke="${ol}" stroke-width="2.2" stroke-linejoin="round"/>

    <g class="ov-goggles" visibility="hidden"><path d="M-114,-304 Q0,-318 114,-304" fill="none" stroke="#1686e8" stroke-width="10" stroke-linecap="round"/>
      <rect x="-74" y="-330" width="66" height="54" rx="24" fill="#d6f0fa" fill-opacity=".5" stroke="${ol}" stroke-width="5"/><rect x="8" y="-330" width="66" height="54" rx="24" fill="#d6f0fa" fill-opacity=".5" stroke="${ol}" stroke-width="5"/>
      <path d="M-8,-306 h16" stroke="${ol}" stroke-width="5"/><path d="M-62,-318 q8,-6 18,-4 M20,-318 q8,-6 18,-4" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/></g>`;

/* a standalone face (expression portrait) as an <svg> string */
function charFace(k = 'otter', mood = 'grin', size = 64, o = {}) {
  const p = 'f' + (++CH_N) + '_';
  const sweater = o.bust ? `<g transform="translate(0 300)">${chSweater(p, k)}</g>` : '';
  return `<svg viewBox="-140 -135 280 ${o.bust ? 290 : 250}" width="${size}" height="${Math.round(size * (o.bust ? 290 : 250) / 280)}" aria-hidden="true" style="overflow:visible">${chDefs(p, k)}${sweater}${chHead(p, k, mood, o)}</svg>`;
}

/* ═══════════ Front page art: the Educator Space planet, its orbit of science badges, and Pippin ═══════════ */
function gateArt() {
  const cx = 210, cy = 128, rx = 168, ry = 46, rot = -14, r = rot * Math.PI / 180;
  const at = deg => { const t = deg * Math.PI / 180, x = Math.cos(t) * rx, y = Math.sin(t) * ry; return [cx + x * Math.cos(r) - y * Math.sin(r), cy + x * Math.sin(r) + y * Math.cos(r)]; };
  let seed = 7; const rn = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = Array.from({ length: 46 }, () => { const x = rn() * 420, y = rn() * 250, s = rn(); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.5 + s * 1.1).toFixed(2)}" fill="#e6f4ff" opacity="${(.2 + s * .5).toFixed(2)}"/>`; }).join('');
  const sp = (x, y, s) => `<path d="M${x},${y - s} Q${x},${y} ${x + s},${y} Q${x},${y} ${x},${y + s} Q${x},${y} ${x - s},${y} Q${x},${y} ${x},${y - s}Z" fill="#9cfff0"/>`;
  const I = {
    flask: `<path d="M-4,-9 V-3 L-9,6 Q-10,9 -7,9 H7 Q10,9 9,6 L4,-3 V-9 M-6,-9 H6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-7.2,4 H7.2 L8.4,6.6 Q9,8 7,8 H-7 Q-9,8 -8.4,6.6Z" fill="#9cfff0"/>`,
    atom: `<g fill="none" stroke="#fff" stroke-width="1.7"><ellipse rx="10" ry="4"/><ellipse rx="10" ry="4" transform="rotate(60)"/><ellipse rx="10" ry="4" transform="rotate(-60)"/></g><circle r="2.6" fill="#9cfff0"/>`,
    dna: `<path d="M-5,-10 C6,-5 6,5 -5,10 M5,-10 C-6,-5 -6,5 5,10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M-3,-6 H3 M-4,0 H4 M-3,6 H3" stroke="#9cfff0" stroke-width="1.8" stroke-linecap="round"/>`,
    bolt: `<path d="M2,-10 L-6,2 H0 L-2,10 L6,-2 H0Z" fill="#9cfff0" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>`,
    leaf: `<path d="M-8,8 C-9,-4 -1,-9 9,-9 C9,1 4,8 -8,8Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-8,8 L4,-4" stroke="#9cfff0" stroke-width="1.8" stroke-linecap="round"/>`,
    tube: `<path d="M-3.5,-10 V6 A3.5,3.5 0 0 0 3.5,6 V-10 M-5.5,-10 H5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M-3.5,1 H3.5 V6 A3.5,3.5 0 0 1 -3.5,6Z" fill="#9cfff0"/>`
  };
  const badge = (deg, ic, s = 1) => { const [x, y] = at(deg); return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s})"><circle r="17" fill="#143a63" stroke="#9cfff0" stroke-opacity=".7" stroke-width="1.6"/>${I[ic]}</g>`; };
  /* back half of the orbit (behind the planet) and front half (in front), with badges in matching layers */
  const back = `<path d="M${at(180).join(',')} A${rx},${ry} ${rot} 0 1 ${at(0).join(',')}" fill="none" stroke="#1effb0" stroke-opacity=".28" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  const front = `<path d="M${at(0).join(',')} A${rx},${ry} ${rot} 0 1 ${at(180).join(',')}" fill="none" stroke="url(#gOrb)" stroke-width="3.2" stroke-linecap="round"/>`;
  return `<svg class="gate-hero" viewBox="0 0 420 250" aria-hidden="true">
    <defs>
      <radialGradient id="gPl" cx=".36" cy=".32" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e3f0fc"/><stop offset="1" stop-color="#9fc3ea"/></radialGradient>
      <radialGradient id="gGlow"><stop offset="0" stop-color="#4aa8f5" stop-opacity=".45"/><stop offset="1" stop-color="#4aa8f5" stop-opacity="0"/></radialGradient>
      <linearGradient id="gOrb" x1="0" x2="1"><stop offset="0" stop-color="#1effb0" stop-opacity=".25"/><stop offset=".5" stop-color="#1effb0"/><stop offset="1" stop-color="#9cfff0" stop-opacity=".35"/></linearGradient>
      <clipPath id="gPlC"><circle cx="${cx}" cy="${cy}" r="60"/></clipPath>
    </defs>
    ${stars}${sp(58, 40, 6)}${sp(372, 52, 4.5)}${sp(84, 214, 4)}
    <circle cx="${cx}" cy="${cy}" r="120" fill="url(#gGlow)"/>
    ${back}${badge(205, 'leaf', .82)}${badge(250, 'tube', .78)}${badge(300, 'bolt', .82)}
    <circle cx="${cx}" cy="${cy}" r="60" fill="url(#gPl)"/>
    <g clip-path="url(#gPlC)" opacity=".35"><path d="M130,108 Q200,96 270,112" stroke="#b6d3f1" stroke-width="10" fill="none"/><circle cx="${cx + 26}" cy="${cy - 26}" r="7" fill="#c7ddf4"/><circle cx="${cx - 30}" cy="${cy + 30}" r="5" fill="#b6d3f1"/></g>
    <circle cx="${cx}" cy="${cy}" r="60" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
    <circle cx="276" cy="48" r="7" fill="#fff"/><circle cx="273.5" cy="45.5" r="2" fill="#e3f0fc"/>

/* ═══════════ Game hub: high school and middle school games ═══════════
   Each band has its own set of games; no game appears in both bands.
   A game is { id, band, title, tag, blurb, time, page(m), stop() } or an external page { ext: 'games/…/index.html' }. */
const GH = {
  shuf(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pick: a => a[Math.random() * a.length | 0],
  /* chemical formula → HTML: digits become subscripts, {2-} becomes a superscript charge */
  chem(s) { return esc(s).replace(/([A-Za-z)\]])(\d+)/g, '$1<sub>$2</sub>').replace(/\{([^}]*)\}/g, (_, c) => '<sup>' + c.replace('-', '−') + '</sup>'); },
  fmt: s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`,
  board: k => LS.get('hs.' + k, []),
  /* save a score; returns its rank (0-based) or -1 if it didn't make the board */
  save(k, rec, cmp, max = 10) { const b = GH.board(k); b.push(rec); b.sort(cmp); const r = b.indexOf(rec); LS.set('hs.' + k, b.slice(0, max)); return r < max ? r : -1; },
  boardHTML(k, cols, empty = 'No scores yet. Finish a game and save your name to get on the board.') {
    const b = GH.board(k);
    return b.length ? `<div class="tbl-wrap"><table class="rec"><thead><tr><th>#</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}<th>Date</th></tr></thead><tbody>${b.map((r, i) => `<tr><td>${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td>${cols.map(c => `<td class="${c[2] || ''}">${c[1](r)}</td>`).join('')}<td>${new Date(r.d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty"><b>No scores yet.</b><span class="small">${empty}</span></div>`;
  },
  /* a little "type your name, save" row; onSave(name) */
  saveRow(box, key, onSave) {
    box.innerHTML = `<div class="row"><input type="text" maxlength="18" placeholder="Your name for the high scores" value="${esc(LS.get(key, ''))}" style="max-width:250px"><button class="btn primary">Save score</button><span class="small muted"></span></div>`;
    const inp = $('input', box), b = $('button', box);
    b.onclick = () => { const n = inp.value.trim() || 'Player'; LS.set(key, n); b.disabled = true; inp.disabled = true; $('span', box).textContent = onSave(n); };
    inp.onkeydown = e => { if (e.key === 'Enter') b.click(); };
  },
  head(eyebrow, title, desc) { return `<header style="display:grid;gap:6px"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${desc ? `<p class="muted" style="max-width:66ch">${desc}</p>` : ''}</header>`; },
  say(k, mood, text, size = 54) { return `<div class="gm-say">${charFace(k, mood, size)}<div class="gm-bub">${text}</div></div>`; },
  keys: null,
  onKey(fn) { if (GH.keys) document.removeEventListener('keydown', GH.keys); GH.keys = fn; if (fn) document.addEventListener('keydown', fn); },
  /* a game ended: if a student is playing it as an assignment, send the score to the teacher */
  report(id, r) {
    const S = APP.student; if (!S || !(S.k.games || []).includes(id)) return;
    const g = GAMES.find(x => x.id === id), secs = Math.round((performance.now() - (GH.runT0 || performance.now())) / 1000), at = new Date().toISOString(); GH.runT0 = performance.now();
    const p = { type: 'labresult', code: S.k.core || S.k.code, name: S.name, email: S.email, period: S.period, lab: g.title + ' (game)', labId: id, mistakes: Math.max(0, Math.round(r.mistakes || 0)), quiz: String(r.score).slice(0, 10), secs, stars: r.stars || 1, at, review: String(r.review || '').slice(0, 400) };
    const key = S.k.code + '|' + id, done = LS.get('stuDone', {}); done[key] = { stars: p.stars, score: p.quiz, sent: false, at }; LS.set('stuDone', done);
    GH.toast('Sending your score to your teacher…');
    postResult(p).then(res => { const d = LS.get('stuDone', {}); if (res === 'ok') { if (d[key]) d[key].sent = true; LS.set('stuDone', d); GH.toast('✓ Score sent to your teacher'); }
      else { if (res === 'offline') { const ob = LS.get('outbox', []); ob.push(p); LS.set('outbox', ob.slice(-30)); } GH.toast(res === 'offline' ? 'Score saved. It will be sent when you’re back online.' : 'Your score wasn’t accepted (' + res + ').'); } });
  },
  toast(t) { let e = $('#ghToast'); if (!e) { e = document.createElement('div'); e.id = 'ghToast'; e.className = 'gh-toast'; document.body.appendChild(e); } e.textContent = t; e.classList.add('on'); clearTimeout(GH._tt); GH._tt = setTimeout(() => e.classList.remove('on'), 3200); }
};

const GameHub = {

    units: { name: 'Quantities & SI units', a: 'Quantity', b: 'Unit', pairs: [['Force', 'newton (N)'], ['Energy', 'joule (J)'], ['Power', 'watt (W)'], ['Pressure', 'pascal (Pa)'], ['Frequency', 'hertz (Hz)'], ['Electric current', 'ampere (A)'], ['Resistance', 'ohm (Ω)'], ['Potential difference', 'volt (V)'], ['Electric charge', 'coulomb (C)'], ['Amount of substance', 'mole (mol)'], ['Temperature', 'kelvin (K)'], ['Momentum', 'kg·m/s'], ['Acceleration', 'm/s²'], ['Density', 'kg/m³']] },

  },
  deck: LS.get('mDeck', 'elements'), raf: 0, G: null,
  stop() { cancelAnimationFrame(this.raf); this.raf = 0; clearTimeout(this.to); clearInterval(this.cd); if (this.G) this.G.dead = true; },
  page(m) { this.stop(); this.m = m; this.menu(); },
  bkey() { return 'match.' + this.deck; },
  menu() {
    const m = this.m, D = this.DECKS[this.deck];
    m.innerHTML = `${GH.head('Memory · solo · mouse', 'Speed Match', 'Twenty cards lie face down: ten pairs. Click two cards to flip them. A match stays up; a miss flips back. The clock starts on your first flip, so beat the best time with as few flips as you can.')}
      <section class="setup">
        <div style="display:grid;gap:8px"><span class="eyebrow">Choose a deck</span><div class="gm-decks">${Object.entries(this.DECKS).map(([k, d]) => `<button class="gm-deck ${this.deck === k ? 'on' : ''}" data-d="${k}"><b>${d.name}</b><span class="small muted">${esc(d.pairs[0][0])} ↔ ${esc(d.pairs[0][1])}</span></button>`).join('')}</div></div>
        <div class="row" style="justify-content:space-between">${GH.say('sheep', 'grin', `Ten pairs from <b>${D.name.toLowerCase()}</b>. Remember where each card is!`)}<button class="btn primary" id="mGo">${ico('play')}Start</button></div>
      </section>
      <section class="sec"><div class="sec-h"><h2>Best times: ${esc(D.name)}</h2>${GH.board(this.bkey()).length ? '<button class="btn sm" id="mClr">Clear</button>' : ''}</div>
        ${GH.boardHTML(this.bkey(), [['Name', r => esc(r.n)], ['Time', r => GH.fmt(r.t), 'mono'], ['Flips', r => r.f, 'mono']])}</section>`;
    $$('[data-d]', m).forEach(b => b.onclick = () => { this.deck = b.dataset.d; LS.set('mDeck', this.deck); this.menu(); });
    $('#mGo', m).onclick = () => this.start();
    const c = $('#mClr', m); if (c) c.onclick = () => { if (c.dataset.sure) { LS.set('hs.' + this.bkey(), []); this.menu(); } else { c.dataset.sure = 1; c.textContent = 'Click again to clear'; c.classList.add('warn'); } };
  },
  start() {
    this.stop(); SND.ac();
    const m = this.m, D = this.DECKS[this.deck], pairs = GH.shuf(D.pairs).slice(0, 10);
    const cards = GH.shuf(pairs.flatMap((p, k) => [{ k, t: p[0], s: 'a' }, { k, t: p[1], s: 'b' }]));
    const best = GH.board(this.bkey())[0];
    const G = this.G = { cards, up: [], done: 0, flips: 0, t0: 0, t: 0, live: false, lock: false };
    m.innerHTML = `<div class="sec-h"><div style="display:grid;gap:2px"><span class="eyebrow">Speed Match · ${esc(D.name)}</span><h2>Find all 10 pairs</h2></div><div class="row"><button class="btn sm" id="mR">Restart</button><button class="btn sm" id="mQ">Quit</button></div></div>
      <div class="gm-hud"><div><span class="eyebrow">Time</span><b class="mono" id="mT">0:00.0</b></div><div><span class="eyebrow">Flips</span><b class="mono" id="mF">0</b></div><div><span class="eyebrow">Pairs</span><b class="mono" id="mP">0/10</b></div><div><span class="eyebrow">Best</span><b class="mono">${best ? GH.fmt(best.t) : '—'}</b></div></div>
      <div class="mc-wrap"><div class="mc-grid" id="mG">${cards.map((c, i) => `<button class="mc" data-i="${i}" aria-label="Card ${i + 1}"><span class="mc-in"><span class="mc-back"><svg viewBox="0 0 100 100">${logoMark()}</svg></span><span class="mc-front ${c.s}"><span class="mc-tag">${c.s === 'a' ? D.a : D.b}</span><span class="mc-txt" style="font-size:${c.t.length > 26 ? 13 : c.t.length > 14 ? 15 : c.t.length > 4 ? 18 : 30}px">${esc(c.t)}</span></span></span></button>`).join('')}</div>
        <div class="gm-over" id="mO"><div class="gm-count" id="mC">3</div></div></div>`;
    $('#mR', m).onclick = () => this.start(); $('#mQ', m).onclick = () => { this.stop(); this.menu(); };
    $$('.mc', m).forEach(b => b.onclick = () => this.flip(+b.dataset.i));
    let n = 3; SND.tick(); this.cd = setInterval(() => { n--; const c = $('#mC'); if (!c) return clearInterval(this.cd); if (n > 0) { c.textContent = n; SND.tick(); } else { clearInterval(this.cd); c.textContent = 'Go!'; SND.ok(); setTimeout(() => { const o = $('#mO'); if (o) o.hidden = true; G.live = true; }, 350); } }, 650);
    const tick = () => { if (G.dead) return; if (G.t0 && !G.over) { G.t = (performance.now() - G.t0) / 1000; const e = $('#mT'); if (e) e.textContent = GH.fmt(G.t); } this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  },
  el: i => $(`.mc[data-i="${i}"]`),
  flip(i) {
    const G = this.G; if (!G || !G.live || G.over) return; const c = G.cards[i];
    if (c.done || G.up.includes(i)) return;
    if (G.up.length === 2) this.settle();
    if (!G.t0) G.t0 = performance.now();
    G.up.push(i); G.flips++; this.el(i).classList.add('up'); SND.pick(); $('#mF').textContent = G.flips;
    if (G.up.length === 2) {
      const [a, b] = G.up.map(x => G.cards[x]);
      if (a.k === b.k) { a.done = b.done = true; G.up.forEach(x => this.el(x).classList.add('done')); G.up = []; G.done++; SND.ok(); $('#mP').textContent = G.done + '/10'; if (G.done === 10) this.finish(); }
      else { this.to = setTimeout(() => this.settle(), 800); }
    }
  },
  settle() { const G = this.G; clearTimeout(this.to); G.up.forEach(x => { if (!G.cards[x].done) { const e = this.el(x); e.classList.remove('up'); e.classList.add('miss'); setTimeout(() => e.classList.remove('miss'), 300); } }); G.up = []; },
  finish() {
    const G = this.G; G.over = true; G.t = (performance.now() - G.t0) / 1000; $('#mT').textContent = GH.fmt(G.t);
    const b = GH.board(this.bkey()), pb = !b.length || G.t < b[0].t, stars = G.flips <= 26 ? 3 : G.flips <= 36 ? 2 : 1;
    GH.report('g-match', { score: GH.fmt(G.t), mistakes: Math.max(0, (G.flips - 20) / 2), stars, review: this.DECKS[this.deck].name + ', ' + G.flips + ' flips' });
    SND.win(); confetti(pb ? 2600 : 1400);

/* ═══════════ Bomb Squad (high school chemistry): earn five tools to defuse the cartoon bomb ═══════════
   Topics: strong acids and bases, polyatomic ions. A wrong answer costs 5 seconds and a strike.
   Three strikes, or the fuse burning down, sets it off: a cartoon KA-BOOM with smoke and a sooty Pippin. */
const BOMBQ = (() => {
  const POLY = [['NH4{+}', 'ammonium', 'n'], ['H3O{+}', 'hydronium', 'h'], ['C2H3O2{-}', 'acetate', 'c'], ['HCO3{-}', 'hydrogen carbonate (bicarbonate)', 'c'], ['CO3{2-}', 'carbonate', 'c'], ['C2O4{2-}', 'oxalate', 'c'], ['ClO{-}', 'hypochlorite', 'cl'], ['ClO2{-}', 'chlorite', 'cl'], ['ClO3{-}', 'chlorate', 'cl'], ['ClO4{-}', 'perchlorate', 'cl'], ['CrO4{2-}', 'chromate', 'cr'], ['Cr2O7{2-}', 'dichromate', 'cr'], ['MnO4{-}', 'permanganate', 'cr'], ['CN{-}', 'cyanide', 'h'], ['SCN{-}', 'thiocyanate', 's'], ['OH{-}', 'hydroxide', 'h'], ['O2{2-}', 'peroxide', 'h'], ['NO2{-}', 'nitrite', 'n'], ['NO3{-}', 'nitrate', 'n'], ['PO4{3-}', 'phosphate', 'p'], ['HPO4{2-}', 'hydrogen phosphate', 'p'], ['H2PO4{-}', 'dihydrogen phosphate', 'p'], ['SO3{2-}', 'sulfite', 's'], ['SO4{2-}', 'sulfate', 's'], ['HSO4{-}', 'hydrogen sulfate', 's'], ['S2O3{2-}', 'thiosulfate', 's']];
  const SA = [['HCl', 'hydrochloric acid'], ['HBr', 'hydrobromic acid'], ['HI', 'hydroiodic acid'], ['HNO3', 'nitric acid'], ['H2SO4', 'sulfuric acid'], ['HClO4', 'perchloric acid'], ['HClO3', 'chloric acid']];
  const SB = [['LiOH', 'lithium hydroxide'], ['NaOH', 'sodium hydroxide'], ['KOH', 'potassium hydroxide'], ['RbOH', 'rubidium hydroxide'], ['CsOH', 'cesium hydroxide'], ['Ca(OH)2', 'calcium hydroxide'], ['Sr(OH)2', 'strontium hydroxide'], ['Ba(OH)2', 'barium hydroxide']];
  const WA = [['HF', 'hydrofluoric acid'], ['HC2H3O2', 'acetic acid'], ['H2CO3', 'carbonic acid'], ['H3PO4', 'phosphoric acid'], ['HNO2', 'nitrous acid'], ['HCN', 'hydrocyanic acid'], ['H2S', 'hydrosulfuric acid'], ['HClO', 'hypochlorous acid']];
  const WB = [['NH3', 'ammonia'], ['CH3NH2', 'methylamine'], ['C5H5N', 'pyridine']];
  const charge = f => (f.match(/\{(.*)\}/) || [])[1] || '';
  const recharge = (f, c) => f.replace(/\{.*\}/, '{' + c + '}');
  function polyQ() {
    const [f, n, fam] = GH.pick(POLY), same = GH.shuf(POLY.filter(p => p[2] === fam && p[0] !== f)), other = GH.shuf(POLY.filter(p => p[2] !== fam && p[0] !== f));
    const ch = charge(f), why = `${n.replace(/ \(.*\)/, '')} is ${GH.chem(f)}, with a charge of ${/\d/.test(ch) ? ch.replace('-', '−').replace('+', '+') : '1' + ch.replace('-', '−')}.`;
    if (Math.random() < .5) { const opts = GH.shuf([n, ...same.concat(other).slice(0, 3).map(p => p[1])]); return { q: `Name this polyatomic ion: <span class="nb-f">${GH.chem(f)}</span>`, opts: opts.map(esc), ans: opts.indexOf(n), why }; }
    const c = charge(f), wrongC = c.includes('2') ? c.replace('2', '') : c === '+' ? '-' : c.replace(/^(\d?)/, d => d ? '' : '2'), cands = [f, recharge(f, wrongC), ...same.slice(0, 2).map(p => p[0]), ...other.slice(0, 2).map(p => p[0])];
    const opts = GH.shuf(cands.filter((x, i, a) => a.indexOf(x) === i).slice(0, 4)); return { q: `What is the formula of the <b>${esc(n)}</b> ion?`, opts: opts.map(GH.chem), ans: opts.indexOf(f), why };
  }
  function abQ() {
    const r = Math.random();
    if (r < .22) { const a = GH.pick(SA), opts = GH.shuf([a, ...GH.shuf(WA).slice(0, 3)]); return { q: 'Which one is a <b>strong acid</b>?', opts: opts.map(x => GH.chem(x[0]) + ` <span class="muted small">${x[1]}</span>`), ans: opts.indexOf(a), why: `The strong acids are HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄ and HClO₃. They ionize completely in water. ${a[1]} is one of them.` }; }
    if (r < .4) { const b = GH.pick(SB), opts = GH.shuf([b, ...GH.shuf(WB.concat(WA.slice(0, 3))).slice(0, 3)]); return { q: 'Which one is a <b>strong base</b>?', opts: opts.map(x => GH.chem(x[0]) + ` <span class="muted small">${x[1]}</span>`), ans: opts.indexOf(b), why: `Strong bases are the hydroxides of Group 1 metals (LiOH, NaOH, KOH, RbOH, CsOH) and the heavier Group 2 metals (Ca, Sr, Ba). ${b[1]} dissociates completely.` }; }
    if (r < .58) { const pool = [...SA.map(x => [x, 0]), ...WA.map(x => [x, 1]), ...SB.map(x => [x, 2]), ...WB.map(x => [x, 3])], [x, k] = GH.pick(pool), L = ['Strong acid', 'Weak acid', 'Strong base', 'Weak base'];
      return { q: `<span class="nb-f">${GH.chem(x[0])}</span> (${esc(x[1])}) is a…`, opts: L, ans: k, why: `${x[1]} is a ${L[k].toLowerCase()}. ${k === 0 ? 'Strong acids ionize 100% in water.' : k === 1 ? 'Weak acids only partly ionize, so most molecules stay together.' : k === 2 ? 'Strong bases release all of their OH⁻ in water.' : 'Weak bases only pick up a few H⁺ ions from water.'}` }; }
    if (r < .8) { const s = Math.random() < .55 ? GH.pick(SA) : GH.pick(SB), isA = SA.includes(s);
      const wrong = isA ? GH.shuf(SA.concat(WA).filter(x => x !== s)).slice(0, 3).map(x => x[0]) : [s[0].replace('(OH)2', 'OH'), s[0].replace('(OH)2', 'OH2'), s[0].includes('(') ? s[0].replace('(OH)2', '2OH') : s[0].replace('OH', '(OH)2')];
      const opts = GH.shuf([s[0], ...wrong.filter(w => w !== s[0])].slice(0, 4)); return { q: `What is the formula for <b>${esc(s[1])}</b>?`, opts: opts.map(GH.chem), ans: opts.indexOf(s[0]), why: `${s[1]} is ${GH.chem(s[0])}.${isA ? '' : ' Group 2 ions are 2+, so they need two OH⁻ ions in parentheses.'}` }; }
    const C = [['What does a strong acid do in water?', ['Ionizes completely into H⁺ (H₃O⁺) and its anion', 'Stays mostly as whole molecules', 'Releases OH⁻ ions', 'Turns into a base'], 'Strong = 100% ionized. That’s why 0.1 M HCl has [H⁺] = 0.1 M.'],
      ['What is the pH of 0.01 M HCl?', ['2', '1', '12', '0.01'], 'HCl ionizes completely, so [H⁺] = 0.01 = 10⁻² M and pH = −log(10⁻²) = 2.'],
      ['What is the pH of 0.001 M NaOH?', ['11', '3', '10', '0.001'], '[OH⁻] = 10⁻³ M, so pOH = 3 and pH = 14 − 3 = 11.'],
      ['Strong acid + strong base gives…', ['a salt and water', 'only hydrogen gas', 'a weak acid', 'nothing; they don’t react'], 'Neutralization: HCl + NaOH → NaCl + H₂O.'],
      ['Which ion do bases release (Arrhenius)?', ['OH⁻', 'H⁺', 'Na⁺', 'Cl⁻'], 'Arrhenius bases release hydroxide ions in water; acids release H⁺.']];
    const [q, a, why] = GH.pick(C), opts = GH.shuf(a); return { q, opts: opts.map(esc), ans: opts.indexOf(a[0]), why };
  }
  return { make: topic => (topic === 'poly' ? polyQ : topic === 'ab' ? abQ : Math.random() < .5 ? polyQ : abQ)() };
})();

/* ═══════════ Rocket Race (middle school): teams race from Earth to Neptune ═══════════
   Uses the middle school question bank. Small booster = 1 space (easy), medium = 2, big = 3 (hard).
   Gravity assists push you ahead; asteroid fields bump you back. First rocket to Neptune wins. */
const Race = {
  N: 24, nTeams: LS.get('rTeams', 3), secs: LS.get('rSecs', 30), names: LS.get('rNames', ['Team Comet', 'Team Nebula', 'Team Orbit', 'Team Quasar']), G: null, timer: 0,

  page(m) { this.stop(); this.m = m; if (this.G && !this.G.over) this.board(); else this.setup(); },
  pos(i) { const t = i / this.N, x = 60 + t * 880, y = 200 + Math.sin(t * Math.PI * 2.2) * 80; return { x, y }; },
  track() {

      if (st && st[2]) s += `<circle cx="${p.x}" cy="${p.y}" r="${st[2]}" fill="${st[1]}"/>${i === 16 ? `<ellipse cx="${p.x}" cy="${p.y}" rx="40" ry="9" fill="none" stroke="#f3e2b0" stroke-width="4" transform="rotate(-18 ${p.x} ${p.y})"/>` : ''}${i === 0 ? `<path d="M${p.x - 14},${p.y - 8} q10,-10 22,-2 q8,8 -4,14 q-10,2 -18,-12z" fill="#47c26b"/>` : ''}`;
      else if (st) s += [0, 1, 2, 3, 4].map(k => `<circle cx="${p.x - 20 + k * 10}" cy="${p.y + (k % 2 ? 10 : -10)}" r="${4 + k % 3}" fill="#8b8f98"/>`).join('');
      else s += `<circle cx="${p.x}" cy="${p.y}" r="${sp ? 10 : 6}" fill="${sp ? (sp[0] === 'boost' ? '#22e39a' : '#ff8a7a') : '#cfe0f2'}" opacity="${sp ? .9 : .55}"/>${sp ? `<text x="${p.x}" y="${p.y + 4}" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1f36" font-family="sans-serif">${sp[1] > 0 ? '+' + sp[1] : sp[1]}</text>` : ''}`;
      if (st) s += `<text x="${p.x}" y="${p.y + (st[2] || 12) + 20}" font-size="14" font-weight="700" text-anchor="middle" fill="#cfe0f2" font-family="Public Sans, sans-serif">${st[0]}</text>`; }
    G.teams.forEach((t, k) => { const p = this.pos(t.at), nx = this.pos(Math.min(this.N, t.at + .3)), ang = Math.atan2(nx.y - p.y, nx.x - p.x) * 180 / Math.PI + 90;

  },
  setup() {
    const m = this.m;

          <div style="display:grid;gap:6px"><span class="eyebrow">Answer time</span><div class="seg" id="rS">${[20, 30, 45].map(n => `<button data-v="${n}" class="${this.secs === n ? 'on' : ''}">${n} s</button>`).join('')}</div></div></div>

        <div class="row" style="justify-content:space-between">${GH.say('otter', 'grin', 'Mission control here! Questions come from life, Earth & space, and physical science.')}<button class="btn primary" id="rGo">${ico('rocket')}Start the race</button></div>

  start() { this.G = { teams: Array.from({ length: this.nTeams }, (_, i) => ({ name: this.names[i], c: this.colors[i], at: 0, right: 0 })), turn: 0, used: new Set(), over: false, cur: null }; SND.win(); this.board(); },
  teamsHTML() { const G = this.G; return `<div class="teams">${G.teams.map((t, i) => `<div class="team ${i === G.turn && !G.over ? 'turn' : ''}" style="--tc:${t.c}"><div class="nm"><i></i>${esc(t.name)}</div><div class="sc">${t.at >= this.N ? 'Neptune!' : this.where(t.at)}</div><div class="tag">${t.at}/${this.N} spaces · ${t.right} right</div></div>`).join('')}</div>`; },
  where(i) { let best = 'Earth'; Object.keys(this.STOPS).map(Number).sort((a, b) => a - b).forEach(k => { if (i >= k) best = this.STOPS[k][0]; }); return i ? 'Past ' + best : 'Earth'; },
  board(msg) {
    const G = this.G, m = this.m, t = G.teams[G.turn]; clearInterval(this.timer);
    m.innerHTML = `<div class="game"><div class="sec-h"><div style="display:grid;gap:4px"><span class="eyebrow">Rocket Race</span><h2><span style="color:${t.c === '#ffd27a' ? '#c98a12' : t.c === '#9cfff0' ? '#10958f' : t.c}">${esc(t.name)}</span>, choose your booster</h2></div><button class="btn sm" id="rEnd">End game</button></div>
      ${msg ? `<div class="rr-msg">${msg}</div>` : ''}

  },
  ask(bi) {
    const G = this.G, B = this.BOOST[bi], m = this.m, t = G.teams[G.turn];
    let pool = QBANK.ms.q.filter(q => B[2].includes(q[1]) && !G.used.has(q[2])); if (!pool.length) { G.used.clear(); pool = QBANK.ms.q.filter(q => B[2].includes(q[1])); }

    m.innerHTML = `<div class="game"><div class="qcard"><div class="qtop"><div class="row"><span class="chip">${esc(q[0])}</span><span class="chip">${B[0]} · ${B[1]} space${B[1] > 1 ? 's' : ''}</span></div><span class="who" style="color:${t.c}">${esc(t.name)} answers</span></div>

  answer(oi) {

      ${h('spill') ? `<path d="M410,580 q30,-22 70,-10 q40,-14 70,4 q20,12 -10,16 q-60,8 -120,4 q-26,-4 -10,-14z" fill="#7dd3fc" opacity=".8"/><circle cx="560" cy="570" r="5" fill="#7dd3fc"/><circle cx="574" cy="584" r="3.5" fill="#7dd3fc"/>` : ''}`;
    Object.entries(this.SPOTS).forEach(([id, sp]) => { const [x, y, w, hh] = sp.r;
      if (found.has(id)) s += `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${hh + 12}" rx="16" fill="none" stroke="#22c55e" stroke-width="6"/><circle cx="${x + w}" cy="${y}" r="15" fill="#22c55e"/><path d="M${x + w - 7},${y} l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
      else if (reveal && H.has(id)) s += `<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${hh + 12}" rx="16" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="10 6"/>`;
      s += `<rect class="hz-hit" data-s="${id}" x="${x}" y="${y}" width="${w}" height="${hh}" fill="transparent"/>`; });
    return s + '</svg>';
  },
  start(round = 0, score = 0, foundTotal = 0) {
    this.stop(); SND.ac(); const m = this.m, [k, secs] = this.ROUNDS[round];
    const ids = Object.keys(this.SPOTS), H = new Set(GH.shuf(ids).slice(0, k));
    const G = this.G = { round, H, found: new Set(), left: secs, total: secs, score, foundTotal, over: false };
    m.innerHTML = `<div class="sec-h"><div style="display:grid;gap:2px"><span class="eyebrow">Hazard Hunt · round ${round + 1} of 3</span><h2>Find ${k} hazards</h2></div><div class="row"><button class="btn sm" id="hHint">Hint (−10 s)</button><button class="btn sm" id="hQ">Quit</button></div></div>
      <div class="gm-hud"><div><span class="eyebrow">Time</span><b class="mono" id="hT">${secs}</b></div><div><span class="eyebrow">Found</span><b class="mono" id="hF">0/${k}</b></div><div><span class="eyebrow">Score</span><b class="mono" id="hS">${score}</b></div><div><span class="eyebrow">Round</span><b class="mono">${round + 1}/3</b></div></div>
      <div class="hz-wrap"><div class="hz-stage"><div class="nb-timer"><i id="hBar"></i></div><div id="hScene">${this.scene(H)}</div><div class="gm-over" id="hOv" hidden></div></div>
        <aside class="hz-side"><div id="hSay">${GH.say('sheep', 'think', 'Click anything that looks unsafe.', 50)}</div><div class="hz-list" id="hList"></div></aside></div>`;
    $('#hQ', m).onclick = () => { this.stop(); this.menu(); };
    $('#hHint', m).onclick = () => { const left = [...G.H].filter(x => !G.found.has(x)); if (!left.length || G.over) return; const id = GH.pick(left), [x, y, w, h] = this.SPOTS[id].r; G.left = Math.max(1, G.left - 10);
      const svg = $('#hzSvg'), c = sv('circle', { cx: x + w / 2, cy: y + h / 2, r: Math.max(w, h) * .75, fill: 'none', stroke: '#facc15', 'stroke-width': 6, class: 'hz-pulse' }, svg); setTimeout(() => c.remove(), 2200); };
    this.bind(); this.list();
    let last = performance.now();
    const loop = now => { if (G.dead) return; const dt = Math.min(.1, (now - last) / 1000); last = now;
      if (!G.over) { G.left -= dt; if (G.left <= 0) { G.left = 0; this.end(false); } const t = $('#hT'); if (t) t.textContent = Math.ceil(G.left); const b = $('#hBar'); if (b) b.style.width = G.left / G.total * 100 + '%'; }
      this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  },
  bind() {
    const G = this.G, svg = $('#hzSvg');
    svg.addEventListener('click', e => {
      if (G.over) return; const id = e.target.dataset && e.target.dataset.s, p = (() => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); })();
      if (id && G.H.has(id) && !G.found.has(id)) { G.found.add(id); G.score += 100; SND.ok(); $('#hScene').innerHTML = this.scene(G.H, G.found); this.bind(); this.list(id);
        $('#hSay').innerHTML = GH.say('sheep', 'happy', `<b>${this.SPOTS[id].name}!</b> ${this.SPOTS[id].why}`, 50);
        if (G.found.size === G.H.size) this.end(true); return; }
      if (id && G.found.has(id)) return;
      G.left = Math.max(0, G.left - 2); SND.nope(); const x = sv('g', { transform: `translate(${p.x} ${p.y})` }, svg); x.innerHTML = `<path d="M-12,-12 L12,12 M12,-12 L-12,12" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/><text y="-20" font-size="18" font-weight="800" text-anchor="middle" fill="#ef4444" font-family="sans-serif">−2 s</text>`; setTimeout(() => x.remove(), 700);
      if (id) $('#hSay').innerHTML = GH.say('sheep', 'think', 'That one looks safe. Keep looking!', 50);
    });
  },
  list(newId) { const G = this.G; $('#hF').textContent = `${G.found.size}/${G.H.size}`; $('#hS').textContent = G.score;
    $('#hList').innerHTML = [...G.found].reverse().map(id => `<div class="hz-item ${id === newId ? 'new' : ''}"><b>✓ ${this.SPOTS[id].name}</b><span class="small muted">${this.SPOTS[id].why}</span></div>`).join('') || '<div class="small muted">Hazards you find are listed here.</div>'; },
  end(all) {
    const G = this.G; G.over = true; const bonus = all ? Math.round(G.left) * 10 : 0; G.score += bonus; G.foundTotal += G.found.size;
    $('#hScene').innerHTML = this.scene(G.H, G.found, true); all ? (SND.win(), confetti(1600)) : SND.wah();
    const missed = [...G.H].filter(x => !G.found.has(x)), last = G.round >= this.ROUNDS.length - 1, o = $('#hOv'); o.hidden = false; o.classList.add('hz-ov');
    if (!all || last) GH.report('g-hazard', { score: G.score, mistakes: missed.length, stars: all && last ? 3 : G.foundTotal >= 12 ? 2 : 1, review: 'Missed: ' + missed.map(id => this.SPOTS[id].name).join(', ') });
    o.innerHTML = `<div class="gm-card">${GH.say('sheep', all ? 'happy' : 'oops', all ? `All ${G.H.size} hazards found! Time bonus +${bonus}.` : `Time’s up! You found ${G.found.size} of ${G.H.size}. The red boxes show what you missed.`, 60)}
      ${missed.length ? `<div style="display:grid;gap:6px"><span class="eyebrow">Missed</span>${missed.map(id => `<div class="mist-row"><b>${this.SPOTS[id].name}</b> <span class="small muted">${this.SPOTS[id].why}</span></div>`).join('')}</div>` : ''}
      ${all && !last ? `<div class="row"><button class="btn primary" id="hNx">${ico('play')}Round ${G.round + 2}: ${this.ROUNDS[G.round + 1][0]} hazards</button><button class="btn" id="hSee">See the room</button></div>` : `<div class="gm-tiles"><div><span class="eyebrow">Score</span><b>${G.score}</b></div><div><span class="eyebrow">Hazards found</span><b>${G.foundTotal}</b></div><div><span class="eyebrow">Rounds</span><b>${G.round + (all ? 1 : 0)}/3</b></div></div><div id="hSv"></div><div class="row"><button class="btn primary" id="hA">${ico('play')}Play again</button><button class="btn" id="hSee">See the room</button></div>`}</div>`;
    const nx = $('#hNx', o); if (nx) nx.onclick = () => this.start(G.round + 1, G.score, G.foundTotal);
    $('#hSee', o).onclick = () => { o.hidden = true; const b = document.createElement('button'); b.className = 'btn sm hz-back'; b.textContent = 'Show results'; b.onclick = () => { o.hidden = false; b.remove(); }; $('.hz-stage').appendChild(b); };
    const sv2 = $('#hSv', o); if (sv2) GH.saveRow(sv2, 'hName', n => { const r = GH.save('hazard', { n, s: G.score, f: G.foundTotal, r: G.round + (all ? 1 : 0), d: new Date().toISOString() }, (a, b) => b.s - a.s); return r >= 0 ? `Saved: #${r + 1} on the board.` : 'Saved (not in the top 10 yet).'; });
    const a = $('#hA', o); if (a) a.onclick = () => this.start();
  }
};

/* ═══════════ Word Launch (middle school vocabulary): guess the science word to fuel Pippin's rocket ═══════════
   A clue appears; click letters (or type them). Each wrong letter drains a fuel cell. Spell the word to launch.
   Run out of fuel and the rocket fizzles on the pad (no crash, just a puff of smoke). Three fizzles ends the mission. */
const Launch = {
  WORDS: {
    life: { name: 'Life science', w: [['CELL', 'The basic unit of all living things'], ['NUCLEUS', 'Control center of the cell that holds the DNA'], ['PHOTOSYNTHESIS', 'How plants use light to make sugar'], ['CHLOROPLAST', 'Organelle where photosynthesis happens'], ['PRODUCER', 'An organism that makes its own food'], ['CONSUMER', 'An organism that eats other organisms'], ['DECOMPOSER', 'Breaks down dead matter and recycles nutrients'], ['ECOSYSTEM', 'Living and nonliving things interacting in one area'], ['HABITAT', 'The place where an organism lives'], ['ADAPTATION', 'A trait that helps an organism survive'], ['GENE', 'A section of DNA that codes for a trait'], ['HEREDITY', 'Passing traits from parents to offspring'], ['ORGANISM', 'Any living thing'], ['TISSUE', 'A group of similar cells working together'], ['FOSSIL', 'Preserved remains or traces of ancient life'], ['PREDATOR', 'An animal that hunts other animals'], ['MEMBRANE', 'Thin layer that controls what enters and leaves the cell']] },
    earth: { name: 'Earth & space', w: [['ROTATION', 'Earth spinning on its axis, which causes day and night'], ['REVOLUTION', 'One full trip around the Sun: one year'], ['ORBIT', 'The curved path of one object around another'], ['GRAVITY', 'The force that pulls masses toward each other'], ['ECLIPSE', 'When one space object blocks the light to another'], ['GALAXY', 'A huge system of billions of stars'], ['ATMOSPHERE', 'The layer of gases around Earth'], ['EROSION', 'Wind, water or ice carrying weathered rock away'], ['WEATHERING', 'Breaking rock into smaller pieces'], ['MAGMA', 'Melted rock below Earth’s surface'], ['EARTHQUAKE', 'Shaking caused by moving tectonic plates'], ['GLACIER', 'A large, slow-moving body of ice'], ['CONDENSATION', 'Water vapor turning into liquid, like clouds forming'], ['EVAPORATION', 'Liquid water turning into water vapor'], ['CLIMATE', 'The long-term weather pattern of a place'], ['TECTONIC', 'Word for the giant moving plates of Earth’s crust'], ['METEOR', 'A space rock burning up in the atmosphere']] },
    phys: { name: 'Physical science', w: [['ATOM', 'The smallest unit of an element'], ['MOLECULE', 'Two or more atoms bonded together'], ['DENSITY', 'Mass divided by volume'], ['FRICTION', 'The force that resists objects sliding past each other'], ['INERTIA', 'An object’s tendency to resist a change in motion'], ['ENERGY', 'The ability to do work or cause change'], ['VELOCITY', 'Speed in a given direction'], ['CONDUCTOR', 'A material that lets heat or electricity flow easily'], ['INSULATOR', 'A material that slows the flow of heat or electricity'], ['WAVELENGTH', 'The distance from one wave crest to the next'], ['ELEMENT', 'A pure substance made of only one kind of atom'], ['MIXTURE', 'Substances combined without bonding'], ['SOLUTION', 'A mixture that is evenly mixed, like salt water'], ['VOLUME', 'The amount of space something takes up'], ['MASS', 'The amount of matter in an object'], ['MAGNET', 'An object that attracts iron'], ['NEWTON', 'The unit of force']] }
  },
  cats: LS.get('lCats', ['life', 'earth', 'phys']), G: null, FUEL: 6,
  stop() { clearTimeout(this.to); if (this.G) this.G.dead = true; GH.onKey(null); },
  page(m) { this.stop(); this.m = m; this.menu(); },
  menu() {
    const m = this.m;
    m.innerHTML = `${GH.head('Vocabulary · mouse or keyboard', 'Word Launch', 'Pippin’s rocket needs a science word to launch. Read the clue and pick letters. Every wrong letter drains one of six fuel cells. Spell the word before the fuel runs out to blast off! Three fizzles on the launch pad ends the mission.')}
      <section class="setup">
        <div style="display:grid;gap:8px"><span class="eyebrow">Word sets</span><div class="row">${Object.entries(this.WORDS).map(([k, t]) => `<label class="check gm-pill" for="lw-${k}"><input type="checkbox" id="lw-${k}" data-c="${k}" ${this.cats.includes(k) ? 'checked' : ''}>${t.name}</label>`).join('')}</div></div>
        <div class="row" style="justify-content:space-between">${GH.say('otter', 'grin', 'Captain Pippin, ready for launch. Good vibes and good spelling!')}<button class="btn primary" id="lGo">${ico('rocket')}Start</button></div><div class="err small" id="lErr"></div>
      </section>
      <section class="sec"><div class="sec-h"><h2>High scores</h2>${GH.board('launch').length ? '<button class="btn sm" id="lClr">Clear</button>' : ''}</div>
        ${GH.boardHTML('launch', [['Name', r => esc(r.n)], ['Score', r => r.s, 'mono'], ['Launches', r => r.c, 'mono'], ['Best streak', r => r.k, 'mono']])}</section>`;
    $$('[data-c]', m).forEach(cb => cb.onchange = () => { this.cats = $$('[data-c]', m).filter(x => x.checked).map(x => x.dataset.c); LS.set('lCats', this.cats); });
    $('#lGo', m).onclick = () => { if (!this.cats.length) { $('#lErr', m).textContent = 'Choose at least one word set.'; return; } this.start(); };
    const c = $('#lClr', m); if (c) c.onclick = () => { if (c.dataset.sure) { LS.set('hs.launch', []); this.menu(); } else { c.dataset.sure = 1; c.textContent = 'Click again to clear'; c.classList.add('warn'); } };
  },
  pad(fuel, state = '') {
    return `<svg viewBox="0 0 300 380" class="wl-pad"><rect width="300" height="380" fill="#0b1f36"/>${Array.from({ length: 30 }, (_, i) => `<circle cx="${(i * 97) % 300}" cy="${(i * 61) % 300}" r="${i % 4 ? 1 : 1.6}" fill="#fff" opacity=".55"/>`).join('')}
      <rect x="0" y="340" width="300" height="40" fill="#1a3a5c"/><rect x="70" y="318" width="160" height="24" rx="4" fill="#4b5563"/><rect x="200" y="140" width="10" height="180" fill="#6b7280"/><path d="M200,170 h-36 M200,230 h-30" stroke="#6b7280" stroke-width="6"/>
      <g class="wl-rocket ${state}"><g transform="translate(150 226) scale(2.6)">${rocketArt('#ff8a7a', state === 'go')}</g><circle cx="150" cy="231" r="17" fill="#cfe9ff"/><g transform="translate(126 211)">${charFace('otter', state === 'fizz' ? 'oops' : state === 'go' ? 'happy' : 'grin', 48)}</g></g>
      ${state === 'fizz' ? `<g class="wl-smoke">${[0, 1, 2, 3, 4].map(i => `<circle cx="${120 + i * 15}" cy="${320 - (i % 2) * 14}" r="${18 + (i % 3) * 6}" fill="#9ca3af" opacity=".8"/>`).join('')}<text x="150" y="372" font-size="24" font-weight="800" text-anchor="middle" fill="#ffd27a" stroke="#0b1f36" stroke-width="5" paint-order="stroke" font-family="Bricolage Grotesque, sans-serif">fizzle…</text></g>` : ''}
      <g transform="translate(24 120)">${Array.from({ length: this.FUEL }, (_, i) => `<rect x="0" y="${(this.FUEL - 1 - i) * 30}" width="34" height="24" rx="5" fill="${i < fuel ? (fuel <= 2 ? '#ff8a7a' : '#22e39a') : '#1f3b5a'}" stroke="#9cfff0" stroke-opacity=".35"/>`).join('')}<text x="17" y="${this.FUEL * 30 + 14}" font-size="12" font-weight="800" text-anchor="middle" fill="#9cfff0" font-family="sans-serif">FUEL</text></g></svg>`;
  },
  start() {
    this.stop(); SND.ac(); const m = this.m;
    const pool = GH.shuf(this.cats.flatMap(c => this.WORDS[c].w.map(w => [...w, this.WORDS[c].name])));
    const G = this.G = { pool, lives: 3, score: 0, launches: 0, streak: 0, best: 0, miss: [] };
    m.innerHTML = `<div class="sec-h"><div style="display:grid;gap:2px"><span class="eyebrow">Word Launch</span><h2>Spell it to launch!</h2></div><div class="row"><button class="btn sm" id="lQ">Quit</button></div></div>
      <div class="gm-hud"><div><span class="eyebrow">Score</span><b class="mono" id="lSc">0</b></div><div><span class="eyebrow">Launches</span><b class="mono" id="lN">0</b></div><div><span class="eyebrow">Rockets left</span><b id="lL"></b></div><div><span class="eyebrow">Streak</span><b class="mono" id="lSt">0</b></div></div>
      <div class="nb-stage wl-stage"><div class="nb-left" id="lPad"></div>
        <div class="nb-q"><span class="eyebrow" id="lCat"></span><div class="wl-clue" id="lClue"></div><div class="wl-word" id="lW"></div><div class="wl-keys" id="lK"></div><div id="lX" class="nb-x"></div></div>
        <div class="gm-over" id="lOv" hidden></div></div>`;
    $('#lQ', m).onclick = () => { this.stop(); this.menu(); };
    GH.onKey(e => { const k = e.key.toUpperCase(); if (/^[A-Z]$/.test(k)) this.guess(k); else if (e.key === 'Enter') { const n = $('#lNx'); if (n) n.click(); } });
    this.lives(); this.next();
  },
  lives() { const G = this.G; $('#lL').innerHTML = [0, 1, 2].map(i => `<svg viewBox="-24 -36 48 80" width="16" height="26" style="vertical-align:middle;opacity:${i < G.lives ? 1 : .25}">${rocketArt('#ff8a7a', false)}</svg>`).join(' '); },
  next() {
    const G = this.G; if (!G.pool.length) G.pool = GH.shuf(this.cats.flatMap(c => this.WORDS[c].w.map(w => [...w, this.WORDS[c].name])));
    const [word, clue, cat] = G.pool.pop(); G.cur = { word, clue, cat, got: new Set(), bad: new Set(), fuel: this.FUEL, done: false };
    $('#lCat').textContent = cat + ' · ' + word.length + ' letters'; $('#lClue').textContent = clue; $('#lX').innerHTML = '';
    $('#lK').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => `<button data-k="${c}">${c}</button>`).join('');
    $$('#lK button').forEach(b => b.onclick = () => this.guess(b.dataset.k));
    this.draw();
  },
  draw(state) { const C = this.G.cur; $('#lPad').innerHTML = this.pad(C.fuel, state); $('#lW').innerHTML = C.word.split('').map(c => `<span class="${C.got.has(c) ? 'on' : C.done ? 'miss' : ''}">${C.got.has(c) || C.done ? c : ''}</span>`).join(''); },
  guess(k) {
    const G = this.G; if (!G || G.dead) return; const C = G.cur; if (!C || C.done || C.got.has(k) || C.bad.has(k)) return;
    const b = $(`#lK [data-k="${k}"]`); if (b) b.disabled = true;
    if (C.word.includes(k)) { C.got.add(k); if (b) b.classList.add('right'); SND.tone(700, .07, 'triangle', .07); }
    else { C.bad.add(k); C.fuel--; if (b) b.classList.add('wrong'); SND.nope(); }
    const win = C.word.split('').every(c => C.got.has(c));
    if (win) return this.win(); if (C.fuel <= 0) return this.fizz(); this.draw();
  },
  win() {
    const G = this.G, C = G.cur; C.done = true; G.launches++; G.streak++; G.best = Math.max(G.best, G.streak);
    const pts = (100 + C.fuel * 25) * Math.min(4, 1 + Math.floor(G.streak / 3)); G.score += pts; this.draw('go'); SND.win(); SND.noise(1.2, 300, .2, .6, 'lowpass');
    $('#lX').innerHTML = `${GH.say('otter', 'happy', `<b>${C.word}</b>! Liftoff! +${pts}`, 46)}<button class="btn primary" id="lNx">Next word</button>`; $('#lNx').onclick = () => this.next(); this.hud();
  },
  fizz() {
    const G = this.G, C = G.cur; C.done = true; G.lives--; G.streak = 0; G.miss.push(C); this.lives(); this.draw('fizz'); SND.fizz(); SND.wah();
    $('#lX').innerHTML = `${GH.say('otter', 'oops', `Out of fuel! The word was <b>${C.word}</b>.`, 46)}<button class="btn primary" id="lNx">${G.lives > 0 ? 'Next word' : 'See results'}</button>`;
    $('#lNx').onclick = () => G.lives > 0 ? this.next() : this.over(); this.hud();
  },
  hud() { const G = this.G; $('#lSc').textContent = G.score; $('#lN').textContent = G.launches; $('#lSt').textContent = G.streak; },
  over() {
    const G = this.G, o = $('#lOv'); o.hidden = false; GH.onKey(null); GH.report('g-launch', { score: G.score, mistakes: G.miss.length, stars: G.launches >= 8 ? 3 : G.launches >= 4 ? 2 : 1, review: 'Missed: ' + G.miss.map(c => c.word).join(', ') });
    o.innerHTML = `<div class="gm-card">${GH.say('otter', G.launches >= 8 ? 'happy' : 'sleepy', G.launches >= 8 ? 'What a mission! Good vibes, Captain.' : 'Mission over. Time for a nap, then let’s fly again!', 64)}
      <div class="gm-tiles"><div><span class="eyebrow">Score</span><b>${G.score}</b></div><div><span class="eyebrow">Launches</span><b>${G.launches}</b></div><div><span class="eyebrow">Best streak</span><b>${G.best}</b></div></div>
      ${G.miss.length ? `<div style="display:grid;gap:6px"><span class="eyebrow">Words to review</span>${G.miss.map(c => `<div class="mist-row"><b>${c.word}</b>: ${esc(c.clue)}</div>`).join('')}</div>` : ''}
      <div id="lSv"></div><div class="row"><button class="btn primary" id="lA">${ico('play')}Play again</button><button class="btn" id="lM">Change word sets</button></div></div>`;
    GH.saveRow($('#lSv', o), 'lName', n => { const r = GH.save('launch', { n, s: G.score, c: G.launches, k: G.best, d: new Date().toISOString() }, (a, b) => b.s - a.s); return r >= 0 ? `Saved: #${r + 1} on the board.` : 'Saved (not in the top 10 yet).'; });
    $('#lA', o).onclick = () => this.start(); $('#lM', o).onclick = () => { this.stop(); this.menu(); };
  }
};

boot();
</script>
