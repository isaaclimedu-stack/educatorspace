const Game = {
  G: null, band: LS.get('gBand', 'hs'), nTeams: LS.get('gTeams', 3), secs: LS.get('gSecs', 30),
  names: LS.get('gNames', ['Team Helix', 'Team Quark', 'Team Magma', 'Team Nova']),
  colors: ['#e2572b', '#2f7fd6', '#2fa25a', '#9b59d0'],
  page(m) { this.m = m; if (!this.G) this.setup(); else if (this.G.cur) this.question(); else if (this.G.over) this.final(); else this.board(); },
  setup() {
    const m = this.m;
    m.innerHTML = `<header style="display:grid;gap:6px"><span class="eyebrow">Class game · project it on the board</span><h1>Science Showdown</h1><p class="muted" style="max-width:64ch">Teams take turns choosing a category and point value. Get it wrong and the next team can steal it for half the points. One tile is a hidden <b>Lab Bonus</b> worth double.</p></header>
      <section class="setup">
        <div class="row" style="gap:18px;align-items:flex-start">
          <div style="display:grid;gap:6px"><span class="eyebrow">Question set</span><div class="seg" id="sBand"><button data-v="hs" class="${this.band === 'hs' ? 'on' : ''}">High School</button><button data-v="ms" class="${this.band === 'ms' ? 'on' : ''}">Middle School</button></div></div>
          <div style="display:grid;gap:6px"><span class="eyebrow">Teams</span><div class="seg" id="sTeams">${[2, 3, 4].map(n => `<button data-v="${n}" class="${this.nTeams === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
          <div style="display:grid;gap:6px"><span class="eyebrow">Answer time</span><div class="seg" id="sSecs">${[15, 30, 45].map(n => `<button data-v="${n}" class="${this.secs === n ? 'on' : ''}">${n} s</button>`).join('')}</div></div>
        </div>
        <div class="small muted">Categories: ${QBANK[this.band].cats.join(' · ')}</div>
        <div class="tn-grid">${Array.from({ length: this.nTeams }, (_, i) => `<label class="fld" for="tn${i}"><span style="display:flex;gap:8px;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:${this.colors[i]};display:inline-block"></i>Team ${i + 1}</span><input type="text" id="tn${i}" maxlength="22" value="${esc(this.names[i])}"></label>`).join('')}</div>
        <div class="row"><button class="btn primary" id="gStart">${ico('play')}Start the showdown</button></div>
      </section>`;
    const seg = (id, key, num) => $$(`#${id} button`, m).forEach(b => b.onclick = () => { this[key] = num ? +b.dataset.v : b.dataset.v; LS.set({ band: 'gBand', nTeams: 'gTeams', secs: 'gSecs' }[key], this[key]); this.saveNames(); this.setup(); });
    seg('sBand', 'band'); seg('sTeams', 'nTeams', 1); seg('sSecs', 'secs', 1);
    $('#gStart', m).onclick = () => { this.saveNames(); this.start(); };
  },
  saveNames() { for (let i = 0; i < 4; i++) { const el = $('#tn' + i); if (el) this.names[i] = el.value.trim() || `Team ${i + 1}`; } LS.set('gNames', this.names); },
  start() {
    const B = QBANK[this.band], tiles = {};
    for (const c of B.cats) for (const v of [100, 200, 300, 400, 500]) { const pool = B.q.filter(q => q[0] === c && q[1] === v); tiles[c + v] = { c, v, q: pool[Math.random() * pool.length | 0], used: false }; }
    const keys = Object.keys(tiles).filter(k => tiles[k].v >= 300); tiles[keys[Math.random() * keys.length | 0]].bonus = true;
    this.G = { cats: B.cats, tiles, teams: Array.from({ length: this.nTeams }, (_, i) => ({ name: this.names[i], c: this.colors[i], s: 0, tag: '' })), turn: 0, cur: null, over: false };
    SND.win(); this.board();
  },
  teamsHTML(active) { return `<div class="teams">${this.G.teams.map((t, i) => `<div class="team ${i === active ? 'turn' : ''}" style="--tc:${t.c}"><div class="nm"><i></i>${esc(t.name)}</div><div class="sc">${t.s}</div><div class="tag">${esc(t.tag || (i === active ? 'Your turn' : ''))}</div></div>`).join('')}</div>`; },
  board() {
    const G = this.G, m = this.m; G.teams.forEach(t => t.tag = ''); clearInterval(this.timer);
    const left = Object.values(G.tiles).filter(t => !t.used).length;
    if (!left) { G.over = true; return this.final(); }
    m.innerHTML = `<div class="game"><div class="sec-h"><div style="display:grid;gap:4px"><span class="eyebrow">Science Showdown · ${this.band === 'hs' ? 'High School' : 'Middle School'}</span><h2><span style="color:${G.teams[G.turn].c}">${esc(G.teams[G.turn].name)}</span>, pick a tile</h2></div><div class="row"><span class="chip">${left} tiles left</span><button class="btn sm" id="gEnd">End game</button></div></div>
      ${this.teamsHTML(G.turn)}
      <div class="board"><div class="cats">${G.cats.map(c => `<div class="cat">${esc(c)}</div>`).join('')}</div>
      ${[100, 200, 300, 400, 500].map(v => `<div class="rw">${G.cats.map(c => { const t = G.tiles[c + v]; return `<button class="tile ${t.used ? 'used' : ''}" data-k="${esc(c + v)}" ${t.used ? 'disabled aria-label="used"' : ''}>${v}</button>`; }).join('')}</div>`).join('')}</div></div>`;
    $$('.tile:not(.used)', m).forEach(b => b.onclick = () => this.pick(b.dataset.k));
    $('#gEnd', m).onclick = e => { const b = e.currentTarget; if (b.dataset.sure) { G.over = true; this.final(); } else { b.dataset.sure = 1; b.textContent = 'Click again to end'; b.classList.add('warn'); } };
  },
  pick(k) {
    const G = this.G, t = G.tiles[k]; t.used = true; SND.pick();
    const order = [0, 1, 2, 3].sort(() => Math.random() - .5);
    G.cur = { t, order, team: G.turn, steal: false, tried: [], done: false };
    this.question();
  },
  question() {
    const G = this.G, C = G.cur, t = C.t, q = t.q, m = this.m, team = G.teams[C.team], pts = t.bonus ? t.v * 2 : C.steal ? t.v / 2 : t.v;
    m.innerHTML = `<div class="game">${this.teamsHTML(C.team)}
      <div class="qcard"><div class="qtop"><div class="row"><span class="chip">${esc(t.c)}</span><span class="chip">${pts} points</span>${t.bonus ? '<span class="chip" style="background:#ffd27a;color:#102a2c">Lab Bonus · double points</span>' : ''}${C.steal ? '<span class="chip" style="background:#e2572b">Steal!</span>' : ''}</div><span class="who" style="color:${team.c === '#2f7fd6' ? '#8fc2ff' : '#ffd27a'}">${esc(team.name)} answers</span></div>
        <div class="timer"><i id="qT"></i></div>
        <div class="qq">${esc(q[2])}</div>
        <div class="ans">${C.order.map((oi, j) => `<button data-o="${oi}" ${C.tried.includes(oi) ? 'disabled class="wrong"' : ''}><b>${'ABCD'[j]}</b><span>${esc(q[3][oi])}</span></button>`).join('')}</div>
        <div id="qX"></div></div></div>`;
    if (t.bonus && !C.steal && !C.shown) { C.shown = true; SND.win(); }
    $$('.ans button:not([disabled])', m).forEach(b => b.onclick = () => this.answer(+b.dataset.o));
    const total = C.steal ? Math.max(10, Math.round(this.secs / 2)) : this.secs, t0 = Date.now(); clearInterval(this.timer);
    this.timer = setInterval(() => { const el = $('#qT'); if (!el) return clearInterval(this.timer); const left = total - (Date.now() - t0) / 1000; el.style.width = clamp(left / total, 0, 1) * 100 + '%'; if (left < 5 && left > 0 && Math.abs(left - Math.round(left)) < .06) SND.tick(); if (left <= 0) { clearInterval(this.timer); this.answer(-1); } }, 50);
  },
  answer(oi) {
    const G = this.G, C = G.cur; if (!C || C.done) return; clearInterval(this.timer);
    const t = C.t, q = t.q, ok = oi === 0, team = G.teams[C.team], pts = t.bonus ? t.v * 2 : C.steal ? t.v / 2 : t.v;
    if (oi >= 0) C.tried.push(oi);
    if (ok) { team.s += pts; team.tag = `+${pts}`; SND.win(); return this.reveal(true, `${team.name} gets ${pts} points.`); }
    SND.nope();
    if (!C.steal && !t.bonus && G.teams.length > 1) {
      team.tag = oi < 0 ? 'Time’s up' : 'Missed';
      C.steal = true; C.team = (C.team + 1) % G.teams.length;
      const m = this.m; const btn = oi >= 0 ? $(`.ans button[data-o="${oi}"]`, m) : null; if (btn) btn.classList.add('wrong');
      $('#qX', m).innerHTML = `<div class="exp">${oi < 0 ? 'Time’s up!' : 'Not quite.'} <b>${esc(G.teams[C.team].name)}</b> can steal it for ${t.v / 2} points.</div><div class="row" style="margin-top:12px"><button class="btn primary" id="qSt">${esc(G.teams[C.team].name)}: steal</button></div>`;
      $$('.ans button', m).forEach(b => b.disabled = true); $('#qSt', m).onclick = () => this.question(); return;
    }
    team.tag = oi < 0 ? 'Time’s up' : 'Missed'; this.reveal(false, 'Nobody got it this time.');
  },
  reveal(ok, line) {
    const G = this.G, C = G.cur, q = C.t.q, m = this.m; C.done = true;
    $$('.ans button', m).forEach(b => { b.disabled = true; if (+b.dataset.o === 0) { b.classList.add('right'); b.classList.remove('wrong'); } });
    $$('.team', m).forEach((el, i) => { el.querySelector('.sc').textContent = G.teams[i].s; el.querySelector('.tag').textContent = G.teams[i].tag; });
    $('#qX', m).innerHTML = `<div class="exp"><b>${esc(line)}</b> ${esc(q[4])}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="qB">Back to the board</button></div>`;
    $('#qB', m).onclick = () => { G.turn = (G.turn + 1) % G.teams.length; G.cur = null; this.board(); };
    if (ok) confetti(1200);
  },
  final() {
    const G = this.G, m = this.m; clearInterval(this.timer); const rank = G.teams.slice().sort((a, b) => b.s - a.s), top = rank[0].s, winners = rank.filter(t => t.s === top);
    m.innerHTML = `<div class="game"><header style="display:grid;gap:6px"><span class="eyebrow">Final scores</span><h1>${winners.length > 1 ? 'It’s a tie!' : `<span style="color:${winners[0].c}">${esc(winners[0].name)}</span> wins!`}</h1></header>
      <div class="teams">${rank.map((t, i) => `<div class="team ${t.s === top ? 'turn' : ''}" style="--tc:${t.c}"><div class="nm"><i></i>${i + 1}. ${esc(t.name)}</div><div class="sc">${t.s}</div></div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="fA">Play again with the same teams</button><button class="btn" id="fN">New setup</button></div></div>`;
    $('#fA', m).onclick = () => this.start(); $('#fN', m).onclick = () => { this.G = null; this.setup(); };
    SND.win(); confetti(3000);
  }
};

/* ═══════════ Line-model (skeletal) molecules for Molecule Blaster ═══════════
   Built from bond geometry: every bond is 1 unit long, angles in degrees (y up). Carbons are corners and line ends;
   other atoms are labeled. Each molecule belongs to one macromolecule class. */
const MOLCLASS = {
  carb: { name: 'Carbohydrates', one: 'carbohydrate', tip: 'Rings (or chains) with an O in the ring and an OH on almost every carbon.' },
  protein: { name: 'Proteins', one: 'protein', tip: 'An N–C–C(=O) backbone repeating: amine (H₂N or N–H) and carbonyl groups. Amino acids and peptides.' },
  lipid: { name: 'Lipids', one: 'lipid', tip: 'Long zig-zag hydrocarbon chains with few O atoms, or four fused rings (steroids).' },
  nucleic: { name: 'Nucleic acids', one: 'nucleic acid', tip: 'Nucleotides: a phosphate (P), a five-carbon sugar ring, and a nitrogen base ring with several N atoms.' }
};
function Mol(name, cls) {

    G.power.forEach(p => { p.y += p.vy * dt; p.ph += dt; }); G.power = G.power.filter(p => p.y < 660 && !p.dead);
    for (const e of G.enemies) { e.x += e.vx * dt; e.y += e.vy * dt; if (e.x < 60 || e.x > 940) e.vx *= -1; e.ph += dt;
      if (Math.hypot(e.x - G.sx, e.y - G.sy) < e.r * .8 + 18) { e.dead = true; this.boom(e.x, e.y, '#ff5f7e', 34); this.hurt(e.target ? 'You crashed into a molecule.' : 'Collision!'); }
      if (e.y > 680) { e.dead = true; if (e.target) { G.combo = 0; G.escaped++; this.say(clamp(e.x, 80, 920), 600, `Missed ${e.mol.name.split(' (')[0]}`, '#ffd27a'); } } }
    for (const b of G.bullets) {
      for (const e of G.enemies) { if (e.dead || b.dead) continue; if (Math.hypot(b.x - e.x, b.y - e.y) < e.r) { b.dead = true; e.dead = true; this.hit(e); } }
      for (const p of G.power) { if (!p.dead && Math.hypot(b.x - p.x, b.y - p.y) < 26) { b.dead = true; p.dead = true; this.boom(p.x, p.y, '#ffd27a', 30); SND.win();
        if (p.kind === 'shield') { G.shields = Math.min(3, G.shields + 1); this.say(p.x, p.y, '+1 SHIELD', '#7dff9a', true); } else { G.spread = 8; this.say(p.x, p.y, 'ENZYME BOOST: SPREAD SHOT', '#ffd27a', true); } } }
    }
    G.bullets = G.bullets.filter(b => !b.dead); G.enemies = G.enemies.filter(e => !e.dead);
    G.parts.forEach(p => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; }); G.parts = G.parts.filter(p => p.age < p.life);
    G.texts.forEach(t => { t.age += dt; t.y -= 30 * dt; }); G.texts = G.texts.filter(t => t.age < t.life);
    if (G.banner) { G.banner.life -= dt; if (G.banner.life <= 0) G.banner = null; }
    G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 2);
  },
  hit(e) {
    const G = this.G;
    if (e.target) { G.good++; G.combo++; G.best = Math.max(G.best, G.combo); const mult = Math.min(5, 1 + Math.floor(G.combo / 3)), pts = 100 * mult; G.score += pts; G.levelHits++;
      this.boom(e.x, e.y, '#7dff9a'); SND.tone(520, .07, 'triangle', .07, 980); this.say(e.x, e.y, `+${pts}${mult > 1 ? ' ×' + mult : ''}`, '#7dff9a');
      if (G.D.names === 'hit') this.say(e.x, e.y + 22, e.mol.name.split(' (')[0], '#c9f6ff');
      if (G.levelHits >= 8) { G.level++; G.levelHits = 0; SND.win();
        if (this.mode === 'rotate') { const opts = ['carb', 'protein', 'lipid', 'nucleic'].filter(k => k !== G.target); G.target = opts[Math.random() * opts.length | 0]; this.setMis(); this.banner(`Level ${G.level}! New mission: ${MOLCLASS[G.target].name.toUpperCase()}`); G.enemies.forEach(x => x.target = x.mol.cls === G.target); }
        else this.banner(`Level ${G.level}: faster molecules!`); } }
    else { G.bad++; G.score = Math.max(0, G.score - 150); G.wrong.push({ mol: e.mol, target: G.target }); this.boom(e.x, e.y, '#ff5f7e'); this.say(e.x, e.y, `−150  That was a ${MOLCLASS[e.mol.cls].one}!`, '#ff8a9a'); this.hurt(); }
  },
  hurt() { const G = this.G; G.shields--; G.combo = 0; G.shake = 12; G.flash = 1; SND.nope(); SND.noise(.25, 300, .2, .7, 'lowpass'); if (G.shields <= 0) { G.over = true; SND.wah(); setTimeout(() => this.gameOver(), 900); } },
  draw() {
    const G = this.G, g = G.g; if (!G) return; g.save(); if (G.shake) g.translate(rnd(-G.shake, G.shake) * .5, rnd(-G.shake, G.shake) * .5);
    const bg = g.createLinearGradient(0, 0, 0, 620); bg.addColorStop(0, '#060a1a'); bg.addColorStop(1, '#0d1a36'); g.fillStyle = bg; g.fillRect(-20, -20, 1040, 660);
    [[200, 160, 260, 'rgba(120,60,200,.16)'], [820, 300, 300, 'rgba(20,160,170,.13)'], [520, 80, 200, 'rgba(230,70,150,.08)']].forEach(([x, y, r, c]) => { const n = g.createRadialGradient(x, y, 0, x, y, r); n.addColorStop(0, c); n.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = n; g.fillRect(x - r, y - r, r * 2, r * 2); });
    g.strokeStyle = 'rgba(90,200,255,.08)'; g.lineWidth = 1; for (let i = 0; i < 9; i++) { const y = 470 + i * i * 2.2 + ((G.t * 30) % 20) * (i / 9); g.beginPath(); g.moveTo(0, y); g.lineTo(1000, y); g.stroke(); } for (let i = -10; i <= 10; i++) { g.beginPath(); g.moveTo(500 + i * 30, 470); g.lineTo(500 + i * 140, 640); g.stroke(); }
    G.stars.forEach(s => { g.fillStyle = `rgba(220,240,255,${.25 + s.z * .6 + Math.sin(G.t * 3 + s.x) * .1})`; g.fillRect(s.x, s.y, s.z * 2, s.z * 2); });
    for (const p of G.power) { g.save(); g.translate(p.x, p.y); g.rotate(p.ph); g.shadowBlur = 18; g.shadowColor = p.kind === 'shield' ? '#7dff9a' : '#ffd27a'; g.strokeStyle = g.shadowColor; g.lineWidth = 3; g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; g.lineTo(Math.cos(a) * 20, Math.sin(a) * 20); } g.closePath(); g.stroke(); g.rotate(-p.ph); g.fillStyle = g.shadowColor; g.font = '800 11px "Public Sans", sans-serif'; g.textAlign = 'center'; g.fillText(p.kind === 'shield' ? '+1' : 'E', 0, 4); g.restore(); }
    for (const e of G.enemies) { drawMol(g, e.mol, e.x, e.y, e.s, e.a + Math.sin(e.ph * .8) * .15, '#c9f6ff', 12);
      if (G.D.names === 'always') { g.fillStyle = 'rgba(201,246,255,.7)'; g.font = '600 12px "Public Sans", sans-serif'; g.textAlign = 'center'; g.fillText(e.mol.name.split(' (')[0], e.x, e.y + e.r + 16); } }
    g.shadowBlur = 14; g.shadowColor = '#ff4fd8'; g.strokeStyle = '#ffb3f0'; g.lineWidth = 3; G.bullets.forEach(b => { g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx * .018, b.y - b.vy * .018); g.stroke(); }); g.shadowBlur = 0;
    if (!G.over || G.shields > 0) this.ship(g, G.sx, G.sy);
    G.parts.forEach(p => { g.globalAlpha = 1 - p.age / p.life; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill(); }); g.globalAlpha = 1;
    G.texts.forEach(t => { g.globalAlpha = 1 - t.age / t.life; g.fillStyle = t.c; g.font = `800 ${t.big ? 20 : 15}px "Bricolage Grotesque", "Public Sans", sans-serif`; g.textAlign = 'center'; g.shadowColor = t.c; g.shadowBlur = 8; g.fillText(t.t, clamp(t.x, 140, 860), t.y); }); g.globalAlpha = 1; g.shadowBlur = 0;
    g.restore();
    /* HUD */
    g.fillStyle = 'rgba(8,14,30,.6)'; g.fillRect(0, 0, 1000, 44); g.strokeStyle = 'rgba(126,224,255,.25)'; g.beginPath(); g.moveTo(0, 44); g.lineTo(1000, 44); g.stroke();
    g.font = '700 13px "JetBrains Mono", monospace'; g.textAlign = 'left'; g.fillStyle = '#7ee0ff'; g.fillText('SCORE', 18, 27); g.fillStyle = '#fff'; g.font = '700 20px "JetBrains Mono", monospace'; g.fillText(String(G.score).padStart(6, '0'), 74, 29);
    g.font = '700 13px "JetBrains Mono", monospace'; g.fillStyle = G.combo >= 3 ? '#ffd27a' : '#7ee0ff'; g.fillText(`COMBO ×${Math.min(5, 1 + Math.floor(G.combo / 3))}  (${G.combo})`, 180, 27); g.fillStyle = '#7ee0ff'; g.fillText(`LEVEL ${G.level}`, 360, 27);
    g.textAlign = 'center'; g.font = '800 15px "Bricolage Grotesque", "Public Sans", sans-serif'; g.fillStyle = '#ffd27a'; g.fillText(`TARGET: ${MOLCLASS[G.target].name.toUpperCase()}`, 640, 28);
    for (let i = 0; i < 3; i++) { const x = 900 + i * 30; g.strokeStyle = i < G.shields ? '#7dff9a' : 'rgba(255,255,255,.2)'; g.fillStyle = i < G.shields ? 'rgba(125,255,154,.25)' : 'transparent'; g.lineWidth = 2; g.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; g.lineTo(x + Math.cos(a) * 10, 22 + Math.sin(a) * 10); } g.closePath(); g.fill(); g.stroke(); }
    if (G.spread > 0) { g.fillStyle = '#ffd27a'; g.font = '700 12px "JetBrains Mono", monospace'; g.textAlign = 'left'; g.fillText(`SPREAD ${G.spread.toFixed(1)}s`, 18, 66); }
    if (G.flash) { g.fillStyle = `rgba(255,60,90,${G.flash * .25})`; g.fillRect(0, 0, 1000, 620); }
    if (G.banner) { const a = Math.min(1, G.banner.life * 2); g.globalAlpha = a; g.fillStyle = 'rgba(6,10,26,.75)'; g.fillRect(0, 270, 1000, 70); g.fillStyle = '#ffd27a'; g.font = '800 30px "Bricolage Grotesque", "Public Sans", sans-serif'; g.textAlign = 'center'; g.shadowColor = '#ffd27a'; g.shadowBlur = 12; g.fillText(G.banner.t, 500, 315); g.shadowBlur = 0; g.globalAlpha = 1; }
    if (G.paused) { g.fillStyle = 'rgba(6,10,26,.7)'; g.fillRect(0, 0, 1000, 620); g.fillStyle = '#fff'; g.font = '800 40px "Bricolage Grotesque", sans-serif'; g.textAlign = 'center'; g.fillText('PAUSED', 500, 300); g.font = '600 16px "Public Sans", sans-serif'; g.fillText('Click Resume (or press P) to keep playing', 500, 334); }
  },
  ship(g, x, y) {
    const t = this.G.t; g.save(); g.translate(x, y);
    g.shadowBlur = 20; g.shadowColor = '#ff4fd8'; g.fillStyle = `rgba(255,140,60,${.7 + Math.sin(t * 40) * .2})`; g.beginPath(); g.moveTo(-7, 18); g.lineTo(0, 30 + Math.sin(t * 50) * 6); g.lineTo(7, 18); g.fill();
    const body = g.createLinearGradient(0, -28, 0, 20); body.addColorStop(0, '#7ee0ff'); body.addColorStop(1, '#8a4fff'); g.fillStyle = body; g.shadowColor = '#7ee0ff';
    g.beginPath(); g.moveTo(0, -30); g.lineTo(9, -6); g.lineTo(26, 12); g.lineTo(26, 18); g.lineTo(8, 14); g.lineTo(0, 20); g.lineTo(-8, 14); g.lineTo(-26, 18); g.lineTo(-26, 12); g.lineTo(-9, -6); g.closePath(); g.fill();
    g.shadowBlur = 0; g.fillStyle = '#0b1530'; g.beginPath(); g.ellipse(0, -6, 4.5, 9, 0, 0, Math.PI * 2); g.fill(); g.fillStyle = 'rgba(255,255,255,.7)'; g.fillRect(-1.5, -12, 2, 5);
    g.restore();
  },
  gameOver() {
    const G = this.G; if (!G) return; const o = $('#blO'); if (!o) return;
    const acc = G.good + G.bad ? Math.round(G.good / (G.good + G.bad) * 100) : 0;
    const uniq = []; G.wrong.forEach(w => { if (!uniq.some(u => u.mol === w.mol && u.target === w.target)) uniq.push(w); });
    o.hidden = false;
    o.innerHTML = `<div class="bl-card"><span class="eyebrow" style="color:#ff8a9a">Shields down</span><h2>Mission over</h2>
      <div class="tiles"><div class="tile"><span class="eyebrow">Score</span><b>${G.score}</b></div><div class="tile"><span class="eyebrow">Accuracy</span><b>${acc}%</b></div><div class="tile"><span class="eyebrow">Best combo</span><b>${G.best}</b></div><div class="tile"><span class="eyebrow">Level</span><b>${G.level}</b></div></div>
      ${uniq.length ? `<div style="display:grid;gap:8px"><span class="eyebrow">Molecules you mixed up</span><div class="bl-mix">${uniq.slice(0, 6).map((w, i) => `<div class="bl-mixi"><canvas width="160" height="80" data-mix="${i}"></canvas><div class="small"><b>${esc(w.mol.name)}</b> is a <b>${MOLCLASS[w.mol.cls].one}</b>. Your target was ${MOLCLASS[w.target].name.toLowerCase()}. <span class="muted">${esc(MOLCLASS[w.mol.cls].tip)}</span></div></div>`).join('')}</div></div>` : '<p class="small">No wrong hits. Clean shooting!</p>'}
      <div class="row"><input type="text" id="blN" maxlength="18" placeholder="Name for the high scores" value="${esc(LS.get('blName', ''))}" style="max-width:240px"><button class="btn" id="blS">Save score</button><span class="small muted" id="blSm"></span></div>
      <div class="row"><button class="btn primary" id="blA">${ico('play')}Play again</button><button class="btn" id="blM">Change mission</button></div></div>`;
    $$('[data-mix]', o).forEach(cv => this.miniMol(cv, uniq[+cv.dataset.mix].mol, '#0d6e74'));
    $('#blA', o).onclick = () => this.start(); $('#blM', o).onclick = () => { this.stop(); this.menu(); };
    $('#blS', o).onclick = e => { const n = $('#blN', o).value.trim() || 'Player'; LS.set('blName', n); const b = LS.get('blBoard', []); b.push({ n, s: G.score, m: this.mode === 'rotate' ? 'Mixed' : MOLCLASS[this.mode].name, l: G.level, d: new Date().toISOString() }); b.sort((x, y) => y.s - x.s); LS.set('blBoard', b.slice(0, 10)); e.currentTarget.disabled = true; $('#blSm', o).textContent = 'Saved to the high scores.'; };
  }
};

boot();
</script>
