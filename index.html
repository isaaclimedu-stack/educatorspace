<style>/* Layout: app shell = left course rail + main column; a lab takes the full width (stage + lab sheet). */
:root {
  --bg: #eef3f9; --panel: #ffffff; --panel-2: #f5f9fd; --ink: #0f2238; --muted: #55677d; --line: #d5dfea;
  --accent: #1686e8; --accent-ink: #ffffff; --accent-soft: #dcecfc;
  --navy: #102d4b; --teal: #10b8b0; --mint: #9cfff0; --cloud: #f6fafd;
  --warn: #d4562a; --warn-soft: #fbe5dc; --ok: #23824f; --ok-soft: #dcf1e4; --bad: #b9343a; --bad-soft: #f8dfe0;
  --shadow: 0 1px 2px rgba(16,45,75,.06), 0 6px 24px rgba(16,45,75,.08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #081524; --panel: #0f2136; --panel-2: #142a43; --ink: #e6eef8; --muted: #93a7bf; --line: #223a57;
  --accent: #4aa8f5; --accent-ink: #041424; --accent-soft: #12355a;
  --warn: #f08559; --warn-soft: #3d241a; --ok: #5bc68a; --ok-soft: #173326; --bad: #f07b80; --bad-soft: #3c1d20;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #081524; --panel: #0f2136; --panel-2: #142a43; --ink: #e6eef8; --muted: #93a7bf; --line: #223a57;
  --accent: #4aa8f5; --accent-ink: #041424; --accent-soft: #12355a;
  --warn: #f08559; --warn-soft: #3d241a; --ok: #5bc68a; --ok-soft: #173326; --bad: #f07b80; --bad-soft: #3c1d20;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 700; }
h2 { font-size: 22px; font-weight: 650; }
h3 { font-size: 17px; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 17px; height: 17px; flex: none; }

input[type=text], input[type=email], input[type=password], select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
label.fld { display: grid; gap: 6px; font-weight: 600; font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.ngss { font-family: var(--f-mono); font-weight: 600; }

/* ── gate ── */
.gate { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gate-card { width: min(920px, 100%); display: grid; grid-template-columns: 1.05fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.gate-art { background: #102d4b; color: #e8f1fb; padding: 34px; display: flex; flex-direction: column; gap: 18px; justify-content: space-between; position: relative; min-height: 440px; }
.gate-art svg { width: 100%; height: auto; max-height: 260px; }
.gate-art h1 { color: #fff; }
.gate-art p { color: #b9cde3; max-width: 36ch; }
.gate-form { padding: 36px 34px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.gate-form .err { color: var(--bad); font-size: 13.5px; min-height: 20px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.contact { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.contact code { font-family: var(--f-mono); background: var(--panel-2); padding: 2px 6px; border-radius: 5px; user-select: all; color: var(--ink); }
@media (max-width: 760px) { .gate-card { grid-template-columns: 1fr; } .gate-art { min-height: 0; } .gate-art svg { max-height: 160px; } }

/* ── shell ── */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.brand svg { width: 30px; height: 30px; }
.rail nav { display: grid; gap: 2px; }
.rail .grp { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--muted); padding: 10px 10px 4px; }
.rail a.nv { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 550; font-size: 14px; }
.rail a.nv svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.rail a.nv:hover { background: var(--panel-2); }
.rail a.nv.on { background: var(--accent-soft); color: var(--accent); }
.rail a.nv.on svg { color: var(--accent); }
.rail a.nv .ct { margin-left: auto; font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.rail .me { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 8px 0; display: grid; gap: 8px; font-size: 13px; }
.rail .me .em { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.main { padding-block: 28px 48px; padding-left: max(16px, min(40px, 3vw)); padding-right: max(16px, min(40px, 3vw)); min-width: 0; display: grid; gap: 28px; align-content: start; max-width: 1240px; }
.mob-top { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail nav { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .rail .grp { grid-column: 1 / -1; }
  .rail .me { margin-top: 0; }
}

.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); overflow: hidden; box-shadow: var(--shadow); }
.hero .txt { padding: 32px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.hero .txt p { max-width: 54ch; color: var(--muted); }
.hero .pic { background: #12304f; min-height: 240px; position: relative; }
.hero .pic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .hero .pic { min-height: 180px; } }

.sec { display: grid; gap: 14px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
a.card:hover, button.card:hover { border-color: var(--accent); }
button.card { text-align: left; cursor: pointer; font: inherit; }
.card .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.card .ic svg { width: 22px; height: 22px; }
.card .meta { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.labcard { display: grid; grid-template-columns: 180px minmax(0, 1fr); padding: 0; overflow: hidden; }
.labcard .thumb { background: #12304f; position: relative; min-height: 170px; }
.labcard .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.labcard .body { padding: 18px; display: flex; flex-direction: column; gap: 9px; min-width: 0; }
@media (max-width: 560px) { .labcard { grid-template-columns: 1fr; } .labcard .thumb { min-height: 130px; } }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); display: grid; gap: 6px; }

table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rec th { text-align: left; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.rec td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

/* ── modal ── */
.scrim { position: fixed; inset: 0; background: rgba(8,18,32,.55); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: var(--panel); border-radius: 14px; width: min(720px, 100%); max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: grid; }
.modal .mh { padding: 22px 24px 12px; display: grid; gap: 6px; }
.modal .mb { padding: 6px 24px 18px; display: grid; gap: 16px; }
.modal .mf { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--panel); }
.brief { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.brief > div { display: grid; gap: 6px; align-content: start; }
.brief ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
@media (max-width: 600px) { .brief { grid-template-columns: 1fr; } }
.std { display: grid; gap: 8px; }
.std .s { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 13.5px; }

/* ── lab player ── */
.lab { min-height: 100%; display: grid; grid-template-rows: auto 1fr; background: var(--bg); }
.lab-top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.lab-top .ttl { display: grid; line-height: 1.2; min-width: 0; }
.lab-top .ttl b { font-family: var(--f-display); font-size: 17px; }
.lab-top .stats { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ppe { display: flex; gap: 4px; }
.ppe span { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.ppe span.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.ppe svg { width: 18px; height: 18px; }
.lab-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); align-items: start; }
@media (max-width: 1100px) { .lab-body { grid-template-columns: 1fr; } }
.stage { position: relative; width: 100%; aspect-ratio: 1000 / 620; border-radius: 12px; overflow: hidden; background: #1c2526; box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; touch-action: none; }
.stage svg.scene, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage canvas { pointer-events: none; }
.stage.shake { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: translate(0,0) } 20% { transform: translate(-7px,3px) } 40% { transform: translate(6px,-4px) } 60% { transform: translate(-4px,2px) } 80% { transform: translate(3px,-1px) } }
.scene .obj { cursor: grab; }
.scene .obj.fixed { cursor: default; }
.scene .obj.dragging { cursor: grabbing; }
.scene .obj.press { cursor: pointer; }
.scene .obj.dragging .inner { filter: drop-shadow(0 10px 12px rgba(0,0,0,.35)); }
.scene .wobble { animation: wob .18s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes wob { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
.scene .glow { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: .9 } }
.scene text { font-family: var(--f-body); }
.stage-msg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(12,22,21,.86); color: #f1f7f5; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; pointer-events: none; transition: opacity .25s; max-width: 86%; text-align: center; }
.stage-msg.bad { background: rgba(160,40,44,.92); }
.stage-msg.ok { background: rgba(25,110,66,.92); }
.oops { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,14,13,.38); padding: 16px; }
.oops .box { background: var(--panel); color: var(--ink); border-radius: 14px; width: min(460px, 100%); padding: 22px; display: grid; gap: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.4); animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
.oops .box h3 { font-size: 22px; }
.oops .why { background: var(--panel-2); border-radius: 9px; padding: 10px 12px; font-size: 14px; }
.oops .why b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
@keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.narrow-note { display: none; }
@media (max-width: 700px) { .narrow-note { display: block; } }

.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid; overflow: hidden; }
.sheet .cur { padding: 16px 18px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.sheet .cur .instr { font-size: 15px; }
.sheet .cur .instr b { color: var(--accent); }
.sheet .hint { font-size: 13.5px; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 9px 11px; }
.sheet ol.steps { list-style: none; margin: 0; padding: 8px 10px 12px; display: grid; gap: 1px; max-height: 420px; overflow-y: auto; counter-reset: st; }
.sheet ol.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 7px; font-size: 13.5px; color: var(--muted); counter-increment: st; }
.sheet ol.steps li::before { content: counter(st); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; border: 1.5px solid var(--line); font-family: var(--f-mono); }
.sheet ol.steps li.done { color: var(--ink); }
.sheet ol.steps li.done::before { content: "✓"; background: var(--ok); border-color: var(--ok); color: #fff; }
.sheet ol.steps li.now { background: var(--accent-soft); color: var(--ink); font-weight: 650; }
.sheet ol.steps li.now::before { border-color: var(--accent); color: var(--accent); }
.meter { display: grid; gap: 5px; }
.meter .lab-l { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
.meter .bar { position: relative; height: 14px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.meter .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 30%, transparent); }
.meter .zone.hot { background: color-mix(in srgb, var(--bad) 28%, transparent); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 7px; transition: width .08s linear; }
.meter .mk { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--ink); border-radius: 2px; transition: left .08s linear; }
.res-stars { display: flex; gap: 6px; }
.res-stars svg { width: 34px; height: 34px; }
.results { display: grid; gap: 14px; }
.results .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.results .tile { background: var(--panel-2); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.results .tile b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.mist { display: grid; gap: 8px; }
.mist div { font-size: 13.5px; border-left: 3px solid var(--warn); padding: 4px 10px; background: var(--panel-2); border-radius: 0 7px 7px 0; }
.quiz { display: grid; gap: 10px; }
.quiz .q { font-weight: 650; }
.quiz .opts { display: grid; gap: 7px; }
.quiz .opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; font-size: 14px; }
.quiz .opt:hover { border-color: var(--accent); }
.quiz .opt.right { background: var(--ok-soft); border-color: var(--ok); }
.quiz .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.quiz .exp { font-size: 13.5px; color: var(--muted); }

/* ── game ── */
.game { display: grid; gap: 18px; }
.board { display: grid; gap: 8px; }
.board .cats, .board .rw { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.board .cat { background: #143a63; color: #fff; border-radius: 9px; padding: 12px 8px; text-align: center; font-family: var(--f-display); font-weight: 650; font-size: 15px; display: grid; place-items: center; min-height: 64px; }
.board .tile { background: #1a4b7d; color: #ffd27a; border: 0; border-radius: 9px; font-family: var(--f-display); font-weight: 800; font-size: clamp(18px, 2.4vw, 30px); min-height: 72px; cursor: pointer; font-variant-numeric: tabular-nums; transition: transform .12s, filter .12s; }
.board .tile:hover { filter: brightness(1.15); transform: translateY(-2px); }
.board .tile.used { background: var(--panel-2); color: transparent; cursor: default; transform: none; filter: none; border: 1px dashed var(--line); }
.teams { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.team { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.team.turn { border-color: var(--tc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent); }
.team .nm { font-weight: 700; display: flex; gap: 8px; align-items: center; }
.team .nm i { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); display: inline-block; }
.team .sc { font-family: var(--f-display); font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; }
.team .tag { font-size: 12px; color: var(--muted); min-height: 18px; }
.qcard { background: #102d4b; color: #eaf3fb; border-radius: 16px; padding: 28px; display: grid; gap: 18px; }
.qcard .qtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.qcard .qq { font-family: var(--f-display); font-size: clamp(20px, 2.4vw, 30px); font-weight: 600; line-height: 1.25; }
.qcard .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qcard .ans button { text-align: left; background: #1a4170; color: #fff; border: 2px solid transparent; border-radius: 10px; padding: 14px 16px; font-size: 17px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
.qcard .ans button:hover { border-color: #ffd27a; }
.qcard .ans button b { width: 30px; height: 30px; border-radius: 50%; background: #ffd27a; color: #102d4b; display: grid; place-items: center; flex: none; font-size: 14px; }
.qcard .ans button.right { background: #1f7a4c; }
.qcard .ans button.wrong { background: #8c2d31; opacity: .8; }
.qcard .ans button[disabled] { cursor: default; }
.qcard .timer { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
.qcard .timer i { display: block; height: 100%; background: #ffd27a; width: 100%; }
.qcard .exp { background: rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.qcard .chip { background: rgba(255,255,255,.1); border-color: transparent; color: #fff; }

@media (max-width: 700px) { .qcard .ans { grid-template-columns: 1fr; } .board .cats, .board .rw { gap: 4px; } .board .cat { font-size: 11px; padding: 6px 3px; } }
.setup { display: grid; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }

/* ── molecule blaster ── */

.bl-guide canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; background: var(--panel-2); border-radius: 8px; }
.bl-wrap { position: relative; width: 100%; aspect-ratio: 1000 / 620; border-radius: 14px; overflow: hidden; background: #060a1a; box-shadow: 0 10px 40px rgba(20,10,60,.35); }
.bl-wrap > canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: none; touch-action: none; }
.bl-over { position: absolute; inset: 0; background: rgba(6,10,26,.72); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.bl-card { background: var(--panel); color: var(--ink); border-radius: 14px; width: min(640px, 100%); padding: 20px; display: grid; gap: 12px; max-height: 100%; overflow-y: auto; }

.bl-mix { display: grid; gap: 8px; }
.bl-mixi { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 8px; }
.bl-mixi canvas { width: 120px; height: 60px; background: var(--panel); border-radius: 6px; }
@media (max-width: 600px) { .bl-card .tiles { grid-template-columns: 1fr 1fr; } }

/* ── gate tabs, sign-up card ── */
.gate-tabs { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.gate-tabs button { padding: 10px 12px; }
.gate-new { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px 14px; flex-wrap: wrap; }
.gate-new > div { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
/* ── assign labs ── */
.pick-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.pick { display: grid; grid-template-columns: auto 88px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--panel); }
.pick.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pick input { width: 18px; height: 18px; accent-color: var(--accent); }
.pick .thumb { width: 88px; height: 60px; border-radius: 8px; overflow: hidden; background: #12304f; display: block; }
.pick .thumb svg { width: 100%; height: 100%; display: block; }
.pick b { display: block; font-size: 14.5px; }
.code-out { display: grid; gap: 10px; padding: 18px; border-radius: 12px; background: var(--accent-soft); }
.big-code { font-size: clamp(22px, 4vw, 40px); font-weight: 700; letter-spacing: .06em; color: var(--ink); user-select: all; overflow-wrap: anywhere; word-break: break-all; }
/* ── student version ── */
.stu { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.stu-top { display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stu-me { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stu-main { width: min(1100px, 100%); margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; align-content: start; }
.send-box { display: grid; gap: 4px; padding: 10px 12px; border-radius: 9px; background: var(--panel-2); border-left: 4px solid var(--muted); }
.send-box.ok { background: var(--ok-soft); border-color: var(--ok); }
.send-box.bad, .send-box.warn { background: var(--warn-soft); border-color: var(--warn); }
.send-box code { font-family: var(--f-mono); background: var(--panel); padding: 6px 8px; border-radius: 6px; word-break: break-word; }
/* ── Pip ── */

.pip-row svg { flex: none; }

/* ── brand logo + email line ── */
.brand svg { border-radius: 8px; }
.contact a { color: var(--accent); font-weight: 600; text-decoration: none; }
.contact a:hover { text-decoration: underline; }
.contact-mail { display: inline-flex; align-items: center; gap: 6px; }
.contact-mail svg { width: 15px; height: 15px; }

/* ── game hub ── */
.gh-crumb a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600; font-size: 14px; color: var(--muted); }
.gh-crumb a:hover { color: var(--accent); }
.gh-crumb svg { width: 16px; height: 16px; }
.gh-body { display: grid; gap: 22px; min-width: 0; }
.gh-frame { width: 100%; height: max(640px, calc(100vh - 230px)); border: 1px solid var(--line); border-radius: 14px; background: #0a0f1c; }
.home-games { display: grid; gap: 10px; }
.gm-mini { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; }
.gm-mini .thumb { width: 92px; height: 56px; border-radius: 8px; overflow: hidden; display: block; }
.gm-mini .thumb svg { width: 100%; height: 100%; display: block; }
.gm-mini b { font-family: var(--f-display); font-size: 15.5px; display: block; }
.gm-cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.gm-col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.gm-col .card { border: 0; background: transparent; }
.gm-col a.card:hover { background: var(--panel-2); }

/* shared bits */
.gm-say { display: flex; align-items: center; gap: 10px; min-width: 0; }
.gm-say svg { flex: none; }
.gm-bub { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 9px 13px; font-size: 14px; max-width: 52ch; }
.gm-bub::before { content: ""; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: inherit; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); }
.gm-hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.gm-hud > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; }
.gm-hud b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.gm-hud .mono { font-family: var(--f-mono); font-size: 20px; }
@media (max-width: 600px) { .gm-hud { grid-template-columns: 1fr 1fr; } }
.gm-decks { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.gm-deck { display: grid; gap: 3px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font: inherit; color: var(--ink); }
.gm-deck:hover { border-color: var(--accent); }
.gm-deck.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.gm-pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--panel); cursor: pointer; }
.gm-over { position: absolute; inset: 0; background: rgba(8,20,36,.72); display: grid; place-items: center; padding: 16px; z-index: 5; overflow-y: auto; border-radius: inherit; }
.gm-card { background: var(--panel); color: var(--ink); border-radius: 16px; width: min(620px, 100%); padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: pop .3s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow-y: auto; }
.gm-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gm-tiles > div { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: grid; }
.gm-tiles b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.gm-count { font-family: var(--f-display); font-weight: 800; font-size: 110px; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.4); }
.mist-row { font-size: 14px; border-left: 3px solid var(--warn); padding: 5px 10px; background: var(--panel-2); border-radius: 0 7px 7px 0; }

/* ── Speed Match ── */
.mc-wrap { position: relative; border-radius: 16px; background: #102d4b; padding: 14px; }
.mc-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.mc { aspect-ratio: 4 / 3; border: 0; padding: 0; background: none; cursor: pointer; perspective: 800px; min-height: 84px; }
.mc-in { position: relative; display: block; width: 100%; height: 100%; transition: transform .38s cubic-bezier(.3,1.3,.5,1); transform-style: preserve-3d; }
.mc.up .mc-in, .mc.done .mc-in { transform: rotateY(180deg); }
.mc-back, .mc-front { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.mc-back { background: linear-gradient(140deg, #1686e8, #10b8b0); box-shadow: inset 0 0 0 3px rgba(255,255,255,.25); }
.mc-back svg { width: 46%; height: auto; }
.mc:hover .mc-back { filter: brightness(1.12); }
.mc-front { transform: rotateY(180deg); background: #f5f9fd; color: #102d4b; padding: 8px; align-content: center; gap: 4px; text-align: center; box-shadow: inset 0 0 0 3px #cfe0f2; }
.mc-front.b { background: #effcf9; box-shadow: inset 0 0 0 3px #9cfff0; }
.mc-tag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: #1686e8; }
.mc-front.b .mc-tag { color: #0e8f88; }
.mc-txt { font-family: var(--f-display); font-weight: 700; line-height: 1.15; }
.mc.done .mc-front { box-shadow: inset 0 0 0 4px #22c55e; background: #e9fbef; }
.mc.done { cursor: default; animation: mcpop .4s; }
.mc.miss .mc-in { animation: mcshake .3s; }
@keyframes mcpop { 50% { transform: scale(1.06); } }
@keyframes mcshake { 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
@media (max-width: 700px) { .mc-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .mc-txt { font-size: 13px !important; } }

/* ── Nomenclature Rush + Bomb Squad (question panels) ── */
.nb-stage, .bm-stage { position: relative; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; background: #102d4b; color: #eaf3fb; border-radius: 16px; padding: 20px; min-height: 420px; }
@media (max-width: 820px) { .nb-stage, .bm-stage { grid-template-columns: 1fr; } }
.nb-left, .bm-left { display: grid; justify-items: center; align-content: start; gap: 6px; }
.nb-flask { width: 100%; max-width: 260px; overflow: visible; }
.nb-b { animation: nbub 1.6s linear infinite; }
@keyframes nbub { from { transform: translateY(20px); opacity: 0; } 30% { opacity: .9; } to { transform: translateY(-120px); opacity: 0; } }
.nb-over { animation: nbfizz .6s ease-out; }
@keyframes nbfizz { from { transform: translateY(40px) scale(.6); opacity: 0; } }
.nb-q { display: grid; gap: 14px; align-content: start; min-width: 0; }

.nb-n { font-size: clamp(28px, 3.4vw, 40px); color: #ffd27a; }
.nb-timer { height: 10px; background: rgba(255,255,255,.12); border-radius: 5px; overflow: hidden; }
.nb-timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff8a7a, #ffd27a 30%, #9cfff0); }
.nb-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .nb-opts { grid-template-columns: 1fr; } }
.nb-opts button { text-align: left; background: #1a4170; color: #fff; border: 2px solid transparent; border-radius: 12px; padding: 13px 14px; font-size: 18px; cursor: pointer; display: flex; gap: 12px; align-items: center; font-family: var(--f-body); }
.nb-opts button:hover:not([disabled]) { border-color: #ffd27a; }
.nb-opts button b { width: 28px; height: 28px; border-radius: 50%; background: #ffd27a; color: #102d4b; display: grid; place-items: center; flex: none; font-size: 14px; }
.nb-opts button.right { background: #1f7a4c; }
.nb-opts button.wrong { background: #8c2d31; }

.nb-opts sub, .nb-f sub, .nb-why sub, .mist-row sub, .bm-prompt sub { font-size: .65em; }
.nb-opts sup, .nb-f sup, .nb-why sup, .mist-row sup, .bm-prompt sup { font-size: .62em; }
.nb-x { display: grid; gap: 10px; justify-items: start; min-height: 32px; }
.nb-why { background: rgba(255,255,255,.08); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
.nb-stage .gm-bub, .bm-stage .gm-bub { background: #1a4170; border-color: #2c5a8c; color: #eaf3fb; }
.nb-stage .muted, .bm-stage .muted { color: #a9c0d9; }

/* ── Bomb Squad ── */
.bm-intro { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.bm-tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.bm-tool { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border-radius: 10px; border: 2px dashed rgba(255,255,255,.25); color: rgba(255,255,255,.35); font-size: 9.5px; line-height: 1.15; font-weight: 700; text-align: center; min-width: 0; overflow-wrap: anywhere; }
.bm-tool svg { width: 26px; height: 26px; }
.bm-tool.got { border: 2px solid #22e39a; color: #22e39a; background: rgba(34,227,154,.1); animation: mcpop .4s; }
.bm-tool.next { border-color: #ffd27a; color: #ffd27a; }
.bm-tool.sm { width: 46px; height: 46px; border: 2px solid var(--line); color: var(--accent); place-items: center; padding: 0; }
.bm-x { display: inline-block; width: 22px; text-align: center; color: var(--line); font-weight: 900; font-size: 20px; }
.bm-x.on { color: var(--bad); }
.bm-left svg { width: 100%; max-width: 300px; overflow: visible; }
.bm-shake { animation: shake .3s infinite; }
.bm-prompt { font-size: clamp(20px, 2.3vw, 26px); }
.bm-prompt .nb-f { font-size: clamp(34px, 4vw, 48px); }
.bm-boom { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; overflow: hidden; border-radius: inherit; }
.bm-flash { position: absolute; inset: 0; background: #fff; animation: bmflash .7s ease-out forwards; }
@keyframes bmflash { from { opacity: 1; } to { opacity: 0; } }
.bm-burst { width: min(640px, 100%); position: relative; }
.bm-star, .bm-word { transform-origin: 300px 210px; animation: bmpop .5s cubic-bezier(.2,1.6,.4,1) both; }
.bm-word { animation-delay: .08s; }
.bm-smoke { transform-box: fill-box; transform-origin: center; animation: bmsmoke 1.6s ease-out both; }
@keyframes bmpop { from { transform: scale(.1); } }
@keyframes bmsmoke { from { transform: scale(.2); opacity: 0; } 30% { opacity: .95; } to { transform: scale(1.4) translateY(-30px); opacity: .6; } }

/* ── Rocket Race ── */
.rr-wrap { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.rr-track { width: 100%; height: auto; display: block; }
.rr-rocket { transition: transform .3s; }
.rr-boost { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 700px) { .rr-boost { grid-template-columns: 1fr; } }
.rr-b { display: grid; justify-items: center; gap: 4px; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font: inherit; color: var(--ink); }
.rr-b:hover:not([disabled]) { border-color: var(--accent); transform: translateY(-2px); }
.rr-b b { font-family: var(--f-display); font-size: 18px; }
.rr-b svg { height: auto; }
.rr-msg { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-weight: 600; }

/* ── Sort Storm ── */
.ss-sky { position: relative; height: 520px; border-radius: 16px; overflow: hidden; background: linear-gradient(#24476e, #3b6a99 55%, #6c9cc7); user-select: none; }
.ss-clouds { position: absolute; left: -20px; right: -20px; top: -30px; height: 90px; background: radial-gradient(60px 40px at 10% 60%, #dbe7f3 98%, transparent), radial-gradient(80px 50px at 26% 50%, #e6eef7 98%, transparent), radial-gradient(70px 44px at 44% 62%, #d6e3f0 98%, transparent), radial-gradient(90px 50px at 62% 48%, #e6eef7 98%, transparent), radial-gradient(70px 44px at 80% 60%, #dbe7f3 98%, transparent), radial-gradient(70px 44px at 96% 52%, #e6eef7 98%, transparent); }
.ss-rain { position: absolute; inset: 0; background-image: repeating-linear-gradient(105deg, transparent 0 22px, rgba(255,255,255,.18) 22px 23px); animation: ssrain .6s linear infinite; opacity: .6; }
@keyframes ssrain { from { background-position: 0 0; } to { background-position: -24px 90px; } }
.ss-face { position: absolute; right: 12px; top: 52px; }
.ss-line { position: absolute; left: 0; right: 0; bottom: 96px; border-top: 3px dashed rgba(255,255,255,.35); }
.ss-card { position: absolute; left: 0; top: 0; width: max-content; max-width: 240px; padding: 10px 16px; border-radius: 12px; background: #f5f9fd; color: #102d4b; font-family: var(--f-display); font-weight: 700; font-size: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.25); will-change: transform; }
.ss-card.on { box-shadow: 0 0 0 4px #ffd27a, 0 6px 18px rgba(0,0,0,.25); }
.ss-card.ok { background: #bbf7d0; } .ss-card.bad { background: #fecaca; }
.ss-card.splash { animation: sssplash .5s forwards; }
@keyframes sssplash { to { opacity: 0; filter: blur(4px); } }
.ss-bins { position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; gap: 10px; }
.ss-bin { height: 76px; border: 0; border-radius: 14px 14px 22px 22px; background: var(--bc); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); }
.ss-bin:hover { filter: brightness(1.1); }
.ss-bin.ok { animation: ssok .4s; } .ss-bin.bad { animation: shake .4s; }
@keyframes ssok { 50% { transform: scale(1.06); filter: brightness(1.3); } }
.ss-k { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-size: 13px; }
.ss-toast { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); background: rgba(16,45,75,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 15px; animation: pop .25s; z-index: 4; max-width: 90%; text-align: center; }

/* ── Hazard Hunt ── */
.hz-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .hz-wrap { grid-template-columns: 1fr; } }
.hz-stage { position: relative; display: grid; gap: 8px; background: #102d4b; border-radius: 16px; padding: 12px; }
.hz-scene { width: 100%; height: auto; display: block; border-radius: 10px; cursor: crosshair; }
.hz-side { display: grid; gap: 10px; }
.hz-list { display: grid; gap: 8px; max-height: 420px; overflow-y: auto; }
.hz-item { display: grid; gap: 2px; background: var(--ok-soft); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.hz-item b { color: var(--ok); }
.hz-item.new { animation: pop .3s; }
.hz-pulse { animation: glow .5s ease-in-out infinite; }
.hz-ov { background: rgba(8,20,36,.45); align-items: end; }
.hz-back { position: absolute; right: 20px; bottom: 20px; z-index: 6; }

.gm-card .muted { color: var(--muted); }

/* the assistant's speech bubble on the stage (top layer, fades) */
function pipSay(K, text) {
  const old = K.top.querySelector('.pipsay'); if (old) old.remove();
  const words = text.split(' '), lines = ['']; words.forEach(w => { if ((lines[lines.length - 1] + ' ' + w).trim().length > 20) lines.push(w); else lines[lines.length - 1] = (lines[lines.length - 1] + ' ' + w).trim(); });
  const h = 22 + lines.length * 19, y0 = 200 - h / 2, e = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const g = sv('g', { class: 'pipsay' }, K.top);
  g.innerHTML = `<path d="M196,${y0 + h / 2 - 10} L232,${y0 + h / 2 + 4} L196,${y0 + h / 2 + 8}Z" fill="#fff" stroke="#e9d3b6" stroke-width="3" stroke-linejoin="round"/><rect x="18" y="${y0}" width="182" height="${h}" rx="18" fill="#fff" stroke="#e9d3b6" stroke-width="3"/><rect x="194" y="${y0 + h / 2 - 9}" width="6" height="16" fill="#fff"/>
    ${lines.map((l, i) => `<text x="109" y="${y0 + 26 + i * 19}" font-size="14.5" font-weight="700" fill="#5a3a2a" text-anchor="middle">${e(l)}</text>`).join('')}`;
  g.style.transition = 'opacity .4s'; clearTimeout(K._pipT); K._pipT = setTimeout(() => { g.style.opacity = 0; }, 3800);
}

/* ═══════════ Lab: DNA extraction from strawberries ═══════════
   Four parts: suit up (PPE) → gather materials → bench procedure (14 steps) → check your thinking + results. */
const DNALab = (() => {
  const K = Kit;
  let run, st, snap, stepIx = 0, quizScore = 0, phaseName = '';
  const fresh = () => ({ hulled: [false, false], inBag: [false, false], water: 0, soap: 0, salt: 0, stir: 0, bagBuf: 0, sealed: 0, mash: 0, filter: false, tube: 0, alc: 0, dna: 0, spool: 0 });
  const BAG = { x: 470, y: 578 }, BEAK = { x: 770, y: 568 }, TOOL = { x: 905, y: 568 }, TUBE = { x: 735, y: 580 }, PLATE = { x: 140, y: 572 }, WASTE = { x: 250, y: 576 }, ICE = { x: 905, y: 582 };
  const bufVol = () => st.water + st.soap;

  /* ── drawings with live updates ── */
  function mkBag() {

  function mkBeaker(band) {

  }
  function mkTube() {

  /* pour helper: drag a container to a spot, then hold to pour. */
  function pourable(o, cfg) {
    o.posed = false;
    const poseAt = rot => { const sx = o.x, sy = o.y; o.rot = rot; o.x = 0; o.y = 0; const w = o.world(cfg.spout[0], cfg.spout[1]); o.x = sx; o.y = sy; const t = cfg.at(); return { x: t.x - w.x, y: t.y - w.y }; };
    K.drag(o, { fragile: cfg.fragile, slip: cfg.slip, can: () => !o.posed,
      drop: (oo, x, y) => { const t = cfg.at(), wp = o.world(0, -cfg.h / 2); if (Math.hypot(wp.x - t.x, wp.y - t.y) > (cfg.radius || 140)) { cfg.miss && cfg.miss(); return false; }
        o.posed = true; o.g.classList.add('press'); const p = poseAt(cfg.rest); o.rot = 0; o.to(p.x, p.y, cfg.rest, 220, () => { cfg.posed && cfg.posed(); }); return true; } });
    let tilt = 0, flowing = false;

      down: () => { flowing = true; tilt = 0; if (cfg.sound !== false) SND.pourStart(cfg.freq || 900); cfg.down && cfg.down(); },
      tick: (s, dt) => { if (!flowing) return; const f = cfg.rateF ? cfg.rateF(s) : 1; tilt = Math.min(1, tilt + dt * 4);
        const rot = lerp(cfg.rest, cfg.pour, tilt * (cfg.tiltF ? cfg.tiltF(f) : 1)); const p = poseAt(rot); o.rot = rot; o.x = p.x; o.y = p.y;

        const amt = cfg.rate * f * tilt * dt, spout = o.world(cfg.spout[0], cfg.spout[1]);

        if (cfg.flow(amt, s, f, spout) === false) { flowing = false; K.stream('pour', null); SND.pourStop(); } },
      up: (s, cancelled) => { K.stream('pour', null); SND.pourStop(); if (!flowing && !cfg.alwaysUp) return; flowing = false; o.sx = 1; const p = poseAt(cfg.rest); o.to(p.x, p.y, cfg.rest, 160); if (!cancelled) cfg.release && cfg.release(s); } });
  }

  /* ── steps ── */
  const STEPS = [
    { id: 'hull', name: 'Remove the green tops', title: 'Remove the green tops',
      html: 'Press on the <b>green leaves</b> of each strawberry and drag them off. Drop the leaves anywhere; they go in the waste cup.',

    { id: 'water', name: 'Measure 90 mL of water', title: 'Make the extraction buffer: water',
      html: 'Drag the <b>distilled water</b> bottle to the beaker. Then <b>hold the mouse button</b> to pour. Let go at the <b>90 mL</b> line (80–100 mL is fine).', hint: 'Pour, let go, and read the line at eye level. You can pour more in short bursts.' },
    { id: 'soap', name: 'Add 10 mL of dish soap', title: 'Extraction buffer: dish soap',

    { id: 'stir', name: 'Stir gently', title: 'Stir the buffer gently',

    { id: 'pour', name: 'Pour buffer into the bag', title: 'Add the buffer to the strawberries',
      html: 'Carefully drag the <b>beaker</b> to the top of the bag, then <b>hold to pour</b> it all in. <b>Glass moves slowly.</b>', hint: 'If the beaker wobbles while you move it, slow down or it may slip.' },
    { id: 'seal', name: 'Seal the bag', title: 'Seal the bag',

/* drag a container to a spot, then hold to pour (shared by every lab) */
Kit.pourable = function (o, cfg) {
  const K = this; o.posed = false;
  const poseAt = rot => { const sx = o.x, sy = o.y; o.rot = rot; o.x = 0; o.y = 0; const w = o.world(cfg.spout[0], cfg.spout[1]); o.x = sx; o.y = sy; const t = cfg.at(); return { x: t.x - w.x, y: t.y - w.y }; };
  K.drag(o, { fragile: cfg.fragile, slip: cfg.slip, can: () => !o.posed,
    drop: () => { const t = cfg.at(), wp = o.world(0, -cfg.h / 2); if (Math.hypot(wp.x - t.x, wp.y - t.y) > (cfg.radius || 140)) { cfg.miss && cfg.miss(); return false; }
      o.posed = true; o.g.classList.add('press'); const p = poseAt(cfg.rest); o.rot = o.hrot || 0; o.to(p.x, p.y, cfg.rest, 220, () => { cfg.posed && cfg.posed(); }); return true; } });
  let tilt = 0, flowing = false;
  K.press(o.g, { can: () => o.posed,
    down: s => { flowing = true; tilt = 0; if (cfg.sound !== false) SND.pourStart(cfg.freq || 900); cfg.down && cfg.down(s); },
    move: s => { cfg.move && cfg.move(s); },
    tick: (s, dt) => { if (!flowing) return; const f = cfg.rateF ? cfg.rateF(s) : 1; tilt = Math.min(1, tilt + dt * 4);
      const rot = lerp(cfg.rest, cfg.pour, tilt * (cfg.tiltF ? cfg.tiltF(f) : 1)); const p = poseAt(rot); o.rot = rot; o.x = p.x; o.y = p.y;
      if (cfg.squeeze) o.sx = 1 - .12 * tilt; o.place();
      const amt = cfg.rate * f * tilt * dt, spout = o.world(cfg.spout[0], cfg.spout[1]);
      if (amt > 0 && cfg.stream !== false) K.stream('pour', spout, cfg.surface(), cfg.color, cfg.width ? cfg.width(f) : 5); else K.stream('pour', null);
      if (cfg.flow(amt, s, f, spout) === false) { flowing = false; K.stream('pour', null); SND.pourStop(); } },
    up: (s, cancelled) => { K.stream('pour', null); SND.pourStop(); if (!flowing) return; flowing = false; o.sx = 1; const p = poseAt(cfg.rest); o.to(p.x, p.y, cfg.rest, 160); if (!cancelled) cfg.release && cfg.release(s); } });
};

        if (m.fx) { K.fx[m.fx].call(K, { x, y: y - 40 }); SND.wah(); } else SND.nope(); K.msg(w, 'bad', 4600); return false; }
      got.add(m.id); const s = slot(got.size - 1); o.g.style.pointerEvents = 'none';
      o.to(s.x, s.y, 0, 220, () => { o.inner.setAttribute('transform', 'scale(.62)'); }); SND.ok(); side();
      if (got.size === need.length) { K.msg('Everything on the list is on your tray.', 'ok'); $('#gGo2').onclick = done; }
      return true; } }));
  }
};

function makeLab(L) {
  const K = Kit, R = { st: null, i: 0, run: null, snap: '', quizScore: 0 };
  const steps = L.steps;
  R.sheet = (extra, html) => { const s = steps[R.i]; K.sheet({ title: `Part 3 · Step ${R.i + 1} of ${steps.length}`, html: `<h3 style="margin-bottom:4px">${s.title}</h3>${html || s.html}`, hint: s.hint, steps: steps.map(x => x.name), cur: R.i, extra }); };
  R.next = (delay = 650) => { if (R._adv) return; R._adv = true; SND.step(); K.msg('Step complete', 'ok', 1400); K.after(delay, () => { R.i++; if (R.i >= steps.length) quiz(); else R.runStep(R.i); }); };
  R.retry = () => { R.st = JSON.parse(R.snap); R.runStep(R.i); };
  R.oops = o => K.oops(Object.assign({ retry: R.retry, step: steps[R.i].title }, o));
  R.slip = (o, extra = '') => { const at = { x: o.x, y: o.y - 50 }; o.g.setAttribute('visibility', 'hidden'); R.oops({ title: 'Butterfingers!', text: 'You moved the glassware so fast that it slipped and shattered.' + extra, why: 'Glassware is slippery, especially with gloves on. Move it slowly and keep it low over the bench. Tell your teacher about broken glass and never pick it up with your hands.', fx: 'shatter', at }); };
  R.mistake = (title, why) => { K.addMistake({ title, why, step: steps[R.i].title }); SND.nope(); };
  R.runStep = i => { K.clear(); R._adv = false; K.phase('Part 3 of 4 · Procedure'); R.i = i; R.snap = JSON.stringify(R.st); K.setBg(L.bg ? L.bg() : BG.bench()); R.sheet(); L.S[steps[i].id](R); };
  function start(r) {
    R.run = r; R.st = L.fresh(); R.i = 0;
    K.mount({ title: L.meta.title, defs: DNA_DEFS + (L.defs || ''), back: r.back, onExit: confirmExit, ppe: L.ppe.need });
    LabParts.ppe(K, L.ppe, () => LabParts.gather(K, L.gather, () => R.runStep(0)));
  }
  function confirmExit() {
    if (K.frozen) { K.exit(); return; } if ($('#xL', K.stage)) return;
    const o = document.createElement('div'); o.className = 'oops';
    o.innerHTML = `<div class="box"><h3>Leave this lab?</h3><p>Progress in this run won't be saved.</p><div class="row"><button class="btn" id="xS">Keep going</button><button class="btn warn" id="xL">Leave lab</button></div></div>`;
    K.stage.appendChild(o); $('#xS').onclick = () => o.remove(); $('#xL').onclick = () => K.exit();
  }
  function quiz() {
    K.clear(); K.phase('Part 4 of 4 · Check your thinking'); K.frozen = true; const secs = K.secs();
    K.setBg(L.bg ? L.bg() : BG.bench()); L.finale && L.finale(R);
    let qi = 0; R.quizScore = 0; const Q = L.quiz;
    const show = () => {
      if (qi >= Q.length) return results(secs);
      const q = Q[qi], order = q.a.map((_, i) => i).sort(() => Math.random() - .5);
      K.side.innerHTML = `<div class="cur"><span class="eyebrow">Part 4 · Question ${qi + 1} of ${Q.length}</span><div class="quiz"><div class="q">${esc(q.q)}</div><div class="opts">${order.map(i => `<button class="opt" data-i="${i}">${esc(q.a[i])}</button>`).join('')}</div><div class="exp" id="qExp"></div></div></div>`;
      let lock = false;
      $$('.opt', K.side).forEach(b => b.onclick = () => {
        if (lock) return; lock = true; const i = +b.dataset.i, ok = i === q.c;
        b.classList.add(ok ? 'right' : 'wrong'); if (!ok) $(`.opt[data-i="${q.c}"]`, K.side).classList.add('right'); if (ok) { R.quizScore++; SND.ok(); } else SND.nope();
        $('#qExp').innerHTML = `${ok ? '<b>Correct.</b> ' : '<b>Not quite.</b> '}${esc(q.e)}<div style="margin-top:10px"><button class="btn primary sm" id="qN">${qi + 1 < Q.length ? 'Next question' : 'See results'}</button></div>`;
        $('#qN').onclick = () => { qi++; show(); };
      });
    };
    K.msg(L.finaleMsg || 'Procedure complete. Now check your thinking.', 'ok', 4000); show();
  }
  function results(secs) {
    const n = K.mistakes.length, qs = R.quizScore, qn = L.quiz.length, stars = n === 0 && qs >= qn - 1 ? 3 : n <= 2 && qs >= qn - 2 ? 2 : 1;
    saveRecord({ name: R.run.student, lab: L.meta.short, at: new Date().toISOString(), mistakes: n, quiz: `${qs}/${qn}`, secs, stars });
    const verdict = stars === 3 ? ['Lab ready', 'You followed every step safely. You’re ready for the real lab.'] : stars === 2 ? ['Almost ready', 'Good work. Review the mistakes below before the real lab.'] : ['Practice again', 'Run the virtual lab once more before the real one.'];
    K.side.innerHTML = `<div class="cur results"><div class="pip-row">${pipFace(stars >= 3 ? 'happy' : 'think', 58)}<span class="eyebrow">Results${R.run.student ? ' · ' + esc(R.run.student) : ''}</span></div>
      <div class="res-stars" aria-label="${stars} of 3 stars">${[1, 2, 3].map(i => `<svg viewBox="0 0 24 24" fill="${i <= stars ? '#f2b33d' : 'none'}" stroke="${i <= stars ? '#c98a12' : 'currentColor'}" stroke-width="1.5" style="color:var(--line)">${IC.star}</svg>`).join('')}</div>
      <h2>${verdict[0]}</h2><p class="small">${verdict[1]}</p>${L.summary ? `<div class="small">${L.summary(R)}</div>` : ''}
      <div class="tiles"><div class="tile"><span class="eyebrow">Mistakes</span><b>${n}</b></div><div class="tile"><span class="eyebrow">Quiz</span><b>${qs}/${qn}</b></div><div class="tile"><span class="eyebrow">Time</span><b>${fmtTime(secs)}</b></div></div>
      ${n ? `<div class="mist"><span class="eyebrow">Watch for these in the real lab</span>${K.mistakes.map(m => `<div><b>${esc(m.step)}:</b> ${esc(m.title)}</div>`).join('')}</div>` : ''}
      <div class="row"><button class="btn primary" id="rAgain">Run the lab again</button><button class="btn" id="rBack">Back to labs</button></div></div>`;
    $('#rAgain').onclick = () => start(R.run); $('#rBack').onclick = () => K.exit();
    if (stars === 3) { SND.win(); confetti(); }
  }
  const api = { start, R, _jump: (i, o) => { R.st = Object.assign(L.fresh(), o || {}); L.ppe.need.forEach(k => K.ppe(k === 'gloves' ? 'glove' : k, true)); R.runStep(i); } };
  L.meta.run = r => start(r); LABS.push(L.meta);
  return api;
}

  const measure = v => ({ id: 'm' + v, name: `Record at ${v.toFixed(1)} V`, title: `Measure at ${v.toFixed(1)} V`, html: `Close the switch if it’s open. Then <b>press the voltage knob and drag up or right</b> to raise the voltage (down or left to lower it) until the supply reads <b>${v.toFixed(1)} V</b>. Click <b>Record reading</b>.`, hint: 'Read the voltage across the resistor from the voltmeter and the current from the ammeter.' });
  const steps = [
    { id: 'build', name: 'Wire the circuit', title: 'Wire the circuit', html: 'Build the circuit in the diagram: <b>drag from one terminal dot to another</b> to add a wire. Click a wire to remove it. When you’re done, <b>click the switch</b> to close it and test.', hint: 'Ammeter in series (part of the loop). Voltmeter in parallel (its two leads on the two ends of the resistor). Red + toward the supply’s + side.' },
    measure(1.5), measure(3), measure(4.5), measure(6),
    { id: 'slope', name: 'Find the resistance', title: 'Find the resistance from your graph', html: '', hint: 'Resistance = voltage ÷ current. Convert mA to A first: 1 mA = 0.001 A.' },
    { id: 'code', name: 'Check the color code', title: 'Check with the color code', html: '', hint: 'First band = first digit, second band = second digit, third band = number of zeros to add.' }
  ];
  const schematic = `<svg viewBox="0 0 260 150" style="width:100%;max-width:260px" role="img" aria-label="Circuit diagram"><g fill="none" stroke="var(--ink)" stroke-width="2">
    <path d="M30,60 V20 H95 M125,20 H170"/><path d="M95,20 L120,8"/><circle cx="95" cy="20" r="3" fill="var(--ink)"/><circle cx="125" cy="20" r="3" fill="var(--ink)"/>
    <circle cx="190" cy="20" r="18"/><path d="M208,20 H235 V100 H185"/><path d="M185,100 l-5,-8 l-8,16 l-8,-16 l-8,16 l-8,-16 l-5,8"/><path d="M143,100 H30 V84"/>
    <path d="M18,62 H42 M24,70 H36 M18,78 H42 M24,86 H36"/><path d="M185,100 V130 H175 M143,100 V130 H155"/><circle cx="165" cy="130" r="12"/></g>
    <g font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle"><text x="190" y="25">A</text><text x="165" y="135">V</text><text x="8" y="70">+</text><text x="108" y="44">switch</text><text x="164" y="88">R</text></g></svg>`;

  const S = {
    build(R) { const st = R.st, C = scene(R); wiring(R, C); LabUI.html(schematic);
      K.on(C.sw.q('.swhit'), 'pointerdown', () => { if (st.closed) { st.closed = false; C.update(); return; }
        st.closed = true; SND.tone(300, .05, 'square', .08); const r = check(st);
        if (r.short) { C.update(); shortOops(R, r.at); return; }
        if (!r.ok) { K.msg(r.msg, 'bad', 6000); K.after(900, () => { st.closed = false; C.update(); }); C.update(); return; }
        C.update(); K.msg('The circuit works! Both meters are reading.', 'ok'); st.closed = false; C.update(); R.next(900); }); },
    m1_5: null
  };
  [1.5, 3, 4.5, 6].forEach(v => { S['m' + v] = R => {
    const st = R.st, C = scene(R); LabUI.html(dataTable(st)); let hot = 0, v0 = 0;
    const kh = C.ps.q('.knobhit'); kh.style.cursor = 'ns-resize';
    K.press(kh, { down: () => { v0 = st.Vs; }, move: s => { st.Vs = clamp(Math.round((v0 + ((s.x - s.x0) - (s.y - s.y0)) / 25) * 10) / 10, 0, 12); C.update(); } });
    K.on(C.sw.q('.swhit'), 'pointerdown', () => { st.closed = !st.closed; SND.tone(300, .05, 'square', .08); C.update(); });
    K.loop(dt => { if (!st.closed) { hot = Math.max(0, hot - dt); C.res.q('.rhot').setAttribute('opacity', 0); return; } const P = st.Vs * st.Vs / st.R;
      C.res.q('.rhot').setAttribute('opacity', clamp((P - .2) / .3, 0, .8)); hot = P > .3 ? hot + dt : Math.max(0, hot - dt);
      if (hot > 1.5) { st.closed = false; st.Vs = v; R.oops({ title: 'Fried resistor', text: `At ${st.Vs.toFixed(1)} V the resistor was turning ${(P).toFixed(2)} W of electrical energy into heat. It started to smoke.`, why: 'This resistor is rated for 0.25 W. Power P = V²/R grows fast as voltage rises. Stick to the voltages in the procedure and open the switch between readings.', fx: 'smoke', at: { x: 540, y: 500 } }); return false; } });
    LabUI.button('Record reading', () => {
      if (!st.closed) { K.msg('Close the switch first so current flows.'); return; }
      if (Math.abs(st.Vs - v) > .051) { K.msg(`Set the supply to ${v.toFixed(1)} V first. It reads ${st.Vs.toFixed(1)} V.`); return; }
      const r = solve(st, st.Vs), n = () => 1 + (Math.random() - .5) * .01;

  }; });
  delete S.m1_5;
  function dataTable(st) { return `<table class="rec"><thead><tr><th>Supply (V)</th><th>Voltmeter (V)</th><th>Ammeter (mA)</th></tr></thead><tbody>${st.data.map((d, i) => `<tr><td>${[1.5, 3, 4.5, 6][i].toFixed(1)}</td><td>${d.V.toFixed(2)}</td><td>${d.I.toFixed(1)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No readings yet</td></tr>'}</tbody></table>`; }
  const slope = st => { let a = 0, b = 0; st.data.forEach(d => { const I = d.I / 1000; a += d.V * I; b += I * I; }); return a / b; };
  function graph(st) {
    const W = 280, H = 170, maxI = Math.max(...st.data.map(d => d.I)) * 1.15, px = I => 36 + I / maxI * (W - 46), py = V => H - 26 - V / 7 * (H - 40), k = slope(st);
    let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" role="img" aria-label="Graph of voltage against current">`;
    for (let V = 0; V <= 6; V += 2) s += `<line x1="36" x2="${W - 10}" y1="${py(V)}" y2="${py(V)}" stroke="var(--line)"/><text x="30" y="${py(V) + 4}" font-size="10" fill="var(--muted)" text-anchor="end">${V}</text>`;
    const step = maxI > 40 ? 10 : 5; for (let I = 0; I <= maxI; I += step) s += `<text x="${px(I)}" y="${H - 10}" font-size="10" fill="var(--muted)" text-anchor="middle">${I}</text>`;
    s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(maxI)}" y2="${py(k * maxI / 1000)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
    st.data.forEach(d => s += `<circle cx="${px(d.I)}" cy="${py(d.V)}" r="5" fill="var(--warn)"/>`);
    return s + `<text x="${W / 2}" y="${H}" font-size="10" fill="var(--muted)" text-anchor="middle">Current I (mA)</text><text x="8" y="12" font-size="10" fill="var(--muted)">V (volts)</text></svg>`;
  }
  S.slope = R => { const st = R.st; scene(R); const k = slope(st);
    R.sheet('', `${dataTable(st)}${graph(st)}<p style="margin-top:8px">The points fall on a straight line through the origin, so V ∝ I. <b>What resistance does the slope give?</b></p>`);
    LabUI.choices([Math.round(k) + ' Ω', (k / 1000).toFixed(3) + ' Ω', (1 / k).toFixed(4) + ' Ω', Math.round(k * 10) + ' Ω'], 0, () => { st.Rm = k; R.next(900); }, () => { R.mistake('Calculation error', 'R = V ÷ I, with I in amperes.'); K.msg('R = V ÷ I. Remember to change mA to A (divide by 1000).', 'bad', 3600); }); };
  S.code = R => { const st = R.st; scene(R);
    K.zoom(540, 390, 92, `<rect x="-100" y="-100" width="200" height="200" fill="#33403f"/><line x1="-100" y1="0" x2="100" y2="0" stroke="#c9ced1" stroke-width="8"/><rect x="-70" y="-26" width="140" height="52" rx="24" fill="#e3c99a" stroke="#a88758" stroke-width="2"/>${NOM[st.nom].map((c, i) => `<rect x="${-48 + i * 24}" y="-26" width="12" height="52" fill="${BAND[c]}"/>`).join('')}<rect x="32" y="-26" width="12" height="52" fill="${BAND.gold}"/>`, 'Magnified resistor', { x: 540, y: 522 });
    R.sheet('', `<p>Your measured resistance: <b>${Math.round(st.Rm)} Ω</b>. Read the color bands on the resistor (left to right; gold means ±5%).</p>
      <table class="rec" style="margin-top:8px"><tbody><tr>${['black', 'brown', 'red', 'orange', 'yellow'].map((c, i) => `<td><span style="display:inline-block;width:12px;height:12px;background:${BAND[c]};border:1px solid #999;margin-right:4px"></span>${c} = ${i}</td>`).join('')}</tr><tr>${['green', 'blue', 'violet', 'grey', 'white'].map((c, i) => `<td><span style="display:inline-block;width:12px;height:12px;background:${BAND[c]};border:1px solid #999;margin-right:4px"></span>${c} = ${i + 5}</td>`).join('')}</tr></tbody></table>
      <p style="margin-top:8px"><b>Which value does the color code show?</b></p>`);
    const vals = [150, 220, 330, 470]; LabUI.choices(vals.map(v => `${v} Ω (${NOM[v].join('–')})`), vals.indexOf(st.nom), () => R.next(900), () => { R.mistake('Misread the color code', 'Digit, digit, then the number of zeros.'); K.msg('Band 1 and 2 are digits; band 3 says how many zeros follow.', 'bad', 3600); }); };

  return makeLab({
    fresh: () => { const nom = [150, 220, 330, 470][Math.random() * 4 | 0]; return { nom, R: Math.round(nom * (1 + (Math.random() - .5) * .06)), wires: [], closed: false, Vs: 0, data: [] }; },
    ppe: { need: ['goggles'], decoys: ['sunglasses', 'mitts', 'scarf'], why: { mitts: 'Oven mitts make it impossible to handle small wires and clips. You don’t need gloves for this low-voltage lab.' }, hint: 'Resistors can get hot and pop. What protects your eyes?', note: 'Keep water and drinks away from electrical equipment.' },
    gather: { hint: 'You need a source, something to control the current, the part you’re testing, and two meters.', items: [
      { id: 'ps', name: 'DC power supply', ok: true, art: () => `${ART.shadow(54, 5)}<g transform="translate(-260 -470)">${A.ps()}</g>`, scale: .5 },
      { id: 'res', name: 'Resistor on a mount', ok: true, art: () => `${ART.shadow(50, 4)}<g transform="translate(-540 -540)">${A.resistor(220)}</g>`, scale: .5 },
      { id: 'amm', name: 'Ammeter', ok: true, art: () => `${ART.shadow(50, 5)}<g transform="translate(-680 -405)">${A.meter(680, 365, 'mA', 'x')}</g>`, scale: .55 },
      { id: 'vm', name: 'Voltmeter', ok: true, art: () => `${ART.shadow(50, 5)}<g transform="translate(-760 -560)">${A.meter(760, 520, 'V', 'x')}</g>`, scale: .55 },
      { id: 'sw', name: 'Switch', ok: true, art: () => `${ART.shadow(54, 4)}<g transform="translate(-470 -336)">${A.sw()}</g>` },
      { id: 'leads', name: 'Connecting wires', ok: true, art: () => `${ART.shadow(40, 4)}${WIRE_COLS.slice(0, 4).map((c, i) => `<path d="M-40,${-10 - i * 6} C-20,${-70 - i * 10} 20,${-70 + i * 6} 40,${-10 - i * 4}" fill="none" stroke="${c}" stroke-width="4"/>`).join('')}` },
      { id: 'water', ok: false, art: () => ART.beaker(), why: 'Water and electricity don’t mix. Keep liquids away from circuits.' },
      { id: 'magnet', ok: false, art: () => `${ART.shadow(30, 4)}<path d="M-30,0 L-30,-60 A30,30 0 0 1 30,-60 L30,0 L14,0 L14,-60 A14,14 0 0 0 -14,-60 L-14,0Z" fill="#d64045"/>`, why: 'A magnet isn’t part of this circuit.' },
      { id: 'bun', ok: false, art: () => `${ART.shadow(36, 5)}<ellipse cx="0" cy="-6" rx="38" ry="8" fill="#3d464c"/><rect x="-9" y="-120" width="18" height="110" rx="3" fill="url(#metal)"/>`, why: 'No open flames near electrical equipment, and nothing gets heated in this lab.' },
      { id: 'spring', ok: false, art: () => `${ART.shadow(20, 4)}<path d="M0,-130 ${Array.from({ length: 12 }, (_, i) => `q${i % 2 ? -18 : 18},5 0,10`).join(' ')}" fill="none" stroke="#9aa5ab" stroke-width="3"/>`, why: 'A spring isn’t part of the procedure.' }
    ] },
    steps, S,
    bg: () => BG.bench('ELECTRICITY RULES', ['Goggles on at all times', 'Switch open while wiring', 'No liquids near circuits', 'Ammeter in series', 'Report hot parts'], false),
    finale(R) { scene(R); },
    summary: R => R.st.Rm ? `Measured resistance: <b>${Math.round(R.st.Rm)} Ω</b>. Color code: <b>${R.st.nom} Ω ±5%</b>.` : '',
    finaleMsg: 'Data collected. Now check your thinking.',
    quiz: [
      { q: 'How must an ammeter be connected?', a: ['In series, as part of the loop', 'In parallel across the resistor', 'Straight across the power supply', 'It doesn’t matter'], c: 0, e: 'All the current has to flow through the ammeter for it to measure the current.' },
      { q: 'How must a voltmeter be connected?', a: ['In parallel, across the part being measured', 'In series with the resistor', 'Only to the + terminal of the supply', 'Between the switch and the ammeter'], c: 0, e: 'A voltmeter measures the difference in electric potential between two points, so its leads go on either side of the part.' },
      { q: 'If the voltage across the same resistor doubles, the current…', a: ['doubles', 'halves', 'stays the same', 'quadruples'], c: 0, e: 'Ohm’s law: I = V/R. With R fixed, current is proportional to voltage.' },
      { q: 'On a graph of voltage (y) against current (x), the slope is the…', a: ['resistance', 'power', 'charge', 'energy'], c: 0, e: 'Slope = ΔV/ΔI = R.' },
      { q: 'Why does a resistor get hot at high voltage?', a: ['It turns electrical energy into thermal energy, and power P = V²/R rises quickly with voltage', 'Electrons get stuck and stop', 'The voltmeter heats it up', 'Resistance drops to zero'], c: 0, e: 'Doubling the voltage makes four times the power, which can exceed the resistor’s rating.' }

    meta: { id: 'ohm', short: 'Ohm’s Law', title: 'Ohm’s Law', courses: ['hs-phys'], time: '15–20 min',
      summary: 'Wire a series circuit with an ammeter and a voltmeter, measure current at four voltages, and find resistance from the slope of the graph.',

      materials: ['DC power supply', 'Resistor on a mount', 'Ammeter and voltmeter', 'Switch', 'Connecting wires'],
      safety: ['Safety goggles on', 'Keep the switch open while you change wires', 'Never connect an ammeter across a power source', 'Keep liquids away from the circuit', 'Tell your teacher if a part gets hot or smells'],
      ngss: [['HS-PS3-1', 'Create a computational model to calculate the change in the energy of one component in a system.'], ['HS-PS3-3', 'Design, build and refine a device that converts one form of energy into another (electrical to thermal in the resistor).'], ['SEP 4', 'Analyzing and interpreting data: graph V against I.'], ['CCC 3', 'Scale, proportion and quantity: V is proportional to I.']],
      thumb: big => labThumb('ohm', big) }
  });
})();


/* ═══════════ MS Physical Science: conservation of mass ═══════════
   Vinegar + baking soda in a sealed bag on a balance: the mass stays the same. Open the bag and CO₂ escapes, so the
   reading drops. Masses are calculated from real amounts (5% acetic acid, NaHCO₃ 84 g/mol, CO₂ 44 g/mol). */
const MassLab = (() => {
  const K = Kit;
  const BAG = { x: 300, y: 582 }, BAL = { x: 560, y: 588 }, CUP = { x: 690, y: 584 }, SPOON = { x: 770, y: 586 }, SODA = { x: 880, y: 586 }, VIN = { x: 120, y: 586 };
  const M_BAG = 7.2, M_CUP = 4.1, SCOOP = 4.6;
  const co2Max = st => Math.min(st.scoops * SCOOP / 84, st.vin * 1.01 * .05 / 60) * 44;
  const bagMass = st => M_BAG + (st.cupIn ? M_CUP + st.scoops * SCOOP : 0) + st.vin * 1.01 - st.lost;
  const A = {
    balance: () => `${ART.shadow(110, 8)}<rect x="-106" y="-52" width="212" height="52" rx="10" fill="#e8ecee" stroke="#9aa5ab" stroke-width="2"/><rect x="-96" y="-44" width="120" height="30" rx="5" fill="#1a2a20"/>
      <text class="disp" x="16" y="-22" font-family="JetBrains Mono, monospace" font-size="19" font-weight="700" fill="#7dff9a" text-anchor="end">0.00 g</text>
      <rect class="tare" x="38" y="-40" width="56" height="22" rx="11" fill="#2f6fd6"/><text x="66" y="-25" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">TARE</text>
      <rect x="-14" y="-62" width="28" height="12" fill="#9aa5ab"/><ellipse cx="0" cy="-64" rx="92" ry="9" fill="url(#metal)" stroke="#7f898f"/><text x="-90" y="-6" font-size="8" font-weight="700" fill="#59646b">DIGITAL BALANCE · 0.01 g</text>`,
    cup: (scoops, tilt) => `${ART.shadow(20, 4)}<g transform="rotate(${tilt || 0} 0 -18)"><path d="M-16,-38 L16,-38 L13,0 L-13,0Z" fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="2"/>${scoops ? `<path d="M-12,${-4 - Math.min(scoops, 5) * 5} q12,-6 24,0 L12,-2 L-12,-2Z" fill="#fbfbf7" stroke="#d9d9cf"/>` : ''}</g><rect x="-26" y="-50" width="52" height="54" fill="transparent"/>`,
    spoon: loaded => `<g transform="rotate(-12)"><rect x="-46" y="-5" width="60" height="6" rx="3" fill="url(#metal)"/><ellipse cx="22" cy="-3" rx="16" ry="9" fill="url(#metal)" stroke="#7f898f"/>${loaded ? '<ellipse cx="22" cy="-7" rx="12" ry="6" fill="#fbfbf7" stroke="#d9d9cf"/>' : ''}</g><rect x="-50" y="-22" width="92" height="30" fill="transparent"/>`,
    vinegar: () => ART.bottle({ body: 'rgba(240,240,220,.6)', stroke: '#c9c39b', cap: '#c43d3d', label: 'VINEGAR', sub: '5% acidity', lc: '#7a5a10', liquid: '#f3eab0', h: 150, w: 64 }),
    soda: () => ART.bottle({ shape: 'box', body: '#f08c1d', stroke: '#b5620d', cap: '#d57610', label: 'BAKING', sub: 'SODA', lc: '#fff', lbg: '#d8401e', h: 90, w: 64 })
  };
  function bagSVG(st) {
    const W = 76, H = 124, p = st.puff * 30, lv = st.vin > 0 ? 8 + st.vin * .42 : 0, sealedW = st.sealed * 152;
    let s = `${ART.shadow(82, 7)}<path d="M-${W},0 C${-W - p},${-H * .3} ${-W - p},${-H * .82} -${W - 4},-${H} L${W - 4},-${H} C${W + p},${-H * .82} ${W + p},${-H * .3} ${W},0Z" fill="rgba(232,242,247,.45)" stroke="#b9cfd8" stroke-width="2"/>`;
    if (lv) s += `<path d="M-${W - 2},-2 L${W - 2},-2 L${W - 2 + p * .2},-${lv} L-${W - 2 + p * .2},-${lv}Z" fill="${mixHex('#f3eab0', '#fbfbf2', st.react)}" opacity=".75"/>`;
    if (st.cupIn) s += `<g transform="translate(-6 -4)">${A.cup(st.scoops * (1 - st.react), st.react > 0 ? 70 : 0).replace(ART.shadow(20, 4), '')}</g>`;
    if (st.react > 0 && st.react < 1) for (let i = 0; i < 16; i++) s += `<circle cx="${(Math.random() - .5) * 120}" cy="${-4 - Math.random() * (lv + 30)}" r="${1.5 + Math.random() * 3}" fill="#fff" opacity=".8"/>`;
    s += `<rect x="-${W}" y="-${H + 9}" width="${W * 2}" height="6" rx="3" fill="#2f6fd6"/><rect x="-${W}" y="-${H + 4}" width="${W * 2}" height="5" rx="2.5" fill="#f2d33c"/><rect class="zipok" x="-${W}" y="-${H + 9}" width="${sealedW}" height="11" rx="3" fill="#2fa25a"/>`;
    return s + `<rect x="-${W + 10}" y="-${H + 20}" width="${W * 2 + 20}" height="${H + 24}" fill="transparent"/>`;
  }
  function scene(R, o = {}) {
    const st = R.st; const bal = K.obj(BAL.x, BAL.y, A.balance(), 'fixed');
    const onBal = st.onBal, bag = K.obj(onBal ? BAL.x : BAG.x, onBal ? BAL.y - 66 : BAG.y, bagSVG(st), o.bagCls || 'fixed');
    bag.update = () => { bag.inner.innerHTML = bagSVG(st); };
    bal.update = () => { const m = st.onBal ? bagMass(st) : 0; bal.q('.disp').textContent = (m - st.tare).toFixed(2) + ' g'; };
    K.loop(() => { if (!bal.g.isConnected) return false; bal.update(); });
    return { bal, bag };
  }
  const steps = [
    { id: 'vin', name: 'Pour 50 mL of vinegar', title: 'Vinegar into the bag', html: 'Drag the <b>vinegar</b> to the open zip-top bag. <b>Hold to pour</b> about <b>50 mL</b> (40–60 mL).', hint: 'Short pours. Watch the gauge.' },
    { id: 'soda', name: 'Scoop baking soda into the cup', title: 'Baking soda into the small cup', html: 'Drag the <b>spoon</b> into the baking soda box to scoop, then drag it over the <b>small cup</b> to drop it in. <b>1 level scoop</b> is plenty. Click <b>Done adding</b> when finished.', hint: 'Keep the baking soda in the cup. It must not touch the vinegar yet.' },
    { id: 'cup', name: 'Stand the cup inside the bag', title: 'Cup into the bag', html: 'Gently drag the <b>cup of baking soda</b> into the bag so it <b>stands upright</b> next to the vinegar. Don’t tip it!', hint: 'Move slowly. A fast swing spills the baking soda into the vinegar too early.' },
    { id: 'seal', name: 'Seal the bag', title: 'Seal the bag', html: 'Press the <b>left end of the zipper</b> and drag along it to the right to seal the bag shut.', hint: 'Stay on the blue and yellow strip.' },
    { id: 'w1', name: 'Weigh the sealed bag', title: 'Mass before the reaction', html: 'Drag the sealed bag onto the <b>balance</b>. When the number settles, click <b>Record mass</b>.', hint: 'The balance reads to 0.01 g.' },
    { id: 'mix', name: 'Tip the cup and mix', title: 'Start the reaction', html: '<b>Hold the button on the bag and wiggle the mouse left and right</b> to tip the cup and mix the baking soda into the vinegar. Watch the bag!', hint: 'Bubbles mean a gas is being made.' },
    { id: 'w2', name: 'Weigh it again', title: 'Mass after the reaction', html: 'The reaction is done. Click <b>Record mass</b>, then answer the question.', hint: 'Compare with your first reading.' },
    { id: 'open', name: 'Open the bag', title: 'Open the system', html: 'Leave the bag on the balance. Press the <b>right end of the zipper</b> and drag left to unzip it. Watch the balance, then click <b>Record mass</b>.', hint: 'Listen for the hiss.' },

const Game = {
  G: null, band: 'hs', nTeams: LS.get('gTeams', 3), secs: LS.get('gSecs', 30),
  names: LS.get('gNames', ['Team Helix', 'Team Quark', 'Team Magma', 'Team Nova']),

  page(m) { this.m = m; if (!this.G) this.setup(); else if (this.G.cur) this.question(); else if (this.G.over) this.final(); else this.board(); },
  setup() {
    const m = this.m;
    m.innerHTML = `<header style="display:grid;gap:6px"><span class="eyebrow">Class game · project it on the board</span><h1>Science Showdown</h1><p class="muted" style="max-width:64ch">Teams take turns choosing a category and point value. Get it wrong and the next team can steal it for half the points. One tile is a hidden <b>Lab Bonus</b> worth double.</p></header>

          <div style="display:grid;gap:6px"><span class="eyebrow">Teams</span><div class="seg" id="sTeams">${[2, 3, 4].map(n => `<button data-v="${n}" class="${this.nTeams === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
          <div style="display:grid;gap:6px"><span class="eyebrow">Answer time</span><div class="seg" id="sSecs">${[15, 30, 45].map(n => `<button data-v="${n}" class="${this.secs === n ? 'on' : ''}">${n} s</button>`).join('')}</div></div>
