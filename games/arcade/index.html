<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Arcade</title>
<meta name="description" content="Six retro arcade games for high school biology: cells, receptors, the immune system, mitosis, DNA and enzymes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070d24; --bg2: #0b1536; --ink: #e8efff; --muted: #93a3cc; --line: rgba(140, 170, 255, .22);
  --pix: 'Press Start 2P', ui-monospace, monospace; --sans: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --c-quest: #39a0ff; --c-rush: #b46bff; --c-def: #28e0d0; --c-mito: #c77dff; --c-gene: #6d8cff; --c-enz: #4be37a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--sans); color: var(--ink); background: radial-gradient(1200px 600px at 50% -10%, #17286a 0%, transparent 60%), radial-gradient(700px 500px at 100% 100%, #2a1058 0%, transparent 60%), var(--bg); line-height: 1.5; overflow-x: hidden; }
button { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(7, 13, 36, .85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.logo { white-space: nowrap; display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; font-weight: 700; font-size: 1.05rem; color: #fff; }
.logo svg { width: 30px; height: 30px; }
.logo .bw { font-weight: 800; letter-spacing: -.015em; color: #fff; }
.logo .bw span { color: #4fb3ff; }
@media (max-width: 640px) { .logo .bw, .logo .sep { display: none; } }
.logo .sep { width: 1px; height: 22px; background: var(--line); }
.top .tagline { font: 12px var(--pix); letter-spacing: .12em; color: #cfe0ff; text-shadow: 0 0 10px rgba(120, 180, 255, .7); margin: 0 auto; white-space: nowrap; }
.top .tagline i { font-style: normal; color: #8fd0ff; }
.top .chipx { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .82rem; white-space: nowrap; }
.top .chipx svg { width: 16px; height: 16px; }
.top .back { display: none; }
body.ingame .top .back { display: inline-flex; }
body.ingame .top .tagline { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); font-weight: 700; cursor: pointer; transition: transform .08s, border-color .15s, background .15s; }
.btn:hover { border-color: #8fd0ff; background: rgba(255, 255, 255, .09); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #4fb4ff, #2a7cf0); border-color: transparent; color: #fff; box-shadow: 0 0 18px rgba(79, 180, 255, .45); }
.btn.sm { padding: 6px 12px; font-size: .86rem; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; }
main { max-width: 1320px; margin: 0 auto; padding: 24px 18px 40px; }
/* hub */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .top .tagline { display: none; } }
@media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); } .top .chipx { display: none; } }
.tile { --c: #39a0ff; position: relative; display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; border-radius: 18px; overflow: hidden; cursor: pointer; background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01)), var(--bg2); border: 2px solid color-mix(in srgb, var(--c) 75%, transparent); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4) inset, 0 0 22px color-mix(in srgb, var(--c) 40%, transparent), 0 0 2px var(--c) inset; transition: transform .15s, box-shadow .15s; }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(0, 0, 0, .4) inset, 0 0 36px color-mix(in srgb, var(--c) 65%, transparent), 0 0 2px var(--c) inset; outline: none; }
.tile .th { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 20%, transparent), transparent); }
.tile .ti { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--c); color: var(--c); background: rgba(0, 0, 0, .3); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.tile .ti svg { width: 22px; height: 22px; }
.tile h2 { margin: 0; font-size: 1.12rem; color: #fff; }
.tile .sub { font-size: .84rem; color: var(--muted); }
.tile canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #050a1c; }
.tile .best { position: absolute; top: 64px; right: 10px; font: 9px var(--pix); line-height: 1.6; padding: 6px 8px; border-radius: 8px; background: rgba(5, 10, 28, .85); border: 1px solid var(--line); text-align: center; }
.tile .best b { display: block; font-size: 12px; color: #fff; }
.tile .topic { position: absolute; left: 10px; bottom: 10px; font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(5, 10, 28, .8); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.foot { margin-top: 26px; text-align: center; font: 10px var(--pix); letter-spacing: .25em; color: #6f80b0; }
/* game screen */
.stage { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 16 / 9; max-height: calc(100vh - 150px); border-radius: 16px; overflow: hidden; border: 2px solid var(--c, #39a0ff); box-shadow: 0 0 30px color-mix(in srgb, var(--c, #39a0ff) 45%, transparent); background: #050a1c; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
:fullscreen .stage { max-height: calc(100vh - 80px); }
.under { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; max-width: 1280px; margin: 12px auto 0; color: var(--muted); font-size: .9rem; }
.keys kbd { font: 11px var(--pix); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); color: #cfe0ff; background: rgba(255, 255, 255, .05); }
/* overlay cards (title, quiz, game over) */
.ov { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 8, 22, .72); backdrop-filter: blur(2px); z-index: 5; padding: 12px; }
.ov[hidden] { display: none; }
.card { width: min(620px, 100%); max-height: 100%; overflow: auto; padding: 22px 24px; border-radius: 16px; background: linear-gradient(180deg, #111d48, #0a1333); border: 2px solid var(--c, #39a0ff); box-shadow: 0 0 26px color-mix(in srgb, var(--c, #39a0ff) 45%, transparent); }
.card h3 { margin: 0 0 6px; font: 18px/1.4 var(--pix); color: #fff; text-shadow: 0 0 12px var(--c, #39a0ff); }
.card .eyebrow { font: 9px var(--pix); letter-spacing: .14em; color: var(--c, #39a0ff); }
.card p { margin: 8px 0; }
.card ul { margin: 8px 0 14px; padding-left: 20px; }
.card li { margin: 4px 0; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.card .big { font: 26px var(--pix); color: #fff; margin: 10px 0; }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opts button { text-align: left; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); cursor: pointer; font-weight: 700; }
.opts button:hover, .opts button:focus-visible { border-color: var(--c, #39a0ff); background: rgba(255, 255, 255, .1); outline: none; }
.opts button.right { border-color: #4be37a; background: rgba(75, 227, 122, .18); }
.opts button.wrong { border-color: #ff5d7a; background: rgba(255, 93, 122, .16); }
.opts button kbd { font: 10px var(--pix); margin-right: 8px; color: var(--muted); }
.why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .06); font-size: .94rem; }
.why b { color: #fff; }
/* touch controls */
.pad { position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end; padding: 12px; pointer-events: none; z-index: 4; }
.pad.on { display: flex; }
.pad .grp { display: flex; gap: 10px; pointer-events: auto; }
.pad button { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .1); font: 12px var(--pix); color: #fff; touch-action: none; }
.pad button.act { border-color: var(--c, #39a0ff); background: color-mix(in srgb, var(--c, #39a0ff) 30%, transparent); }
.toast { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); z-index: 6; max-width: 80%; padding: 8px 14px; border-radius: 10px; background: rgba(5, 10, 28, .92); border: 1px solid var(--c, #39a0ff); font-size: .95rem; text-align: center; pointer-events: none; transition: opacity .3s; }
.toast[hidden] { display: block; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .tile, .btn { transition: none; } }
/* inside an Educator Space game page: that page has its own menu, so the arcade stays on the one game */
.embed #backBtn, .embed #hubBtn { display: none; }
.embed .logo { pointer-events: none; }
/* small screens: compact header, and the cards float over the whole screen so they are never cut off */
.btn, .chipx { white-space: nowrap; }
@media (max-width: 900px) { .top .chipx { display: none; } header.top { gap: 8px; padding: 8px 12px; } main { padding: 12px 10px 24px; } }
@media (max-width: 700px), (max-height: 500px) {
  .ov { position: fixed; z-index: 50; padding: 10px; }
  .card { max-height: calc(100vh - 20px); padding: 16px 18px; }
  .card h3 { font-size: 15px; }
  .stage { border-radius: 10px; max-height: calc(100vh - 110px); }
  .under .keys { display: none; }
}
.rotate { display: none; }
@media (max-width: 700px) and (orientation: portrait) { .rotate { display: block; margin: 10px auto 0; text-align: center; color: var(--muted); font-size: .9rem; } }
</style>
</head>

</header>
<main id="app"></main>

</html>
