<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Cascade</title>
<meta name="description" content="A cell-signaling game for AP and high school biology: bind ligands to receptors, relay signal transduction pathways, and diagnose mutated receptors, antagonists, dose effects and defective proteins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4f6;--panel:#ffffff;--panel2:#f4f8fa;--line:#d3e0e6;--ink:#11303a;--muted:#5d7682;
  --teal:#2f8f9d;--teal2:#4aa7b4;--teal-ink:#0f4f59;--accent:#e8772e;--accent-soft:#fdeee3;
  --good:#1f9d6b;--good-soft:#e2f5ec;--bad:#d64561;--bad-soft:#fbe7ec;--warn:#c98a12;
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(900px 500px at 90% -10%,#d4eaf0 0%,transparent 60%),var(--bg);line-height:1.5}
button{font:inherit}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font-weight:700;font-size:1.08rem;cursor:pointer;padding:0}
.logo b{color:var(--teal)}
.logo svg{width:30px;height:30px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 .78rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink)}
.pill.bad b{color:var(--bad)}
main{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;cursor:pointer;transition:transform .08s,border-color .15s,filter .15s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font:700 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1,h2,h3{line-height:1.15;margin:.15em 0 .35em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:center;margin-bottom:26px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.6rem);letter-spacing:-.01em}
.hero h1 span{color:var(--teal)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch}
.hero .art{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#e3f0f4}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.namebox input{padding:10px 14px;border-radius:10px;border:1px solid var(--line);font:inherit;min-width:240px;background:#fff;color:var(--ink)}
.namebox input:focus,.opt:focus-visible,.btn:focus-visible,.card-step:focus-visible{outline:3px solid #9ad3dc;outline-offset:1px}
.sec-t{margin:26px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-t h2{margin:0;font-size:1.3rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 8px 20px rgba(17,48,58,.08)}
.mcard .ic{font-size:1.7rem}
.mcard h3{margin:0;font-size:1.12rem}
.mcard .tg{font:700 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcard .stars{margin-top:auto;font-size:1.05rem;letter-spacing:2px;color:#f0b429}
.mcard .stars i{font-style:normal;color:#d3dde2}
.mcard.ch{background:linear-gradient(160deg,#fff,#fff7f1)}
.mcard.ch .tg{color:var(--accent)}

/* play */
.play{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1080px){.play{grid-template-columns:1fr}}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto}
.sheet{display:grid;gap:12px;align-content:start}
.sheet .card{padding:16px}
.phases{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.phases span{font:700 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.phases span.on{background:var(--teal);border-color:var(--teal);color:#fff}
.phases span.done{background:var(--good-soft);border-color:#a9dfc6;color:var(--good)}
.brief{font-size:1rem}
.instr{background:var(--panel2);border-left:3px solid var(--teal);padding:10px 12px;border-radius:0 10px 10px 0;font-size:.95rem}
.msg{padding:10px 12px;border-radius:10px;font-size:.95rem}
.msg:empty{display:none}
.msg.good{background:var(--good-soft);color:#126346;border:1px solid #a9dfc6}
.msg.bad{background:var(--bad-soft);color:#8f1f37;border:1px solid #f1b5c3}
.msg.info{background:#e8f3f6;color:var(--teal-ink);border:1px solid #c3e0e6}
.hint{background:#fff8e6;border:1px dashed #e7c46a;color:#6f5200;padding:10px 12px;border-radius:10px;font-size:.93rem}
.cards{display:grid;gap:8px}
.card-step{text-align:left;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,transform .1s}
.card-step:hover:not(:disabled){border-color:var(--teal)}
.card-step .k{font:700 .75rem var(--mono);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--panel2);flex:none;color:var(--muted)}
.card-step.used{opacity:.45;text-decoration:line-through}
.card-step:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .k{font:700 .75rem var(--mono);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--panel2);flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.q{font-weight:700;font-size:1.04rem;margin:0 0 10px}
.tasks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tasks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:.95rem}
.tasks li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;margin-top:2px}
.tasks li.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.tasks .hold{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
.tasks .hold i{display:block;height:100%;background:var(--teal);width:0}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-bottom:6px}
.ctl label b{font-family:var(--mono);color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--teal)}
.meters{display:grid;gap:8px}
.meter{display:grid;grid-template-columns:120px 1fr 48px;gap:8px;align-items:center;font-size:.86rem}
.meter .bar{height:12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;transition:width .15s}
.meter span:last-child{font-family:var(--mono);text-align:right;font-weight:700}
.toggle{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.95rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.done-box{text-align:center}
.done-box .big-stars{font-size:2.2rem;letter-spacing:6px;color:#f0b429}
.done-box .big-stars i{font-style:normal;color:#d3dde2}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.tile b{display:block;font:700 1.15rem var(--mono)}
.tile span{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.why{color:var(--muted);font-size:.93rem;margin-top:8px}
.amp{font:700 .85rem var(--mono);color:var(--accent)}

/* report */
.rtable{width:100%;border-collapse:collapse;font-size:.95rem}
.rtable th,.rtable td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rtable th{font:700 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;transition:all .25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* svg text */
.ltx{font:700 13px var(--sans);fill:#17414b;text-anchor:middle;paint-order:stroke;stroke:#ffffffcc;stroke-width:4px;stroke-linejoin:round}
.rlab{font:700 12.5px var(--sans);fill:var(--teal-ink);text-anchor:middle;paint-order:stroke;stroke:#ffffffdd;stroke-width:4px}
.zone{font:700 11px var(--mono);letter-spacing:.14em;fill:#7f99a3}
.nodet{font:700 14px var(--sans);fill:var(--ink);text-anchor:middle}
.nodes{font:700 11px var(--mono);fill:var(--accent);text-anchor:middle}
.lig{cursor:grab}
.lig.dragging{cursor:grabbing}
.lig.sel .ring{opacity:1}
.ring{opacity:0}
@keyframes pulse{0%{opacity:.9}100%{opacity:0}}
.pulse{animation:pulse 1.1s ease-out forwards}
@media print{header.top,.noprint{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){.mcard,.btn{transition:none}}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="homeBtn" title="All missions"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2f8f9d"/><rect x="4" y="20" width="32" height="7" rx="3" fill="#dff1f4"/><rect x="14" y="10" width="5" height="22" rx="2.5" fill="#0f4f59"/><rect x="21" y="10" width="5" height="22" rx="2.5" fill="#0f4f59"/><polygon points="20,4 25,12 15,12" fill="#f28c38"/></svg>Signal <b>Cascade</b></button>
  <div class="hud" id="hud"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   SIGNAL CASCADE — a cell-signaling game for high school and AP Biology
   Four pathway missions (GPCR, receptor tyrosine kinase, ligand-gated ion
   channel, intracellular receptor): drag the right ligand into the binding
   site it fits, relay the signal step by step, then choose the response.
   Four challenges: a mutated receptor, a competitive antagonist, ligand
   concentration, and a defective signaling protein.
   Single file, no build step. Edit the MISSIONS data to change content.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem('sigcas:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('sigcas:' + k, JSON.stringify(v)); } catch (e) {} } };
let toastT; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }
const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

/* ---------------- molecules ---------------- */
const LIG = {
  epi:  { name: 'Epinephrine',   shape: 'tri',  color: '#f28c38', dark: '#a8521a' },
  ins:  { name: 'Insulin',       shape: 'dia',  color: '#e4587f', dark: '#9c2a4c' },
  egf:  { name: 'EGF',           shape: 'sq',   color: '#8a6cf0', dark: '#4f37a8' },
  ach:  { name: 'Acetylcholine', shape: 'circ', color: '#29ad78', dark: '#13714b' },
  cort: { name: 'Cortisol',      shape: 'hex',  color: '#e2a91a', dark: '#8f6a06', lipid: true },
  prop: { name: 'Propranolol',   shape: 'tri',  color: '#8b95a7', dark: '#4c5566' }
};

/* ---------------- missions ---------------- */
const MISSIONS = [
  { id: 'gpcr', kind: 'path', icon: '⚡', title: 'Fight or Flight', tag: 'G protein-coupled receptor', cell: 'Liver cell',
    brief: 'Your heart is pounding before a big race, and your adrenal glands release the fight-or-flight hormone into your blood. Deliver it to this liver cell so the cell releases sugar for your muscles.',
    hint: 'The fight-or-flight hormone is epinephrine (adrenaline). A ligand binds only to a receptor whose binding site has a complementary shape.',
    target: 'epi', ligands: ['epi', 'ins', 'ach', 'egf'],
    receptors: [
      { kind: 'rtk', x: 190, fits: ['dia', 'dia'], name: 'Insulin receptor (receptor tyrosine kinase)' },
      { kind: 'gpcr', x: 500, fits: ['tri'], name: 'β-adrenergic receptor (G protein-coupled receptor)', target: true },
      { kind: 'gpcr', x: 810, fits: ['star'], name: 'Glucagon receptor (G protein-coupled receptor)' }],
    steps: [
      { t: 'The G protein swaps GDP for GTP', s: 'G protein (GTP)', amp: '10²', why: 'The activated receptor makes the G protein release GDP and pick up GTP, which switches it on.' },
      { t: 'Adenylyl cyclase is activated', s: 'Adenylyl cyclase', amp: '10²', why: 'The GTP-bound G protein moves along the membrane and switches on the enzyme adenylyl cyclase.' },
      { t: 'ATP is converted to cAMP', s: 'cAMP · 2nd messenger', amp: '10⁴', why: 'Adenylyl cyclase turns ATP into cyclic AMP, a small second messenger that spreads through the cytoplasm.' },
      { t: 'Protein kinase A is activated', s: 'Protein kinase A', amp: '10⁴', why: 'cAMP binds and activates protein kinase A (PKA).' },
      { t: 'Phosphorylase kinase is phosphorylated', s: 'Phosphorylase kinase', amp: '10⁵', why: 'PKA adds phosphate groups to phosphorylase kinase. Each kinase activates many copies of the next one.' },
      { t: 'Glycogen phosphorylase is activated', s: 'Glycogen phosphorylase', amp: '10⁶', why: 'Phosphorylase kinase switches on glycogen phosphorylase, the enzyme that breaks glycogen down.' }],
    decoys: [
      { t: 'Ras swaps GDP for GTP', why: 'Ras is a relay protein in receptor tyrosine kinase pathways, not in this GPCR pathway.' },
      { t: 'The two receptor halves pair up (dimerize)', why: 'Dimerization is how receptor tyrosine kinases start. A GPCR works as a single protein.' }],
    response: { q: 'What does the liver cell do now?', fx: 'glucose', banner: '10⁸ glucose molecules released',
      a: ['It breaks down glycogen and releases glucose into the blood', 'It divides into two cells', 'It contracts', 'It makes new insulin receptors'],
      why: ['Glycogen phosphorylase breaks glycogen into glucose, and the liver releases it for your muscles. One epinephrine molecule can lead to about 10⁸ glucose molecules: that’s signal amplification.',
        'Cell division is the response to growth factors through receptor tyrosine kinase pathways.', 'Contraction is a muscle-cell response.', 'Making new proteins needs gene expression. This fast response uses enzymes the cell already has.'] },
    checks: [
      { q: 'Why is cAMP called a “second messenger”?', a: ['It carries the signal inside the cell after the first messenger (epinephrine) binds outside', 'It is the second hormone released by the adrenal gland', 'It binds to the receptor after epinephrine leaves', 'It carries the signal from the cell back to the brain'], e: 'Epinephrine never enters the cell. cAMP relays its message through the cytoplasm.' },
      { q: 'One epinephrine molecule leads to millions of glucose molecules. What is this called?', a: ['Signal amplification', 'Negative feedback', 'Signal reception', 'Osmosis'], e: 'Each enzyme in the cascade activates many copies of the next one, so the signal grows at every step.' },
      { q: 'How does the cell switch this signal off when epinephrine is gone?', a: ['The G protein turns GTP into GDP, and phosphodiesterase breaks down cAMP', 'The receptor is digested by the lysosome every time', 'The cell pumps glucose back in', 'Epinephrine changes into cAMP'], e: 'G proteins inactivate themselves by hydrolyzing GTP, and phosphodiesterase removes cAMP, so the response stops quickly.' }] },

  { id: 'rtk', kind: 'path', icon: '🌱', title: 'Grow Signal', tag: 'Receptor tyrosine kinase', cell: 'Skin cell',
    brief: 'You scraped your knee. Nearby cells release epidermal growth factor (EGF) to tell skin cells to divide and close the wound. This receptor has two halves, and each half needs its own ligand.',
    hint: 'EGF is the growth factor. Drop one EGF into each half of the receptor whose sites fit it.',
    target: 'egf', ligands: ['egf', 'egf', 'epi', 'cort'],
    receptors: [
      { kind: 'gpcr', x: 180, fits: ['tri'], name: 'β-adrenergic receptor (GPCR)' },
      { kind: 'rtk', x: 510, fits: ['sq', 'sq'], name: 'EGF receptor (receptor tyrosine kinase)', target: true },
      { kind: 'gpcr', x: 830, fits: ['star'], name: 'Glucagon receptor (GPCR)' }],
    steps: [
      { t: 'The two receptor halves pair up (dimerize)', s: 'Dimerization', why: 'With a ligand bound to each half, the two halves come together to form a dimer.' },
      { t: 'Tyrosines on the tails are phosphorylated', s: 'Autophosphorylation', why: 'Each half adds phosphate groups (from ATP) to tyrosines on the other half’s tail.' },
      { t: 'Relay proteins dock, and Ras swaps GDP for GTP', s: 'Ras (GTP)', why: 'Relay proteins bind the phosphorylated tyrosines and switch on Ras, a small G protein.' },
      { t: 'Raf kinase is activated', s: 'Raf', why: 'Active Ras switches on Raf, the first kinase of the MAP kinase cascade.' },
      { t: 'MEK is phosphorylated', s: 'MEK', why: 'Raf phosphorylates MEK, the next kinase in the cascade.' },
      { t: 'MAP kinase (ERK) moves into the nucleus', s: 'MAP kinase → nucleus', why: 'MEK phosphorylates MAP kinase, which moves into the nucleus and activates transcription factors.' }],
    decoys: [
      { t: 'ATP is converted to cAMP', why: 'cAMP is the second messenger in GPCR pathways like epinephrine’s, not in this one.' },
      { t: 'The channel opens and Na⁺ rushes in', why: 'That’s a ligand-gated ion channel. A receptor tyrosine kinase is an enzyme, not a channel.' }],
    response: { q: 'What does the skin cell do now?', fx: 'divide', banner: 'Cell-division genes switched on',
      a: ['It turns on genes for cell division and divides', 'It releases glucose into the blood', 'It contracts', 'Nothing: the signal stays at the membrane'],
      why: ['Transcription factors switch on genes that drive the cell cycle, and the cell divides to close the wound.', 'Releasing glucose is the liver’s response to epinephrine or glucagon.', 'Contraction is a muscle-cell response.', 'The MAP kinase cascade carries the signal all the way into the nucleus.'] },
    checks: [
      { q: 'What does a kinase do?', a: ['It adds phosphate groups to other molecules', 'It removes phosphate groups from proteins', 'It turns ATP into cAMP', 'It lets ions cross the membrane'], e: 'Kinases transfer a phosphate from ATP. Phosphatases remove phosphates to switch the signal off.' },
      { q: 'A mutation keeps Ras stuck in its GTP-bound (on) form. What happens?', a: ['The cell keeps dividing even without growth factor', 'The cell can never divide again', 'The receptor can’t bind EGF', 'Nothing changes, because EGF is still needed'], e: 'Ras stuck “on” sends a division signal nonstop. Ras mutations are found in many cancers.' },
      { q: 'Why can one receptor tyrosine kinase trigger several responses at once?', a: ['Each phosphorylated tyrosine can dock a different relay protein', 'It binds a different ligand on each half', 'It moves into the nucleus', 'It makes several kinds of cAMP'], e: 'Different relay proteins dock at different phosphotyrosines and start different pathways at the same time.' }] },

  { id: 'chan', kind: 'path', icon: '💪', title: 'Nerve to Muscle', tag: 'Ligand-gated ion channel', cell: 'Muscle cell',
    brief: 'You decide to lift your arm. A motor neuron releases a neurotransmitter into the gap next to this muscle cell. Deliver it so the muscle responds within milliseconds.',
    hint: 'The neurotransmitter at nerve–muscle junctions is acetylcholine.',
    target: 'ach', ligands: ['ach', 'epi', 'ins', 'egf'],
    receptors: [
      { kind: 'gpcr', x: 190, fits: ['tri'], name: 'β-adrenergic receptor (GPCR)' },
      { kind: 'channel', x: 500, fits: ['circ'], name: 'Acetylcholine receptor (ligand-gated ion channel)', target: true },
      { kind: 'rtk', x: 810, fits: ['dia', 'dia'], name: 'Insulin receptor (receptor tyrosine kinase)' }],
    steps: [
      { t: 'The channel changes shape and opens', s: 'Channel opens', why: 'Binding changes the receptor’s shape, opening a pore through the membrane.' },
      { t: 'Na⁺ ions rush into the cell', s: 'Na⁺ flows in', why: 'Sodium ions flow in down their concentration gradient. They’re charged, so they can only cross through the channel.' },
      { t: 'The membrane depolarizes', s: 'Depolarization', why: 'Positive charge entering the cell makes the inside less negative, starting an electrical signal along the muscle fiber.' },
      { t: 'Ca²⁺ is released inside the muscle cell', s: 'Ca²⁺ released', why: 'The electrical signal triggers the release of stored calcium ions inside the cell.' }],
    decoys: [
      { t: 'The G protein swaps GDP for GTP', why: 'G proteins belong to GPCR pathways. This receptor is a channel: binding opens it directly.' },
      { t: 'The hormone–receptor complex enters the nucleus', why: 'That’s an intracellular-receptor pathway. Acetylcholine never enters the cell.' }],

  if (sh === 'tri') return P(poly(3).map(([x, y]) => [x * 1.12, y * 1.12 + s * .18]));

function newRun(def) {

/* multiple-choice block; calls done(correct) once answered */
function mcq(box, q, done, label) {

  let lock = false;

function runChecks(list, r, after) {

}
function finishMission(r, extra) {

    <div class="row" style="justify-content:center">${nx ? `<button class="btn primary" id="nxB">Next: ${esc(nx.title)} →</button>` : `<button class="btn primary" id="repB">📋 See my report</button>`}<button class="btn" id="againB">Play again</button><button class="btn" id="allB">All missions</button></div></div>`;

function startMission(def) {

/* =====================================================================
   DRAGGABLE LIGANDS (pathway missions and Locked Out)
   ===================================================================== */
function setupLigands(r, keys, onDrop) {
  const homes = [[120, 92], [330, 126], [640, 88], [880, 122], [470, 64], [760, 60]];
  const order = shuffle(keys.map((k, i) => ({ k, i })));
  r.ligs = order.map((o, j) => ({ key: o.k, hx: homes[j][0], hy: homes[j][1], x: homes[j][0], y: homes[j][1], ph: Math.random() * 6, drag: false, bound: null, ret: 0 }));
  const L = $('#ligL');
  L.innerHTML = r.ligs.map((l, j) => `<g class="lig" data-l="${j}" tabindex="0" role="button" aria-label="${esc(LIG[l.key].name)}">${ligGlyph(l.key)}</g>`).join('');
  r.sel = null;
  const els = $$('.lig', L);
  const svg = $('#svg'); let dragging = null, start = null, moved = false;
  els.forEach((el, j) => {
    el.addEventListener('pointerdown', e => { const l = r.ligs[j]; if (l.bound || r.lockLig) return; e.preventDefault(); dragging = j; moved = false; start = svgPoint(e); l.drag = true; el.classList.add('dragging'); svg.setPointerCapture(e.pointerId); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(j); } });
  });
  const select = j => { r.sel = r.sel === j ? null : j; els.forEach((e, k) => e.classList.toggle('sel', k === r.sel)); if (r.sel != null) say(`Selected <b>${esc(LIG[r.ligs[j].key].name)}</b>. Now click the binding site to drop it there.`, 'info'); };
  r.deselect = () => { r.sel = null; els.forEach(e => e.classList.remove('sel')); };
  svg.onpointermove = e => { if (dragging == null) return; const p = svgPoint(e), l = r.ligs[dragging]; if (Math.hypot(p.x - start.x, p.y - start.y) > 6) moved = true; l.x = p.x; l.y = p.y; };
  svg.onpointerup = e => {
    const p = svgPoint(e);
    if (dragging != null) { const j = dragging, l = r.ligs[j]; dragging = null; l.drag = false; els[j].classList.remove('dragging');
      if (!moved) { l.x = l.hx; l.y = l.hy; select(j); return; }
      r.deselect(); if (onDrop(l, p) !== true) l.ret = 1; return; }
    if (r.sel != null && !r.ligs[r.sel].bound) { const l = r.ligs[r.sel]; r.deselect(); if (onDrop(l, p, true) === null) say('Click right on a binding site (the dashed shapes) to drop the molecule there.', 'info'); }
  };
  LOOP.fns.push((dt, t) => { r.ligs.forEach((l, j) => {
    if (l.bound) { const pk = pockets(l.bound.r)[l.bound.k]; l.x += (pk[0] - l.x) * Math.min(1, dt * 12); l.y += (pk[1] - l.y) * Math.min(1, dt * 12); }
    else if (!l.drag) { const tx = l.hx + Math.sin(t * .7 + l.ph) * 14, ty = l.hy + Math.sin(t * .95 + l.ph * 1.3) * 9; const k = l.ret ? Math.min(1, dt * 6) : 1; l.x += (tx - l.x) * k; l.y += (ty - l.y) * k; if (l.ret && Math.hypot(tx - l.x, ty - l.y) < 2) l.ret = 0; }
    els[j].setAttribute('transform', `translate(${l.x.toFixed(1)} ${l.y.toFixed(1)})${l.bound ? ' scale(.95)' : ''}`);
    const tx = els[j].querySelector('text'); if (tx) tx.style.display = l.bound ? 'none' : '';
  }); });
}
/* which pocket (receptor, index) is near point p */
function pocketAt(r, p, radius = 44) {
  let best = null;
  r.recs.forEach(rc => pockets(rc).forEach((pk, k) => { const d = Math.hypot(pk[0] - p.x, pk[1] - p.y); if (d < (rc.kind === 'intra' ? 62 : radius) && (!best || d < best.d)) best = { rc, k, d }; }));
  return best;
}
function drawRecs(r) { $('#recL').innerHTML = r.recs.map(receptorSVG).join(''); }

/* =====================================================================
   PATHWAY MISSIONS: bind → relay → respond → check
   ===================================================================== */
function playPath(def) {
  const r = newRun(def);
  playLayout(def, ['1 · Bind', '2 · Relay', '3 · Respond', '4 · Check']);
  $('#bg').innerHTML = backgroundSVG(def.cell, def.id === 'intra');
  r.recs = def.receptors.map((x, i) => Object.assign({ i, filled: x.fits.map(() => false), active: false }, x));
  drawRecs(r);
  r.phase = 'bind'; setPhase(0);
  $('#panel').innerHTML = `<p class="brief">${def.brief}</p><div class="instr"><b>Step 1 · Reception.</b> Drag the right signal molecule into the binding site it fits. (Or click a molecule, then click a binding site.)</div>`;
  say('Signal molecules are floating outside the cell. Which one is your signal, and which receptor fits it?', 'info');
  setupLigands(r, def.ligands, (l, p) => {
    if (r.phase !== 'bind') return null;
    const hit = pocketAt(r, p); const L = LIG[l.key];
    if (!hit) { if (p.y > MEM_B && !L.lipid) { r.oops(`${L.name} is polar, so it can’t cross the phospholipid bilayer. It has to bind a receptor on the outside of the cell.`, 'Which signals can cross the membrane'); return false; } return null; }
    const { rc, k } = hit;
    if (rc.filled[k]) return null;
    if (rc.kind === 'intra' && !L.lipid) { r.oops(`${L.name} is polar, so it can’t diffuse through the membrane to reach a receptor inside the cell.`, 'Which signals can cross the membrane'); return false; }
    if (L.lipid && rc.kind !== 'intra') { r.oops(`${L.name} doesn’t fit there. It’s a steroid: small and nonpolar, so it can pass straight through the membrane. Look for its receptor inside the cell.`, 'Intracellular receptors'); return false; }
    if (rc.fits[k] !== L.shape) { r.oops(`The shape doesn’t fit. ${L.name}’s shape isn’t complementary to that binding site, so it can’t bind. Receptors are specific.`, 'Receptor–ligand specificity'); return false; }
    if (l.key !== def.target) { r.oops(`${L.name} fits that receptor, but it isn’t the signal for this mission. Reread the mission.`, 'Matching signals to their job'); return false; }
    l.bound = { r: rc, k }; rc.filled[k] = true;
    if (rc.filled.every(Boolean)) { rc.active = true; rc.label = rc.name; drawRecs(r); say(`✔ ${L.name} bound! The receptor changed shape: it’s now <b>active</b>.<br><span class="small">This is the <b>${esc(rc.name)}</b>.</span>`, 'good'); setTimeout(() => relay(r), 1500); }
    else { drawRecs(r); say(`✔ One ${L.name} bound. This receptor has two halves, and each one needs its own ligand.`, 'good'); }
    return true;
  });
}
function relay(r) {
  if (G.run !== r) return;
  const def = r.def; r.phase = 'relay'; setPhase(1); r.placed = 0;
  const target = r.recs.find(x => x.target), from = target.kind === 'intra' ? [target.x, 390] : target.kind === 'rtk' ? [target.x, 392] : [target.x, 346];
  const draw = () => $('#nodeL').innerHTML = nodesSVG(def.steps.map((s, i) => ({ s: s.s, amp: s.amp, st: i < r.placed ? 'on' : 'empty', fresh: i === r.placed - 1 })), from);
  draw();
  const cards = shuffle(def.steps.map((s, i) => ({ t: s.t, i })).concat(def.decoys.map(d => ({ t: d.t, why: d.why, i: -1 }))));
  const paint = () => {
    $('#panel').innerHTML = `<div class="instr"><b>Step 2 · Transduction.</b> Relay the signal. Click the steps in the order they happen inside the cell. Careful: some steps belong to other pathways.</div>
      <div class="cards" style="margin-top:10px">${cards.map((c, k) => `<button class="card-step ${c.used ? 'used' : ''}" data-c="${k}" ${c.used ? 'disabled' : ''}><span class="k">${c.used ? '✓' : '•'}</span><span>${c.t}</span></button>`).join('')}</div>
      ${r.placed && def.steps[r.placed - 1].amp ? `<p class="small" style="margin:10px 0 0">Amplification so far: <span class="amp">×${def.steps[r.placed - 1].amp}</span> molecules per epinephrine</p>` : ''}`;
    $$('.card-step').forEach(b => b.onclick = () => pickCard(+b.dataset.c, b));
  };
  const pickCard = (k, b) => {
    const c = cards[k];
    if (c.i === r.placed) { c.used = true; r.placed++;
      if (def.id === 'rtk' && c.i === 1) { target.phos = true; drawRecs(r); }
      if (def.id === 'intra' && c.i === 0) { target.freed = true; drawRecs(r); }
      draw(); say(`✔ ${def.steps[c.i].why}`, 'good');
      if (r.placed === def.steps.length) { paint(); $$('.card-step').forEach(x => x.disabled = true); setTimeout(() => respond(r), 1300); return; }
      paint(); return; }
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    if (c.i < 0) r.oops(c.why, 'Which steps belong to which pathway');
    else r.oops(`Not yet. ${r.placed === 0 ? 'What happens first, right after the receptor is activated?' : `What happens right after “${def.steps[r.placed - 1].t.toLowerCase()}”?`}`, 'Order of the transduction steps');
  };
  r.hintText = () => `Think about what each protein needs before it can switch on. The first step is something the activated receptor does directly. ${def.id === 'gpcr' ? 'In GPCR pathways, the G protein comes before the second messenger.' : def.id === 'rtk' ? 'RTKs must pair up before they can phosphorylate each other.' : def.id === 'chan' ? 'Ions can only flow once the channel is open.' : 'The receptor must be free of its chaperone before it can move to the nucleus.'}`;
  paint(); say('The signal is inside the cell. Relay it!', 'info');
}
function respond(r) {
  if (G.run !== r) return;
  const def = r.def, R = def.response; r.phase = 'respond'; setPhase(2); r.hintText = null;
  const order = shuffle(R.a.map((t, i) => ({ t, i })));
  $('#panel').innerHTML = `<div class="instr"><b>Step 3 · Response.</b> The signal reached the end of the pathway.</div><p class="q" style="margin-top:12px">${R.q}</p><div class="opts">${order.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  say('What will the cell do?', 'info');
  $$('.opt').forEach(b => b.onclick = () => {
    const o = order[+b.dataset.k];

}
function responseFx(kind, banner) {

  if (kind === 'divide' || kind === 'protein') for (let i = 0; i < 14; i++) parts.push({ x: 120 + Math.random() * 760, y: 380 + Math.random() * 200, v: 0, s: kind === 'divide' ? 'dna' : 'prot', ph: Math.random() * 6 });

  const els = $$('g', fx).filter(g => g.parentNode === fx), r = G.run;

/* =====================================================================
   CHALLENGE · LOCKED OUT (mutated receptor)
   ===================================================================== */
function playMut(def) {
  const r = newRun(def);
  playLayout(def, ['1 · Test', '2 · Explain']); setPhase(0);
  $('#bg').innerHTML = backgroundSVG(def.cell, false);
  r.recs = [{ i: 0, kind: 'gpcr', x: 300, fits: ['tri'], filled: [false], label: 'A · healthy gene' }, { i: 1, kind: 'gpcr', x: 700, fits: ['tri'], filled: [false], mutant: true, label: 'B · patient’s gene' }];
  drawRecs(r); r.tested = {};
  const tasks = () => `<ul class="tasks"><li class="${r.tested[0] ? 'done' : ''}"><span class="ck">${r.tested[0] ? '✓' : ''}</span>Drop epinephrine on receptor A (healthy)</li><li class="${r.tested[1] ? 'done' : ''}"><span class="ck">${r.tested[1] ? '✓' : ''}</span>Drop epinephrine on receptor B (patient)</li></ul>`;
  const paint = () => { $('#panel').innerHTML = `<p class="brief">${def.brief}</p>${tasks()}`; };
  paint(); say('Drag an epinephrine molecule onto each receptor’s binding site.', 'info');
  setupLigands(r, ['epi', 'epi', 'ins'], (l, p) => {
    if (r.lockLig) return null; const hit = pocketAt(r, p); if (!hit) return null; const { rc } = hit;
    if (l.key !== 'epi') { r.oops('This experiment tests epinephrine. Insulin binds a different receptor.', 'Receptor–ligand specificity'); return false; }
    if (rc.filled[0]) return null;
    if (rc.mutant) { r.tested[1] = true; paint(); say('Receptor B: <b>no binding.</b> Epinephrine bumps against the binding site and drifts away. Look closely at site B: one part of it has a different shape.', 'bad'); check(); return false; }
    l.bound = { r: rc, k: 0 }; rc.filled[0] = true; rc.active = true; drawRecs(r); r.tested[0] = true; paint(); say('Receptor A: ✔ epinephrine binds, and the receptor changes shape and switches on its G protein.', 'good'); check(); return true;
  });
  function check() { if (r.tested[0] && r.tested[1] && !r.asked) { r.asked = true; setTimeout(() => { if (G.run !== r) return; setPhase(1); say(''); r.lockLig = true; runChecks(def.checks, r, () => { setPhase(2); finishMission(r, 'Mutations that change a binding site’s shape stop the ligand from binding, at any concentration.'); }); }, 1600); } }
}

/* =====================================================================
   CHALLENGES · BLOCKED! and DOSE MATTERS (receptor-binding simulation)
   24 receptors; each free receptor binds epinephrine with probability k·[L]·dt
   and propranolol with k·[A]·dt; bound receptors let go with k·dt (so Kd = 5 nM).
   ===================================================================== */
const KD = 5;
function playSim(def, mode) {
  const r = newRun(def);
  playLayout(def, ['1 · Experiment', '2 · Explain']); setPhase(0);
  $('#bg').innerHTML = backgroundSVG(def.cell, false);
  const N = 24; r.recs = Array.from({ length: N }, (_, i) => ({ i, kind: 'mini', x: 40 + i * (920 / (N - 1)), occ: null }));
  const S = r.sim = { L: mode === 'anta' ? 5 : 0.5, A: 4 * KD, block: mode === 'anta', fE: 0, fA: 0, pts: [], tasks: [] };
  if (mode === 'anta') S.tasks = [{ t: 'With the β-blocker ON, get <b>at least 60%</b> of receptors activated by epinephrine. Hold it for 3 seconds.', ok: () => S.block && S.fE >= .6, hold: 0 }];
  else S.tasks = [
    { t: 'Find a concentration that binds <b>about half</b> the receptors (40–60%). Hold it for 3 seconds.', ok: () => S.fE >= .4 && S.fE <= .6, hold: 0 },
    { t: 'Push binding to <b>90% or more</b>. Hold it for 3 seconds.', ok: () => S.fE >= .9, hold: 0 },
    { t: 'Record <b>5 points</b> on the graph, including one below 2 nM and one above 40 nM.', ok: () => S.pts.length >= 5 && Math.min(...S.pts.map(p => p.L)) < 2 && Math.max(...S.pts.map(p => p.L)) > 40, inst: true }];
  const toL = v => 0.5 * Math.pow(400, v / 100), toV = L => Math.round(100 * Math.log(L / 0.5) / Math.log(400));
  $('#panel').innerHTML = `<p class="brief">${def.brief}</p>
    <div class="ctl"><label for="conc">Epinephrine concentration <b id="cv"></b></label><input type="range" id="conc" min="0" max="100" value="${toV(S.L)}"></div>
    ${mode === 'anta' ? `<label class="toggle" style="margin-top:10px"><input type="checkbox" id="blk" checked> β-blocker (propranolol, 20 nM)</label>` : ''}
    <div class="meters" style="margin-top:12px">
      <div class="meter"><span>Activated</span><span class="bar"><i id="mE" style="background:#f28c38"></i></span><span id="vE">0%</span></div>
      ${mode === 'anta' ? '<div class="meter"><span>Blocked</span><span class="bar"><i id="mA" style="background:#8b95a7"></i></span><span id="vA">0%</span></div>' : ''}
      <div class="meter"><span>Empty</span><span class="bar"><i id="m0" style="background:#c7d6dc"></i></span><span id="v0">0%</span></div></div>
    ${mode === 'dose' ? `<div style="margin-top:12px"><svg id="plot" viewBox="0 0 340 190" style="width:100%;background:#f7fafb;border:1px solid var(--line);border-radius:10px"></svg><button class="btn sm" id="recB" style="margin-top:8px">📍 Record point</button></div>` : ''}
    <ul class="tasks" id="tasks" style="margin-top:14px"></ul>`;
  const paintTasks = () => { $('#tasks').innerHTML = S.tasks.map(t => `<li class="${t.done ? 'done' : ''}"><span class="ck">${t.done ? '✓' : ''}</span><span>${t.t}${!t.inst && !t.done ? `<span class="hold"><i style="width:${Math.min(100, t.hold / 3 * 100)}%"></i></span>` : ''}</span></li>`).join(''); };
  const setL = () => { S.L = toL(+$('#conc').value); $('#cv').textContent = (S.L < 10 ? S.L.toFixed(1) : Math.round(S.L)) + ' nM'; };
  $('#conc').oninput = setL; setL();
  if ($('#blk')) $('#blk').onchange = e => { S.block = e.target.checked; say(S.block ? 'β-blocker on: propranolol is competing for the binding sites.' : 'β-blocker off. Compare the activation level, then turn it back on to finish the task.', 'info'); };
  say(mode === 'anta' ? 'Gray molecules are propranolol. They fit the binding site but don’t activate the receptor. Drag the slider to change the epinephrine concentration.' : 'Drag the slider. Each receptor flickers between bound and empty as molecules bind and let go.', 'info');
  /* molecules drifting outside */
  const P = []; const mk = key => ({ key, x: Math.random() * 1000, y: 40 + Math.random() * 150, vx: (Math.random() - .5) * 40, vy: (Math.random() - .5) * 30 });
  const ligL = $('#ligL');
  const plot = () => { const sv = $('#plot'); if (!sv) return; const X = L => 30 + (Math.log10(L) - Math.log10(.5)) / (Math.log10(200) - Math.log10(.5)) * 296, Y = f => 166 - f * 148;
    let s = `<line x1="30" y1="166" x2="330" y2="166" stroke="#9fb2ba"/><line x1="30" y1="18" x2="30" y2="166" stroke="#9fb2ba"/>`;
    [0, .5, 1].forEach(f => s += `<text x="24" y="${Y(f) + 4}" text-anchor="end" style="font:700 9px var(--mono);fill:#7f99a3">${f * 100}%</text><line x1="30" x2="330" y1="${Y(f)}" y2="${Y(f)}" stroke="#e3ecef"/>`);
    [1, 5, 20, 100].forEach(L => s += `<text x="${X(L)}" y="180" text-anchor="middle" style="font:700 9px var(--mono);fill:#7f99a3">${L}</text>`);
    s += `<text x="330" y="160" text-anchor="end" style="font:700 9px var(--mono);fill:#7f99a3">nM →</text><text x="36" y="14" style="font:700 9px var(--mono);fill:#7f99a3">% bound</text>`;
    if (S.tasks[2] && S.tasks[2].done) { let d = ''; for (let i = 0; i <= 60; i++) { const L = .5 * Math.pow(400, i / 60); d += (i ? 'L' : 'M') + X(L).toFixed(1) + ',' + Y(L / (L + KD)).toFixed(1); } s += `<path d="${d}" fill="none" stroke="#2f8f9d" stroke-width="2" stroke-dasharray="5 4"/><line x1="${X(KD)}" x2="${X(KD)}" y1="${Y(.5)}" y2="166" stroke="#e8772e" stroke-dasharray="3 3"/><text x="${X(KD) + 4}" y="${Y(.5) - 4}" style="font:700 9px var(--mono);fill:#e8772e">half bound</text>`; }
    S.pts.forEach(p => s += `<circle cx="${X(p.L)}" cy="${Y(p.f)}" r="4.5" fill="#f28c38" stroke="#a8521a"/>`);
    s += `<circle cx="${X(S.L)}" cy="${Y(S.fE)}" r="6" fill="none" stroke="#2f8f9d" stroke-width="2"/>`;
    sv.innerHTML = s; };
  if ($('#recB')) $('#recB').onclick = () => { if (S.pts.some(p => Math.abs(Math.log(p.L / S.L)) < .15)) { say('You already have a point near that concentration. Try a different one.', 'info'); return; } S.pts.push({ L: S.L, f: S.fE }); S.pts.sort((a, b) => a.L - b.L); say(`Recorded: ${S.L < 10 ? S.L.toFixed(1) : Math.round(S.L)} nM → ${Math.round(S.fE * 100)}% bound.`, 'info'); };
  let rd = 0, finished = false;
  const k = 1.4;
  LOOP.fns.push((dt) => {
    if (G.run !== r) return;
    let nE = 0, nA = 0;
    r.recs.forEach(rc => {
      if (!rc.occ) { const u = Math.random(), pE = 1 - Math.exp(-k * (S.L / KD) * dt), pA = S.block ? 1 - Math.exp(-k * (S.A / KD) * dt) : 0;
        if (u < pE) rc.occ = 'epi'; else if (u < pE + pA) rc.occ = 'prop'; }
      else if (Math.random() < 1 - Math.exp(-k * dt)) rc.occ = null;
      if (rc.occ === 'epi') nE++; if (rc.occ === 'prop') nA++;
    });
    const a = 1 - Math.exp(-dt / 1.2); S.fE += (nE / N - S.fE) * a; S.fA += (nA / N - S.fA) * a;
    /* molecules: about 3 per nM of epinephrine on screen (capped) */
    const wantE = Math.min(70, Math.round(S.L * 1.4 + 1)), wantA = S.block ? 18 : 0;
    const cnt = key => P.filter(p => p.key === key).length;
    while (cnt('epi') < wantE) P.push(mk('epi')); while (cnt('prop') < wantA) P.push(mk('prop'));
    for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; if ((p.key === 'epi' && cnt('epi') > wantE) || (p.key === 'prop' && cnt('prop') > wantA)) { P.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; if (p.x < 0) p.x += 1000; if (p.x > 1000) p.x -= 1000; if (p.y < 34 || p.y > 196) p.vy *= -1; p.vx += (Math.random() - .5) * 30 * dt; p.vy += (Math.random() - .5) * 30 * dt; }
    rd += dt; if (rd < .08) return; const el = rd; rd = 0;
    drawRecs(r);
    ligL.innerHTML = P.map(p => shapeEl('tri', 7, `transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)})" fill="${LIG[p.key].color}" stroke="${LIG[p.key].dark}" stroke-width="1.2"`)).join('');
    { const w = Math.round(S.fE * 600), lvl = S.fE >= .6 ? 'strong' : S.fE >= .3 ? 'medium' : 'weak', beat = 1 + .12 * Math.max(0, Math.sin(LOOP.t * (2 + S.fE * 9)));
      $('#topL').innerHTML = `<g transform="translate(200 430)"><text x="300" y="-34" text-anchor="middle" style="font:700 15px var(--sans);fill:#17414b">Signal inside the cell (cAMP → ${mode === 'anta' ? 'faster heartbeat' : 'response'}): ${lvl}</text>
        <rect width="600" height="26" rx="13" fill="#ffffff" stroke="#c7d6dc"/><rect width="${w}" height="26" rx="13" fill="#f28c38"/>
        <g transform="translate(300 86) scale(${beat.toFixed(3)})"><path d="M0,22 C-34,-2 -26,-30 0,-14 C26,-30 34,-2 0,22Z" fill="#e4587f" stroke="#9c2a4c" stroke-width="2"/></g></g>`; }
    if (!$('#mE')) return; /* the panel has moved on to the questions */
    const fE = Math.round(S.fE * 100), fA = Math.round(S.fA * 100);
    $('#mE').style.width = fE + '%'; $('#vE').textContent = fE + '%';
    if ($('#mA')) { $('#mA').style.width = fA + '%'; $('#vA').textContent = fA + '%'; }
    $('#m0').style.width = Math.max(0, 100 - fE - fA) + '%'; $('#v0').textContent = Math.max(0, 100 - fE - fA) + '%';
    S.tasks.forEach(t => { if (t.done) return; if (t.inst) { if (t.ok()) { t.done = true; toast('Curve revealed'); } return; } t.hold = t.ok() ? t.hold + el : 0; if (t.hold >= 3) { t.done = true; toast('✔ Task complete'); } });
    paintTasks(); plot();
    if (!finished && S.tasks.every(t => t.done)) { finished = true;
      say(mode === 'anta' ? `✔ ${fE}% of receptors are activated, even with the β-blocker. Epinephrine out-competed propranolol for the binding sites.` : '✔ See the curve? Binding rises steeply at low concentrations, then levels off as the receptors fill up.', 'good');
      setTimeout(() => { if (G.run !== r) return; setPhase(1); say(''); runChecks(def.checks, r, () => { setPhase(2); finishMission(r, mode === 'anta' ? 'A competitive antagonist can be overcome by raising the ligand concentration.' : 'Ligand binding is a matter of probability, and the response saturates once the receptors are full.'); }); }, 2400); }
  });
  r.hintText = () => mode === 'anta' ? 'Without the blocker, 5 nM epinephrine binds about half the receptors. With 20 nM propranolol competing, you need several times more epinephrine. Try 30–60 nM.' : 'Half the receptors are bound near 5 nM. For 90%, try 50 nM or more. For the graph, record points like 1, 3, 5, 15 and 60 nM.';
}

/* =====================================================================
   CHALLENGE · BROKEN LINK (defective signaling proteins)
   Round 1: a protein is broken, so the epinephrine signal stops (loss of function).
   Round 2: Ras or Raf is stuck ON, so the cell divides with no growth factor (gain of function).
   ===================================================================== */
function playBroken(def) {
  const r = newRun(def);
  playLayout(def, ['1 · Round 1', '2 · Round 2', '3 · Explain']); setPhase(0);
  const R1 = ['G protein', 'Adenylyl cyclase', 'cAMP', 'Protein kinase A', 'Phosphorylase kinase', 'Glycogen phosphorylase'];
  const R2 = ['Relay protein', 'Ras', 'Raf', 'MEK', 'MAP kinase', 'Division genes ON'];
  const bad1 = [0, 1, 3, 4][Math.floor(Math.random() * 4)], bad2 = 1 + Math.floor(Math.random() * 2);
  let round = 1, st = [], ran = false, solved = false;
  const scene = () => {
    $('#bg').innerHTML = backgroundSVG(round === 1 ? 'Patient 1 · liver cell' : 'Patient 2 · skin cell', false);
    r.recs = [round === 1 ? { i: 0, kind: 'gpcr', x: 110, fits: ['tri'], filled: [false] } : { i: 0, kind: 'rtk', x: 110, fits: ['sq', 'sq'], filled: [false, false] }];
    drawRecs(r); $('#ligL').innerHTML = ''; $('#topL').innerHTML = '';
    st = (round === 1 ? R1 : R2).map(s => ({ s, st: 'off' })); draw(); };
  const draw = () => { $('#nodeL').innerHTML = nodesSVG(st.map(n => Object.assign({ click: ran && !solved }, n)), [110, round === 1 ? 346 : 392]);
    $$('#nodeL .node').forEach(g => g.onclick = () => clickNode(+g.dataset.node)); };
  const panel = () => {
    $('#panel').innerHTML = round === 1
      ? `<p class="brief"><b>Patient 1:</b> during exercise, this patient’s liver doesn’t release glucose. Their epinephrine and receptors are normal, so a protein further down the pathway must be broken.</p><div class="instr">1. Send the epinephrine signal and watch where it goes.<br>2. Click the <b>defective protein</b>.</div><div class="row" style="margin-top:10px"><button class="btn primary" id="runB" ${ran ? 'disabled' : ''}>▶ Send epinephrine signal</button></div>`
      : `<p class="brief"><b>Patient 2:</b> these skin cells keep dividing even when there is <b>no growth factor</b> at all. That’s how many cancers start.</p><div class="instr">1. Run the cell with no growth factor and watch which proteins are active.<br>2. Click the protein that is <b>stuck ON</b>.</div><div class="row" style="margin-top:10px"><button class="btn primary" id="runB" ${ran ? 'disabled' : ''}>▶ Run with NO growth factor</button></div>`;
    $('#runB').onclick = run; };
  const run = () => {
    ran = true; $('#runB').disabled = true;
    if (round === 1) {
      $('#ligL').innerHTML = `<g id="flyL">${ligGlyph('epi', false)}</g>`;
      const fl = $('#flyL'); let y = 60; const f = dt => { if (G.run !== r) return; y = Math.min(200, y + 260 * dt); fl.setAttribute('transform', `translate(110 ${y})`); if (y >= 200) { LOOP.fns = LOOP.fns.filter(x => x !== f); r.recs[0].active = true; r.recs[0].noG = bad1 === 0; drawRecs(r); step(0); } }; LOOP.fns.push(f);
      const step = i => { if (G.run !== r) return; if (i === bad1) { st[i].st = 'dead'; draw(); say('The signal stopped. Which protein failed to pass it on? Click it.', 'info'); return; } st[i].st = 'on'; st[i].fresh = true; draw(); setTimeout(() => step(i + 1), 520); };
    } else {
      say('No growth factor is present, so the receptor stays off…', 'info');
      setTimeout(() => { if (G.run !== r) return; for (let i = bad2; i < st.length; i++) setTimeout(() => { if (G.run !== r) return; st[i].st = i === bad2 ? 'stuck' : 'on'; st[i].fresh = true; draw(); if (i === st.length - 1) say('…but part of the pathway is active anyway, and the division genes are switched on. Click the protein that is stuck ON.', 'info'); }, (i - bad2) * 520); }, 900);
    }
    draw();
  };
  const clickNode = i => {
    if (!ran || solved) return;
    if (round === 1) {
      if (i === bad1) { solved = true; st[i].s = st[i].s + ' ✕'; draw(); say(`✔ Found it: <b>${R1[bad1]}</b> is defective. Every protein before it lit up, but the signal never got past it.`, 'good'); setTimeout(() => after1(), 1400); return; }
      if (R1[i] === 'cAMP') { r.oops('cAMP is a small second-messenger molecule, not a protein. Look at the proteins.', 'Finding a defective protein'); return; }
      if (st[i].st === 'on') r.oops('That protein lit up, so it received the signal and passed it on. It’s working.', 'Finding a defective protein');
      else r.oops('That protein never received the signal, so you can’t tell whether it works. Find the first link that failed.', 'Finding a defective protein');
    } else {
      if (i === bad2) { solved = true; draw(); say(`✔ Found it: <b>${R2[bad2]}</b> is stuck ON. It’s active with no signal coming from above, and it keeps switching on everything after it.`, 'good'); setTimeout(() => after2(), 1400); return; }
      if (st[i].st === 'off') r.oops('That protein is off, which is normal with no growth factor. The problem is where activity starts.', 'Gain-of-function mutations');
      else r.oops('It’s active, but only because the protein before it is switching it on. Find where the activity starts.', 'Gain-of-function mutations');
    }
  };
  const after1 = () => { if (G.run !== r) return; const upstream = bad1 < 2;
    const q = { q: `Researchers add a form of cAMP that can cross the membrane into Patient 1’s cells. Will the cells break down glycogen?`,
      a: upstream ? [`Yes. The added cAMP skips the broken ${R1[bad1].toLowerCase()} and activates protein kinase A`, `No. The broken ${R1[bad1].toLowerCase()} still blocks the signal`, 'Yes, because cAMP repairs the broken protein', 'No, because the receptor is broken']
        : [`No. ${R1[bad1]} works after cAMP, so the signal still stops there`, 'Yes. Extra cAMP always restores the response', 'Yes, because cAMP repairs the broken protein', 'No, because the receptor is broken'],
      e: upstream ? `The defect is before cAMP in the pathway, so supplying cAMP directly bypasses it.` : `The defect is after cAMP, so adding cAMP can’t get the signal past it.` };
    runChecks([q], r, () => { round = 2; ran = false; solved = false; setPhase(1); say(''); scene(); panel(); }); };
  const after2 = () => { if (G.run !== r) return; setPhase(2);
    const q = { q: 'Which drug would most likely stop Patient 2’s cells from dividing?', a: [`A drug that blocks MEK, a kinase after ${R2[bad2]}`, 'A drug that blocks the growth-factor receptor', 'Extra growth factor', 'A drug that blocks cAMP'],
      e: `The faulty ${R2[bad2]} switches itself on, so blocking the receptor above it does nothing. Blocking a kinase below it can stop the signal. Real cancer drugs (MEK and BRAF inhibitors) work this way.` };
    runChecks([q], r, () => { setPhase(3); finishMission(r, 'Loss-of-function defects stop a signal. Gain-of-function defects (like stuck-on Ras or Raf) send it nonstop.'); }); };
  r.hintText = () => round === 1 ? 'The signal travels step by step. The defective protein is the first one that stays dark (gray).' : 'With no growth factor, nothing should be active. The faulty protein is the first one that is active anyway (outlined in orange).';
  scene(); panel(); say('Send the signal and watch the pathway.', 'info');
}

/* ---------------- report ---------------- */
function reportText() {
  const done = MISSIONS.filter(m => G.results[m.id]);
  return [`SIGNAL CASCADE — ${G.name || 'Student'} — ${new Date().toLocaleString()}`, `Missions completed: ${done.length}/${MAX} · Stars: ${done.reduce((a, m) => a + G.results[m.id].stars, 0)}/${done.length * 3}`, '',
    ...done.map(m => { const x = G.results[m.id]; return `${m.title} (${m.tag}): ${'★'.repeat(x.stars)}${'☆'.repeat(3 - x.stars)} · mistakes ${x.mistakes} · checks ${x.checks} · ${fmtTime(x.secs)}${x.review.length ? '\n  Review: ' + x.review.join('; ') : ''}`; })].join('\n');
}
function vReport() {
  stopRun(); hud();
  const done = MISSIONS.filter(m => G.results[m.id]);
  const topics = [...new Set(done.flatMap(m => G.results[m.id].review))];
  $('#app').innerHTML = `<section class="card" style="max-width:900px;margin:0 auto"><span class="eyebrow">Report${G.name ? ' · ' + esc(G.name) : ''}</span><h1>Signal Cascade report</h1>
    <p class="muted">${done.length} of ${MAX} missions completed this session · ${done.reduce((a, m) => a + G.results[m.id].stars, 0)} stars</p>
    <div style="overflow-x:auto"><table class="rtable"><tr><th>Mission</th><th>Stars</th><th>Mistakes</th><th>Checks</th><th>Time</th></tr>
    ${MISSIONS.map(m => { const x = G.results[m.id]; return `<tr><td>${m.icon} <b>${esc(m.title)}</b><br><span class="small muted">${esc(m.tag)}</span></td><td style="color:#f0b429">${x ? starsHTML(x.stars) : '<span class="muted">—</span>'}</td><td>${x ? x.mistakes : ''}</td><td>${x ? x.checks : ''}</td><td>${x ? fmtTime(x.secs) : ''}</td></tr>`; }).join('')}</table></div>
    ${topics.length ? `<h3 style="margin-top:18px">Topics to review</h3><ul>${topics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : done.length ? '<p class="small">No review topics: great work.</p>' : ''}
    <div class="row noprint" style="margin-top:16px"><button class="btn primary" id="cpB">📋 Copy report</button><button class="btn" onclick="window.print()">🖨️ Print</button><button class="btn" id="bkB">← All missions</button></div></section>`;
  $('#bkB').onclick = vHome;
  $('#cpB').onclick = () => { const t = reportText(); const ok = () => toast('Report copied');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
    function fb() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Copy failed'); } ta.remove(); } };
}

$('#homeBtn').onclick = vHome;
/* a link like ?m=anta opens that mission straight away */
(() => { const m = new URLSearchParams(location.search).get('m'), d = MISSIONS.find(x => x.id === m); if (d) startMission(d); else vHome(); })();
</script>
