<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contaminated</title>
<meta name="description" content="A hidden-saboteur biology lab game for high school classrooms. Complete lab tasks, collect scan results, find the saboteurs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13;--bg2:#10161e;--panel:#141c26;--panel2:#1b2532;--line:#2a3747;
  --text:#e9f0f7;--muted:#97a6b8;--haz:#ff8a3d;--haz-ink:#2a1300;--tox:#9cff57;--tox-ink:#173000;
  --cyan:#4fd8ff;--bad:#ff5c6c;--good:#7ee787;--warn:#ffd23f;--r:16px;
  --head:'Chakra Petch',system-ui,sans-serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);line-height:1.5;background:
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/32px 32px,
  radial-gradient(900px 500px at 90% -10%,rgba(255,138,61,.12),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,rgba(156,255,87,.08),transparent 60%),var(--bg)}
body.ghost{filter:saturate(.35) brightness(.9)}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:.2em 0 .4em;letter-spacing:.01em}
h2{font-size:1.7rem}
button{font:inherit;cursor:pointer}
.muted{color:var(--muted)}.small{font-size:.88rem}.mono{font-family:var(--mono)}
.eyebrow{font:700 .74rem var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--haz)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{background:var(--haz);color:var(--haz-ink);border:0;padding:12px 20px;border-radius:12px;font-weight:700;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.tox{background:var(--tox);color:var(--tox-ink)}
.btn.red{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--haz)}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn.big{padding:16px 26px;font-size:1.1rem}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.tx{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.tx:focus{outline:2px solid var(--haz);outline-offset:1px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--haz) 0 14px,#111 14px 28px)}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:rgba(10,14,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font:700 1.1rem var(--head);letter-spacing:.06em;background:none;border:0;color:var(--text);display:flex;align-items:center;gap:8px;padding:0}
.logo b{color:var(--tox)}
.pill{font:700 .78rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill strong{color:var(--text)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font:600 .8rem var(--sans)}
.iconbtn:hover{border-color:var(--haz)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 110px}

/* HOME */
.hero{text-align:center;padding:24px 0 6px}
.hero h1{font-size:clamp(2.8rem,9vw,5.6rem);letter-spacing:.04em;margin:.1em 0}
.hero h1 span{color:var(--tox);text-shadow:0 0 30px rgba(156,255,87,.45)}
.hero .bio{font-size:3rem}
.lead{max-width:660px;margin:0 auto 26px;color:var(--muted);font-size:1.1rem}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;max-width:900px;margin:0 auto}
.choice{text-align:left;color:var(--text);background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:22px;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-3px);border-color:var(--haz)}
.choice .big{font-size:2.2rem}
.choice h3{font-size:1.3rem;margin:8px 0 4px}
.choice p{margin:0;color:var(--muted);font-size:.95rem}
.how{max-width:900px;margin:22px auto 0;text-align:left}
.how summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0}
.how ol{color:var(--muted);padding-left:22px}
.how li{margin:6px 0}

/* MAP */
.map{width:100%;height:auto;display:block}
.map .corr{fill:#121a24;stroke:#2a3747;stroke-width:2}
.map .conn{fill:#121a24}
.map .room rect.bg{fill:#17212d;stroke:#33455a;stroke-width:2;transition:fill .15s,stroke .15s}
.map .room.click{cursor:pointer}
.map .room.click:hover rect.bg{stroke:var(--haz);fill:#1d2937}
.map .room.sel rect.bg{stroke:var(--tox);stroke-width:3}
.map .room.done rect.bg{stroke:rgba(126,231,135,.6)}
.map text{font-family:'Chakra Petch',sans-serif;fill:#e9f0f7}
.map .rname{font-size:20px;font-weight:700}
.map .rsub{font-size:13px;fill:#97a6b8;font-family:'IBM Plex Mono',monospace}
.map .badge{fill:var(--warn)}
.map .btxt{fill:#2a1a00;font-weight:800;font-size:18px;font-family:'IBM Plex Mono',monospace}
.map .tablec{fill:#2a1416;stroke:var(--bad);stroke-width:3}
@keyframes blink{50%{opacity:.35}}
.map .badge-g{animation:blink 1.4s infinite}

/* ROSTER */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.rc{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;text-align:center;transition:all .15s}
.rc .av{width:52px;height:52px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font:700 1.2rem var(--mono);color:#0a0e13;border:3px solid rgba(255,255,255,.25);position:relative}
.rc .av::after{content:'';position:absolute;top:10px;left:9px;right:9px;height:12px;border-radius:6px;background:rgba(10,14,19,.55)}
.rc .av span{position:relative;top:7px;z-index:1}
.rc .meta{font-size:.78rem;color:var(--muted);margin-top:6px;line-height:1.3}
.rc .stt{font:700 .66rem var(--mono);letter-spacing:.1em;margin-top:6px}
.rc.pickable{cursor:pointer}
.rc.pickable:hover{border-color:var(--haz)}
.rc.sel{border-color:var(--tox);box-shadow:0 0 0 3px rgba(156,255,87,.3)}
.rc.st-ghost{opacity:.45;filter:grayscale(.7)}
.rc.st-ghost .stt{color:var(--cyan)}
.rc.st-ejected{opacity:.4;filter:grayscale(1)}
.rc.st-ejected .stt{color:var(--bad)}
.rc.wasSab{opacity:.8;filter:none;border-color:var(--bad)}

/* HOST */
.host-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
@media (max-width:900px){.host-grid{grid-template-columns:1fr}}
.codebig{font:700 clamp(3rem,10vw,6rem) var(--mono);letter-spacing:.18em;color:var(--tox);text-shadow:0 0 30px rgba(156,255,87,.35)}
.timer{font:700 clamp(3rem,9vw,5.5rem) var(--mono);letter-spacing:.04em}
.timer.low{color:var(--bad);animation:blink 1s infinite}
.phase-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lights{background:#000;border-radius:var(--r);padding:30px;border:1px solid #222;text-align:center}
.lights h2{color:var(--bad);font-size:2.4rem}
.reveal-box{text-align:center;padding:40px 20px}
.reveal-box .big{font:700 clamp(2rem,6vw,3.6rem) var(--head)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px}
.toggle{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--haz)}
.event{padding:12px 16px;border-radius:12px;background:rgba(255,92,108,.1);border:1px solid rgba(255,92,108,.4);color:#ffc3c9;font-weight:600;margin-bottom:12px}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.qr img,.qr canvas{display:block}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:12px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;background:var(--haz);color:var(--haz-ink);display:grid;place-items:center;font-weight:800}

/* PLAYER */
.pbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav[hidden]{display:none}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,14,19,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.nav button{flex:1;max-width:140px;background:none;border:0;color:var(--muted);padding:6px 4px;border-radius:10px;font:600 .78rem var(--sans);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .i{font-size:1.3rem}
.nav button.on{color:var(--text);background:var(--panel)}
.tasklist{display:grid;gap:10px;margin-top:14px}
.titem{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.titem:hover{border-color:var(--haz)}
.titem .ic{font-size:1.6rem}
.titem .st{margin-left:auto;font:700 .75rem var(--mono)}
.titem.done{opacity:.6}
.titem.done .st{color:var(--good)}
.titem .st.todo{color:var(--warn)}
.progress{height:12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--tox),var(--cyan));transition:width .5s}

.role-card{position:relative;border-radius:20px;border:2px dashed var(--line);background:var(--panel);min-height:260px;display:grid;place-items:center;text-align:center;padding:24px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.role-card .hidden-msg{font:700 1.2rem var(--head);color:var(--muted)}
.role-card .secret{display:none}
.role-card.show .secret{display:block}
.role-card.show .hidden-msg{display:none}
.role-card.show.sab{border-color:var(--bad);background:linear-gradient(160deg,#2a0f14,var(--panel))}
.role-card.show.crew{border-color:var(--tox);background:linear-gradient(160deg,#12240c,var(--panel))}
.role-title{font:700 2.2rem var(--head);letter-spacing:.06em}
.idcard{display:flex;gap:16px;align-items:center}
.idcard .av{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font:700 1.6rem var(--mono);color:#0a0e13;border:3px solid rgba(255,255,255,.3);flex:none}

/* TASK */
.task-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.task-head .ic{font-size:2.4rem}
.prompt{font-size:1.12rem;font-weight:600;margin:4px 0 14px}
.part{margin:18px 0}
.part .lbl{font:700 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bgroup{display:flex;flex-wrap:wrap;gap:8px}
.ch{padding:11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-weight:600;min-width:56px}
.ch:hover:not(:disabled){border-color:var(--haz)}
.ch.sel{border-color:var(--tox);background:rgba(156,255,87,.12);color:#e4ffd0}
.ch:disabled{cursor:default;opacity:.7}
.ch.mono{font-family:var(--mono)}
.matchrow{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px;align-items:center;margin:10px 0;padding:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
@media (max-width:560px){.matchrow{grid-template-columns:1fr}}
.matchrow .item{font-weight:700}
.viz{background:#0b1119;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:center;overflow-x:auto}
.viz svg{max-width:100%;height:auto}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;background:rgba(255,92,108,.1);border:1px solid rgba(255,92,108,.4);color:#ffc3c9}
.lockbox{margin-top:14px;padding:14px;border-radius:12px;background:repeating-linear-gradient(-45deg,rgba(255,138,61,.12) 0 12px,rgba(255,138,61,.04) 12px 24px);border:1px solid var(--haz);color:var(--haz);font:700 1rem var(--mono);text-align:center}
.submit-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.success{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.88);display:grid;place-items:center;padding:16px}
.success .box{max-width:520px;width:100%;text-align:center}
.success .ok{font:700 2.2rem var(--head);color:var(--tox);letter-spacing:.06em}
.clue{margin:16px 0;padding:16px;border-radius:14px;border:1px solid var(--cyan);background:rgba(79,216,255,.08);text-align:left}
.clue .lbl{font:700 .72rem var(--mono);letter-spacing:.14em;color:var(--cyan)}
.clue .t{font-weight:700;font-size:1.08rem;margin-top:4px}
.explain{color:var(--muted);text-align:left;margin-top:10px;font-size:.95rem}

.nb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.nb{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 4px;text-align:center;color:var(--text)}
.nb .dot{width:30px;height:30px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:700 .85rem var(--mono);color:#0a0e13}
.nb .m{font-size:.68rem;color:var(--muted);line-height:1.2;margin-top:3px}
.nb .mk{font:800 .72rem var(--mono);margin-top:2px;min-height:1em}
.nb.clear{border-color:var(--good)}.nb.clear .mk{color:var(--good)}
.nb.sus{border-color:var(--bad);background:rgba(255,92,108,.1)}.nb.sus .mk{color:var(--bad)}
.nb.me{outline:2px solid var(--haz)}
.cluelist{display:grid;gap:8px}
.cluelist div{padding:10px 12px;border-radius:10px;background:var(--panel);border-left:3px solid var(--cyan)}
table.rep{width:100%;border-collapse:collapse;font-size:.94rem}
table.rep td,table.rep th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{font:700 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%}

.modal{position:fixed;inset:0;background:rgba(3,6,10,.8);display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:40px 14px;overflow-y:auto}
.modal.hidden{display:none}
.modal .card{width:min(560px,100%);position:relative}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;padding:12px 20px;border-radius:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);transition:all .25s;pointer-events:none;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){h2{font-size:1.35rem}main{padding:16px 12px 110px}}
@media print{.hazard,header.top,.nav,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="hazard" aria-hidden="true"></div>
<header class="top">
  <button class="logo" onclick="APP.home()">☣️ CONTAMI<b>NATED</b></button>
  <div class="row" id="hud"></div>
</header>
<main id="app"></main>
<nav class="nav" id="nav" hidden></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)APP.closeModal()"><div class="card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* =====================================================================
   CONTAMINATED — a hidden-saboteur biology lab game
   Works with no server: the host's room code deterministically assigns
   roles, tasks, and clues on every student's device.
   ===================================================================== */
const TEACHER_PIN = '1234';
const TASKS_PER_PLAYER = 6;
const COOLDOWN_MS = 6000;

/* ---------------- utilities ---------------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^(h>>>16))>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rngFor = s => mulberry32(hashStr(s));
const pick = (r,a) => a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function drop(k){try{localStorage.removeItem(k);}catch(e){}}
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='toast show';clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',1800);}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d+.2);o.start(a.currentTime+d);o.stop(a.currentTime+d+.2);});}catch(e){}}

/* ---------------- room codes: 4 random chars + 2 chars encoding players/saboteurs/unit ---------------- */
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const UNITS=['Mixed review (Ch 6, 7 + genetics)','Ch 6: The Chemistry of Life','Ch 7: Cell Structure & Function','Ch 6 + 7 (no genetics)'];
function makeCode(N,S,unit){let c='';for(let i=0;i<4;i++)c+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return c+((N-4)*16+(S-1)*4+unit).toString(36).toUpperCase().padStart(2,'0');}
function parseCode(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length!==6) return null;
  const v=parseInt(c.slice(4),36); if(isNaN(v)) return null;
  const unit=v%4, S=((v>>2)%4)+1, N=Math.floor(v/16)+4;
  if(N>40||S*2>=N) return null;
  return {code:c,N,S,unit};
}

/* ---------------- public roster: coat color, specialty, lab group ---------------- */
const COATS=[['Red','#ef4444'],['Blue','#3b82f6'],['Green','#22c55e'],['Yellow','#facc15'],['Purple','#a855f7'],['Orange','#f97316'],['Pink','#ec4899'],['Cyan','#22d3ee']];
const SPECS=[['Botanist','🌱'],['Geneticist','🧬'],['Microbiologist','🦠'],['Biochemist','⚗️']];
const GROUPS=['A','B','C','D'];
function roster(cfg){
  const r=rngFor(cfg.code+'|roster'), players=[];
  for(let n=1;n<=cfg.N;n++){const c=pick(r,COATS),s=pick(r,SPECS);players.push({n,coat:c[0],hex:c[1],spec:s[0],sicon:s[1],group:pick(r,GROUPS)});}
  const sabs=shuffle(r,players.map(p=>p.n)).slice(0,cfg.S).sort((a,b)=>a-b);
  return {players,sabs};
}

/* ---------------- clues: true for scientists, fake for saboteurs ---------------- */
const ATTRS=[
  {k:'coat', vals:COATS.map(c=>c[0]), say:v=>`wears a ${v} lab coat`},
  {k:'spec', vals:SPECS.map(s=>s[0]), say:v=>`is a ${v}`},
  {k:'group',vals:GROUPS,             say:v=>`is in Lab Group ${v}`}
];
function makeClue(cfg,R,num,i){
  const r=rngFor(cfg.code+'|clue|'+num+'|'+i), isSab=R.sabs.includes(num);
  const sabP=R.players.filter(p=>R.sabs.includes(p.n)), inn=R.players.filter(p=>!R.sabs.includes(p.n)&&p.n!==num);
  const a=pick(r,ATTRS), roll=r();
  const someWord = cfg.S===1 ? 'The saboteur' : 'At least one saboteur';
  const heldBySab = v=>sabP.some(p=>p[a.k]===v), heldByAny = v=>R.players.some(p=>p[a.k]===v);
  const clear = n=>`Decontamination scan cleared Scientist #${n} — NOT a saboteur.`;
  if(!isSab){
    if(roll<0.7&&roll>=0.4){const v=a.vals.filter(v=>!heldBySab(v)&&heldByAny(v)); if(v.length) return `No saboteur ${a.say(pick(r,v))}.`;}
    if(roll>=0.7){const s=pick(r,sabP); return `${someWord} ${a.say(s[a.k])}.`;}
    return inn.length ? clear(pick(r,inn).n) : `${someWord} ${a.say(pick(r,sabP)[a.k])}.`;
  } else {
    if(roll<0.7&&roll>=0.4){const s=pick(r,sabP); return `No saboteur ${a.say(s[a.k])}.`;}
    if(roll>=0.7){const v=a.vals.filter(v=>!heldBySab(v)&&heldByAny(v)); if(v.length) return `${someWord} ${a.say(pick(r,v))}.`;}
    return clear(pick(r,sabP).n);
  }
}

function bohrSVG(P,N,E){
  const shells=[2,8,8,2], radii=[48,78,108,134]; let left=E, s=`<svg viewBox="-150 -150 300 300" width="280">`;
  radii.forEach((rad,k)=>{ if(left<=0&&k>0) return; s+=`<circle r="${rad}" fill="none" stroke="#2a3747" stroke-dasharray="4 5"/>`;
    const c=Math.min(left,shells[k]); for(let j=0;j<c;j++){const a=j/c*2*Math.PI-Math.PI/2; s+=`<circle cx="${(Math.cos(a)*rad).toFixed(1)}" cy="${(Math.sin(a)*rad).toFixed(1)}" r="6" fill="#4fd8ff"/>`;} left-=c; });
  return s+`<circle r="30" fill="#ff8a3d"/><text y="-3" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12" fill="#2a1300">${P} p⁺</text><text y="13" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="12" fill="#2a1300">${N} n⁰</text></svg>`;
}

    gen(r){const eq=pick(r,EQUATIONS), all=[...eq.r,...eq.p], b=Math.floor(r()*all.length); return {eq:EQUATIONS.indexOf(eq),blank:b,ans:{c:all[b][0]-1}};},
    view(d,u,i,dis){const eq=EQUATIONS[d.eq]; return `<p class="prompt">${eq.note}: choose the missing coefficient so atoms are conserved.</p>${eqHTML(eq,d.blank)}
      <div class="part"><div class="lbl">Missing coefficient</div>${grp(i,'c',['1','2','3','4','5','6'],u.c,dis,'mono')}</div>`;},
    hint:d=>'Count each kind of atom on both sides. Matter is not created or destroyed, so the counts must match.',
    explain:d=>{const eq=EQUATIONS[d.eq]; return `Balanced: ${eq.r.map(t=>(t[0]>1?t[0]:'')+t[1]).join(' + ')} → ${eq.p.map(t=>(t[0]>1?t[0]:'')+t[1]).join(' + ')}. Same number of each atom on both sides (law of conservation of mass).`;}},
  punnett:{room:'genetics',title:'Predict the Offspring',topic:'Punnett Squares',
    gen(r){const pr=pick(r,[['Kk','Kk'],['Kk','kk'],['KK','Kk'],['Kk','KK'],['kk','Kk']]), tr=pick(r,TRAITS);
      const top=[pr[0][0],pr[0][1]], side=[pr[1][0],pr[1][1]], G=['KK','Kk','kk'], cells=[];
      side.forEach(a=>top.forEach(b=>cells.push(a===a.toUpperCase()?a+b:(b===b.toUpperCase()?b+a:a+b))));
      const ans={}; cells.forEach((c,k)=>ans['c'+k]=G.indexOf(c)); ans.p=cells.filter(c=>c==='kk').length;
      return {pr,tr,top,side,ans};},
    view(d,u,i,dis){const G=['KK','Kk','kk'];
      return `<p class="prompt">K = ${d.tr[0]} (dominant), k = ${d.tr[1]} (recessive). Cross <b>${d.pr[0]} × ${d.pr[1]}</b>. Tap boxes to fill the square.</p>
      <div class="viz"><div style="display:grid;grid-template-columns:54px repeat(2,80px);grid-template-rows:46px repeat(2,80px);gap:6px">
        <div></div>${d.top.map(a=>`<div style="display:grid;place-items:center;font:700 1.3rem var(--mono);color:var(--cyan)">${a}</div>`).join('')}
        ${[0,1].map(rw=>`<div style="display:grid;place-items:center;font:700 1.3rem var(--mono);color:var(--cyan)">${d.side[rw]}</div>${[0,1].map(c=>{const k=rw*2+c,v=u['c'+k];return `<button class="ch mono" style="font-size:1.25rem" ${dis?'disabled':''} onclick="P.cyc(${i},'c${k}',3)">${v==null?'?':G[v]}</button>`;}).join('')}`).join('')}
      </div></div>
      <div class="part"><div class="lbl">Chance of ${d.tr[1]}</div>${grp(i,'p',['0%','25%','50%','75%','100%'],u.p,dis,'mono')}</div>`;},
    hint:d=>'Parent 1’s alleles go across the top, Parent 2’s down the side. Only kk shows the recessive trait.',
    explain:d=>`Each box gets one allele from each parent. ${d.ans.p} of 4 boxes are kk, so the chance of ${d.tr[1]} is ${d.ans.p*25}%.`},
  dna:{room:'genetics',title:'Repair the DNA Sample',topic:'DNA Base Pairing',
    gen(r){let s='';for(let k=0;k<8;k++)s+=pick(r,['A','T','C','G']); const c=s.split('').map(b=>COMP[b]).join('');
      const MIS={A:'G',G:'A',T:'C',C:'T'}; const o=[...new Set([c,c.replace(/T/g,'U'),s,s.split('').map(b=>MIS[b]).join('')])];
      while(o.length<4){ let x=''; for(let k=0;k<8;k++) x+=pick(r,['A','T','C','G']); if(!o.includes(x)) o.push(x); }
      const op=shuffle(r,o.slice(0,4)); return {s,op,ans:{a:op.indexOf(c)}};},
    view(d,u,i,dis){return `<p class="prompt">One strand survived the contamination. Pick its complementary strand.</p>
      <div class="viz" style="font:700 1.4rem var(--mono);letter-spacing:.18em">5′ ${d.s} 3′</div>
      <div class="part"><div class="lbl">Complementary strand (3′ → 5′)</div>${grp(i,'a',d.op.map(x=>`3′ ${x} 5′`),u.a,dis,'mono')}</div>`;},
    hint:d=>'A pairs with T, C pairs with G. DNA has no uracil (U)—that’s RNA.',
    explain:d=>`A–T and C–G: 5′ ${d.s} 3′ pairs with 3′ ${d.s.split('').map(b=>COMP[b]).join('')} 5′.`}
};
const POOLS=[Object.keys(TT),['atom','balance','ph','macro','enzyme'],['micro','organelle','plantanimal','osmosis','transport','macro'],['micro','organelle','plantanimal','osmosis','transport','ph','macro','enzyme','atom','balance']];
function grp(i,key,opts,val,dis,cls=''){return `<div class="bgroup">${opts.map((o,j)=>`<button class="ch ${cls} ${val===j?'sel':''}" ${dis?'disabled':''} onclick="P.set(${i},'${key}',${j})">${o}</button>`).join('')}</div>`;}
function sel(i,key,opts,val,dis){return `<select class="tx" ${dis?'disabled':''} onchange="P.set(${i},'${key}',this.value===''?null:+this.value)"><option value="">Choose…</option>${opts.map((o,j)=>`<option value="${j}" ${val===j?'selected':''}>${h(o)}</option>`).join('')}</select>`;}
function genTask(seed,unit,i){
  const pool=POOLS[unit]||POOLS[0], r=rngFor(seed+'|task|'+i);
  const order=shuffle(rngFor(seed+'|order'),pool);
  const type = i<order.length ? order[i] : pick(r,pool);
  return {i,type,d:TT[type].gen(r)};
}

const P={

  submit(i){
    const t=genTask(pSeed(),PS.cfg.unit,i), u=PS.ui[i]||{}, keys=Object.keys(t.d.ans);
    if(PS.done[i]||(PS.lock[i]&&PS.lock[i]>Date.now())) return;
    if(!keys.every(k=>u[k]!=null)){ toast('Answer every part first'); return; }
    PS.att[i]=(PS.att[i]||0)+1;
    const right=keys.filter(k=>u[k]===t.d.ans[k]).length;
    if(right===keys.length){
      PS.done[i]=true; PS.first[i]=PS.att[i]===1; PS.msg[i]=null;
      let clue=null; if(!PS.practice){ clue=makeClue(PS.cfg,PS.R,PS.num,i); PS.clues.push({i,text:clue}); }

function pStats(){
  const by={}; for(let i=0;i<PS.count;i++){ if(!PS.att[i]) continue; const t=genTask(pSeed(),PS.cfg.unit,i), tp=TT[t.type].topic;
    const b=by[tp]=by[tp]||{n:0,first:0,att:0,done:0}; b.n++; b.att+=PS.att[i]; if(PS.done[i]) b.done++; if(PS.first[i]) b.first++; }
  return by;
}

  const tabs=PS.practice?[['map','🗺️','Map'],['report','📋','Report']]:[['map','🗺️','Map'],['notebook','🔎','Notebook'],['role','🪪','Role'],['report','📋','Report']];
  const cur=PS.view==='task'?'map':PS.view;
  return tabs.map(([k,i,l])=>`<button class="${cur===k?'on':''}" onclick="P.go('${k}')"><span class="i">${i}</span>${l}</button>`).join('');
}

/* =====================================================================
   HOST (teacher projector)
   ===================================================================== */
let HS=load('contam-host');
const hSave=()=>save('contam-host',HS);
function hR(){ return roster(HS); }
function hNew(o){
  const code=makeCode(o.N,o.S,o.unit), cfg=parseCode(code);
  HS={...cfg,rounds:o.rounds,taskMin:o.taskMin,meetMin:o.meetMin,lights:o.lights,revealRoles:o.revealRoles,phase:'lobby',round:0,status:{},timerEnd:0,beeped:false,sel:null,event:'',lastEject:null,winner:null,why:''};
  for(let n=1;n<=HS.N;n++) HS.status[n]='alive'; hSave();
}
function hCheck(){
  const R=hR(), alive=n=>HS.status[n]==='alive';
  const sa=R.sabs.filter(alive).length, ca=R.players.filter(p=>!R.sabs.includes(p.n)&&alive(p.n)).length;
  if(sa===0) return ['crew','Every saboteur has been ejected. The lab is safe!'];
  if(sa>=ca) return ['sab','Saboteurs now equal or outnumber the scientists. The lab is lost!'];
  return null;
}
function hEnd(w,why){ HS.phase='end'; HS.winner=w; HS.why=why; HS.timerEnd=0; hSave(); render(); }
function hTimer(min){ HS.timerEnd=Date.now()+min*60000; HS.beeped=false; }
const H={
  create(){
    const v=id=>document.getElementById(id), N=+v('hN').value, S=+v('hS').value;
    if(!(N>=4&&N<=40)){ toast('Players must be 4–40'); return; }
    if(S*2>=N){ toast('Too many saboteurs for that many players'); return; }
    hNew({N,S,unit:+v('hU').value,rounds:+v('hRounds').value,taskMin:+v('hTask').value,meetMin:+v('hMeet').value,lights:v('hLights').checked,revealRoles:v('hReveal').checked});
    render(); window.scrollTo(0,0);
  },
  startRound(){ HS.round++; HS.phase='tasks'; HS.event=''; HS.sel=null; hTimer(HS.taskMin); hSave(); render(); },
  endTasks(){ HS.sel=null; if(HS.lights){ HS.phase='lights'; HS.timerEnd=0; } else { HS.phase='meeting'; hTimer(HS.meetMin); } hSave(); render(); },
  emergency(){ HS.phase='meeting'; HS.event='🚨 Emergency meeting called!'; HS.sel=null; hTimer(HS.meetMin); hSave(); render(); },
  pick(n){ if(HS.status[n]!=='alive') return; HS.sel=HS.sel===n?null:n; hSave(); render(); },
  lightsOn(){
    if(HS.sel){ HS.status[HS.sel]='ghost'; HS.event=`☣️ Scientist #${HS.sel} was contaminated! They are now a ghost: no talking, no voting (but keep doing tasks).`; }
    else HS.event='😮‍💨 Lights on. Nobody was contaminated this round.';
    HS.sel=null; const w=hCheck(); if(w){ hEnd(...w); return; }
    HS.phase='meeting'; hTimer(HS.meetMin); hSave(); render();
  },
  vote(){ HS.phase='vote'; HS.sel=null; HS.timerEnd=0; hSave(); render(); },
  eject(skip){
    if(!skip&&!HS.sel){ toast('Select a scientist first'); return; }
    HS.lastEject= skip?null:HS.sel; if(!skip) HS.status[HS.sel]='ejected';
    HS.sel=null; HS.phase='reveal'; hSave(); render();
  },
  afterReveal(){
    const w=hCheck(); if(w){ hEnd(...w); return; }
    if(HS.round>=HS.rounds){ hEnd('sab','☢️ Lab meltdown! The scientists ran out of time to find the saboteurs.'); return; }
    H.startRound();
  },
  addTime(m){ HS.timerEnd=Math.max(HS.timerEnd,Date.now())+m*60000; HS.beeped=false; hSave(); render(); },
  setStatus(n){ const c=HS.status[n], nx={alive:'ghost',ghost:'ejected',ejected:'alive'}[c]; HS.status[n]=nx; hSave(); render(); },
  reset(){ if(confirm('Close this lab and start setup over?')){ drop('contam-host'); HS=null; render(); } },
  newGameSame(){ hNew({N:HS.N,S:HS.S,unit:HS.unit,rounds:HS.rounds,taskMin:HS.taskMin,meetMin:HS.meetMin,lights:HS.lights,revealRoles:HS.revealRoles}); render(); window.scrollTo(0,0); },
  key(){ APP.modal(`<div class="eyebrow">Teacher key</div><h2>Enter PIN</h2><div class="row"><input id="pin" type="password" class="tx" style="max-width:160px" onkeydown="if(event.key==='Enter')H.unlock()"><button class="btn" onclick="H.unlock()">Show</button><button class="btn ghost" onclick="APP.closeModal()">Close</button></div>`); setTimeout(()=>{const p=document.getElementById('pin');if(p)p.focus();},50); },
  unlock(){ if(document.getElementById('pin').value!==TEACHER_PIN){ toast('Wrong PIN'); return; }
    const R=hR(); APP.modal(`<div class="eyebrow">Teacher key · Room ${HS.code}</div><h2>Saboteurs</h2><p style="font:700 1.8rem var(--mono);color:var(--bad)">#${R.sabs.join(', #')}</p><p class="muted small">Don’t leave this on the projector!</p><button class="btn" onclick="APP.closeModal()">Hide</button>`); }
};
function joinURL(){ const base=location.origin&&location.origin!=='null'?location.origin+location.pathname:''; return base?base+'?code='+HS.code:''; }
function hRoster(mode){
  const R=hR(), showSab=HS.phase==='end';
  return `<div class="roster">${R.players.map(p=>{const st=HS.status[p.n], pk=mode==='pick'&&st==='alive', wasSab=(showSab||(st==='ejected'&&HS.revealRoles))&&R.sabs.includes(p.n);
    return `<div class="rc st-${st} ${pk?'pickable':''} ${HS.sel===p.n?'sel':''} ${wasSab?'wasSab':''}" ${pk?`onclick="H.pick(${p.n})"`:mode==='edit'?`onclick="H.setStatus(${p.n})" title="Click to change status"`:''}>
      <div class="av" style="background:${p.hex}"><span>${p.n}</span></div>
      <div class="meta">${p.sicon} ${p.spec}<br>${p.coat} · Grp ${p.group}</div>
      <div class="stt">${wasSab?'☣️ SABOTEUR':st==='ghost'?'👻 GHOST':st==='ejected'?'EJECTED':''}</div></div>`;}).join('')}</div>`;
}
function hTimerHTML(){ return `<div class="timer" id="hTimer">${fmtLeft()}</div>`; }
function fmtLeft(){ if(!HS.timerEnd) return '--:--'; const s=Math.max(0,Math.ceil((HS.timerEnd-Date.now())/1000)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function vHostSetup(){
  return `<section class="card pop" style="max-width:760px;margin:0 auto">
    <div class="eyebrow">Host a lab · teacher screen</div><h2>Set up the lab</h2>
    <div class="set-grid">
      <div><label class="f" for="hN">Number of players</label><input id="hN" class="tx" type="number" min="4" max="40" value="24" oninput="document.getElementById('hS').value=Math.max(1,Math.min(4,Math.round(this.value/8)))"></div>
      <div><label class="f" for="hS">Saboteurs</label><select id="hS" class="tx">${[1,2,3,4].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select><div class="muted small">About 1 per 8 players.</div></div>
      <div><label class="f" for="hU">Task content</label><select id="hU" class="tx">${UNITS.map((u,i)=>`<option value="${i}">${u}</option>`).join('')}</select></div>
      <div><label class="f" for="hRounds">Rounds before meltdown</label><select id="hRounds" class="tx">${[3,4,5,6].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><label class="f" for="hTask">Task phase (minutes)</label><select id="hTask" class="tx">${[2,3,4,5,6,8,10].map(n=>`<option ${n===5?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><label class="f" for="hMeet">Discussion (minutes)</label><select id="hMeet" class="tx">${[1,2,3,4].map(n=>`<option ${n===2?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <label class="toggle"><input type="checkbox" id="hLights" checked> “Lights out” phase: saboteurs secretly contaminate one scientist each round</label>
    <label class="toggle"><input type="checkbox" id="hReveal" checked> Reveal whether ejected players were saboteurs</label>
    <div class="submit-row"><button class="btn big" onclick="H.create()">Create lab & get room code</button><button class="btn ghost" onclick="APP.home()">Back</button></div>
    <p class="muted small">Students use their <b>class roster number</b> as their scientist number, so numbers 1–N should match your roll list.</p>
  </section>`;
}
function vHost(){
  if(!HS) return vHostSetup();
  const R=hR(), alive=Object.values(HS.status).filter(s=>s==='alive').length;
  const head=`<div class="phase-banner"><div><div class="eyebrow">Room ${HS.code} · ${UNITS[HS.unit]}</div><h2 style="margin:.1em 0">${{lobby:'Lab briefing',tasks:`Round ${HS.round}: Task phase`,lights:`Round ${HS.round}: Lights out`,meeting:`Round ${HS.round}: Emergency meeting`,vote:`Round ${HS.round}: Vote`,reveal:'Ejection result',end:'Game over'}[HS.phase]}</h2></div>
    <div class="row"><span class="pill">Round <strong>${HS.round}/${HS.rounds}</strong></span><span class="pill">Active <strong>${alive}</strong></span>${HS.revealRoles?`<span class="pill">Saboteurs left <strong>${R.sabs.filter(n=>HS.status[n]!=='ejected').length}</strong></span>`:''}</div></div>`;
  let body='';
  if(HS.phase==='lobby') body=`<div class="host-grid"><div class="card center" style="text-align:center">
      <div class="eyebrow">Room code</div><div class="codebig">${HS.code}</div>
      ${joinURL()?`${window.QRCode?'<div class="qr" id="qr"></div>':''}<p class="muted small mono" style="word-break:break-all">${h(joinURL())}</p>`:'<p class="muted">Students open this same page and tap <b>Join a lab</b>.</p>'}
      <p>${HS.N} scientists · ${HS.S} saboteur${HS.S>1?'s':''} hidden among them</p>
      <button class="btn big tox" onclick="H.startRound()">▶ Start Round 1</button></div>
    <div class="card"><h3>How to join</h3><ol class="steps">
      <li>Open the game on your device and tap <b>Join a lab</b> (or scan the QR code).</li>
      <li>Enter room code <b class="mono">${HS.code}</b> and your <b>class roster number</b>.</li>
      <li>Cover your screen, then press and hold to see your secret role.</li>
      <li>Scientists: complete lab tasks to earn <b>true</b> scan results. Saboteurs: your results are <b>fake</b>. Use them to mislead!</li>
      <li>At meetings, share evidence, argue, and vote someone out.</li></ol>
      <p class="muted small">Scientists win by ejecting every saboteur. Saboteurs win if they equal the scientists or survive ${HS.rounds} rounds.</p></div></div>
    <h3 style="margin-top:22px">Scientist roster (public)</h3>${hRoster()}`;
  if(HS.phase==='tasks') body=`<div class="host-grid"><div class="card">${mapSVG()}</div>
      <div class="card" style="text-align:center"><div class="eyebrow">Time left to work</div>${hTimerHTML()}
      <p class="muted">Students: complete lab tasks on your device.<br>Ghosts keep working, silently.</p>
      <div class="row" style="justify-content:center"><button class="btn red big" onclick="H.emergency()">🚨 Emergency meeting</button><button class="btn" onclick="H.endTasks()">End task phase →</button></div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost small" onclick="H.addTime(1)">+1 min</button></div></div></div>
    <h3 style="margin-top:22px">Roster</h3>${hRoster()}`;
  if(HS.phase==='lights') body=`<div class="lights"><div style="font-size:3rem">🌑</div><h2>LIGHTS OUT</h2>
      <p style="font-size:1.2rem">Everyone: <b>heads down, eyes closed.</b><br>Saboteurs: look up and silently agree on <b>one</b> scientist to contaminate. Point to them.</p>
      <p class="muted">Teacher: click the scientist they point to (or no one), then turn the lights on.</p></div>
    <div style="margin-top:18px">${hRoster('pick')}</div>
    <div class="submit-row" style="justify-content:center"><button class="btn big" onclick="H.lightsOn()">💡 Lights on${HS.sel?` (contaminate #${HS.sel})`:' (no one)'}</button></div>`;
  if(HS.phase==='meeting') body=`${HS.event?`<div class="event pop">${HS.event}</div>`:''}
    <div class="host-grid"><div class="card"><h3>Discussion prompts</h3><ol class="steps">
      <li>Share your <b>scan results</b>. Read them exactly as written.</li>
      <li>Look for <b>contradictions</b>: whose results don’t match everyone else’s?</li>
      <li>Ask someone to <b>prove their work</b>: “Explain how you solved your osmosis task.”</li>
      <li>Check the roster’s coat colors, specialties, and lab groups against the clues.</li></ol></div>
      <div class="card" style="text-align:center"><div class="eyebrow">Discussion time</div>${hTimerHTML()}
      <div class="row" style="justify-content:center"><button class="btn big" onclick="H.vote()">🗳️ Start the vote</button><button class="btn ghost small" onclick="H.addTime(1)">+1 min</button></div></div></div>
    <h3 style="margin-top:22px">Roster</h3>${hRoster()}`;
  if(HS.phase==='vote') body=`<div class="card"><h3>Vote</h3><p class="muted">Count raised hands for each accused scientist (ghosts don’t vote). Select the scientist with the most votes, or skip if it’s a tie or most people vote to skip.</p></div>
    <div style="margin-top:16px">${hRoster('pick')}</div>
    <div class="submit-row" style="justify-content:center"><button class="btn red big" ${HS.sel?'':'disabled'} onclick="H.eject(false)">⏏️ Eject ${HS.sel?'#'+HS.sel:''}</button><button class="btn ghost big" onclick="H.eject(true)">Skip vote</button></div>`;
  if(HS.phase==='reveal'){ const n=HS.lastEject, isSab=n&&R.sabs.includes(n);
    body=`<div class="card reveal-box pop">${n==null?`<div style="font-size:3rem">🤷</div><div class="big">No one was ejected.</div>`:
      `<div style="font-size:3rem">${HS.revealRoles?(isSab?'☣️':'🔬'):'⏏️'}</div><div class="big">Scientist #${n} ${HS.revealRoles?(isSab?'<span style="color:var(--bad)">WAS a saboteur.</span>':'<span style="color:var(--tox)">was NOT a saboteur.</span>'):'was ejected.'}</div>`}
      ${HS.revealRoles?`<p class="muted" style="font-size:1.1rem">${R.sabs.filter(x=>HS.status[x]!=='ejected').length} saboteur(s) remain.</p>`:''}
      <button class="btn big" onclick="H.afterReveal()">${HS.round>=HS.rounds?'Continue →':`Start Round ${HS.round+1} →`}</button></div>`; }
  if(HS.phase==='end') body=`<div class="card reveal-box pop"><div style="font-size:3.5rem">${HS.winner==='crew'?'🏆':'☣️'}</div>
      <div class="big" style="color:${HS.winner==='crew'?'var(--tox)':'var(--bad)'}">${HS.winner==='crew'?'SCIENTISTS WIN':'SABOTEURS WIN'}</div>
      <p style="font-size:1.1rem">${h(HS.why)}</p><p>The saboteurs were <b class="mono" style="color:var(--bad)">#${R.sabs.join(', #')}</b></p>
      <p class="muted">Everyone: open the <b>📋 Report</b> tab on your device and submit your lab report.</p>
      <div class="row" style="justify-content:center"><button class="btn tox" onclick="H.newGameSame()">New game, same settings</button><button class="btn ghost" onclick="H.reset()">Change settings</button></div></div>
    <h3 style="margin-top:22px">Final roster</h3>${hRoster()}`;
  return `<section class="pop">${head}<div style="margin-top:16px">${body}</div>
    <div class="row noprint" style="justify-content:flex-end;margin-top:24px"><span class="muted small">Fix a mistake: click roster cards below to cycle status.</span>
    <details><summary class="btn ghost small">Edit statuses</summary><div style="margin-top:10px">${hRoster('edit')}</div></details>
    <button class="btn ghost small" onclick="H.key()">🔑 Teacher key</button><button class="btn ghost small" onclick="H.reset()">Close lab</button></div></section>`;
}

/* =====================================================================
   APP shell
   ===================================================================== */
const APP={
  mode: new URLSearchParams(location.search).get('code') ? 'join' : 'home',
  home(){ if(APP.mode==='host'&&HS&&HS.phase!=='lobby'&&HS.phase!=='end'){ /* host state is saved; leaving is safe */ }
    APP.mode='home'; document.body.classList.remove('ghost'); render(); window.scrollTo(0,0); },
  to(m){ APP.mode=m; render(); window.scrollTo(0,0); },
  join(){ const v=id=>document.getElementById(id).value; const err=pJoin(v('jCode'),v('jNum'),v('jName').trim());
    if(err){ const e=document.getElementById('jErr'); e.hidden=false; e.textContent=err; return; }
    APP.mode='player'; history.replaceState(null,'',location.pathname); render(); window.scrollTo(0,0); },
  resume(){ const l=load('contam-last'); if(l&&!pJoin(l.code,l.num,'')){ PS.view='map'; APP.mode='player'; render(); } },
  practice(u){ pPractice(u); APP.mode='player'; render(); window.scrollTo(0,0); },
  modal(html){ document.getElementById('modalCard').innerHTML=html; document.getElementById('modal').classList.remove('hidden'); },
  closeModal(){ document.getElementById('modal').classList.add('hidden'); },
  scale:0, bigger(){ APP.scale=(APP.scale+1)%3; document.documentElement.style.fontSize=[16,18,20][APP.scale]+'px'; }
};
function vHome(){
  const last=load('contam-last');
  return `<section class="hero pop"><div class="bio">☣️</div>
    <h1>CONTAMI<span>NATED</span></h1>
    <p class="lead">There’s a saboteur in the biology lab. Complete real lab tasks to earn scan results, compare evidence, and vote out the saboteurs before the lab melts down.</p>
    <div class="choice-grid">
      <button class="choice" onclick="APP.to('host')"><div class="big">🖥️</div><h3>Host a lab</h3><p>Teacher screen for the projector. Sets the room code and runs rounds, meetings, and votes.</p></button>
      <button class="choice" onclick="APP.to('join')"><div class="big">📱</div><h3>Join a lab</h3><p>Student device. Get your secret role, do lab tasks, and keep your detective notebook.</p></button>
      <button class="choice" onclick="APP.to('practice')"><div class="big">🧪</div><h3>Solo practice</h3><p>Just the lab tasks, no roles. Good for review, homework, or early finishers.</p></button>
    </div>
    ${last?`<p style="margin-top:18px"><button class="btn ghost small" onclick="APP.resume()">↩ Rejoin room ${h(last.code)} as Scientist #${last.num}</button></p>`:''}
    ${HS?`<p><button class="btn ghost small" onclick="APP.to('host')">↩ Return to hosted room ${h(HS.code)}</button></p>`:''}
    <details class="how card"><summary>How a round works</summary><ol>
      <li><b>Task phase:</b> everyone completes biology lab tasks on their device. Wrong answers trigger a short lockout.</li>
      <li>Each finished task gives a <b>scan result</b>. Scientists get true clues; saboteurs get fake ones to spread.</li>
      <li><b>Lights out</b> (optional): heads down; saboteurs silently point to a scientist to contaminate. That player becomes a silent ghost who keeps doing tasks.</li>
      <li><b>Emergency meeting:</b> share scan results, find contradictions, then vote someone out.</li>
      <li>Scientists win by ejecting every saboteur. Saboteurs win by equaling the scientists or surviving until meltdown.</li>
    </ol></details>
  </section>`;
}
function vPracticePick(){
  return `<section class="card pop" style="max-width:620px;margin:0 auto"><div class="eyebrow">Solo practice</div><h2>Pick your content</h2>
    <div class="tasklist">${UNITS.map((u,i)=>`<button class="titem" onclick="APP.practice(${i})"><span class="ic">${['🧬','⚗️','🦠','🔬'][i]}</span><span><b>${u}</b><br><span class="muted small">${POOLS[i].map(t=>TT[t].topic).filter((v,k,a)=>a.indexOf(v)===k).join(' · ')}</span></span></button>`).join('')}</div>
    <div class="submit-row"><button class="btn ghost" onclick="APP.home()">Back</button></div></section>`;
}
function render(){
  const app=document.getElementById('app'), nav=document.getElementById('nav'), hud=document.getElementById('hud');
  let html='', showNav=false;
  if(APP.mode==='home') html=vHome();
  else if(APP.mode==='host') html=vHost();
  else if(APP.mode==='join') html=vJoin();
  else if(APP.mode==='practice') html=vPracticePick();
  else if(APP.mode==='player'&&PS){
    showNav=true;
    html={role:vRole,map:vMap,task:vTask,notebook:vNotebook,report:vReport}[PS.view]();
    if(PS.success) html+=vSuccess();
  }
  app.innerHTML=html;
  nav.hidden=!showNav; nav.innerHTML=showNav?playerNav():'';
  document.body.classList.toggle('ghost',!!(PS&&APP.mode==='player'&&PS.ghost));
  hud.innerHTML=(APP.mode==='player'&&PS?(PS.practice?'<span class="pill">Practice</span>':`<span class="pill">Room <strong>${PS.code}</strong></span><span class="pill">#<strong>${PS.num}</strong></span>`):'')
    +`<button class="iconbtn" onclick="APP.bigger()" title="Bigger text">A⁺</button>`;
  if(APP.mode==='host'&&HS&&HS.phase==='lobby'){ const q=document.getElementById('qr'); if(q&&window.QRCode){ try{ new QRCode(q,{text:joinURL(),width:180,height:180}); }catch(e){} } }
}
setInterval(()=>{
  if(APP.mode==='host'&&HS&&HS.timerEnd){ const t=document.getElementById('hTimer'); if(t){ t.textContent=fmtLeft(); const left=HS.timerEnd-Date.now(); t.classList.toggle('low',left<30000);
    if(left<=0&&!HS.beeped){ HS.beeped=true; hSave(); beep(); t.textContent='TIME!'; } } }
  if(APP.mode==='player'&&PS&&PS.view==='task'&&PS.task!=null&&PS.lock[PS.task]){ const left=PS.lock[PS.task]-Date.now(); const el=document.getElementById('lockT');
    if(left<=0){ delete PS.lock[PS.task]; render(); } else if(el) el.textContent=Math.ceil(left/1000); }
},250);
render();
</script>
