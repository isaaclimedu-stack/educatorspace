<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build an Atom</title>
<meta name="description" content="A chemistry lab for building any atom: add protons, neutrons and electrons, see s, p, d and f orbitals in 3D, follow the filling order, read electron configurations, and predict periodic trends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a lab bench floating in deep space. Controls on the left, the atom on a large stage in the middle, its identity
   card on the right; below, tabbed instruments (orbitals, periodic table, predictions, missions). Orbital lobes glow orange
   for the + phase and blue for the − phase; subshells keep one color everywhere: s magenta, p amber, d green, f blue. */
:root {
  --void: #06050e; --deep: #0d0b20; --panel: #14123a; --panel2: #1c1a4a; --line: #2e2c63; --text: #eeedff; --muted: #a8a5d3;
  --s: #ff4fa8; --p: #ffb02e; --d: #3ad687; --f: #3f9dff; --plus: #ff9a3c; --minus: #3fa4ff; --cyan: #5fd4ff;
  --proton: #ff5a6e; --neutron: #a3abcf; --good: #5ef0a0; --bad: #ff6b7f; --gold: #ffd25e;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { min-height: 100vh; color: var(--text); font: 15.5px/1.5 var(--body); background: radial-gradient(1100px 600px at 85% -10%, #2a1652 0%, transparent 60%), radial-gradient(900px 500px at -10% 110%, #0d3050 0%, transparent 60%), var(--void); background-attachment: fixed; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 14px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.mono { font-family: var(--mono); }
.eyebrow { font: 600 .72rem var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; font: 700 1.2rem var(--display); letter-spacing: .05em; text-transform: uppercase; }
.logo .mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 35%, #ffd0a0, var(--plus) 45%, #7a2c00); box-shadow: 0 0 18px #ff9a3c88; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: 600 .9rem var(--body); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--cyan); }
.btn.primary { background: linear-gradient(135deg, var(--plus), #ff5a8a); border-color: transparent; color: #1c0710; }
.btn.on { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 18%, var(--panel2)); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: .82rem; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
select, input[type="search"] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 36px; padding: 0 10px; font: inherit; }
/* bench */
.bench { display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.ctl { display: grid; gap: 14px; }
.part { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--deep); }
.part .hd { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.part .hd b { display: flex; align-items: center; gap: 8px; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
.count { font: 700 1.6rem var(--mono); font-variant-numeric: tabular-nums; }
.pm { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pm .btn { min-height: 36px; padding: 0; font-family: var(--mono); }
.check { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--cyan); width: 16px; height: 16px; }
.stage { position: relative; height: 560px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(circle at 50% 50%, #120f33 0%, #06050e 75%); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .ov { position: absolute; pointer-events: none; }
.ov.tl { left: 14px; top: 12px; display: grid; gap: 2px; }
.ov.tr { right: 12px; top: 12px; pointer-events: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.ov.bl { left: 14px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; font: 600 .74rem var(--mono); color: var(--muted); }
.ov.br { right: 14px; bottom: 12px; font: 600 .72rem var(--mono); color: var(--muted); text-align: right; max-width: 55%; }
.iso { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 4px; line-height: 1; }
.iso .nums { display: grid; font: 600 .9rem var(--mono); text-align: right; gap: 6px; color: var(--muted); }
.iso .big { font: 700 3.2rem/1 var(--display); color: var(--text); text-shadow: 0 0 22px #5fd4ff55; }
.iso .chg { align-self: start; font: 700 1.1rem var(--mono); color: var(--gold); }
.ov .nm { font: 600 1rem var(--display); }
.orbtag { font: 600 .82rem var(--mono); color: var(--plus); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.msg { border-left: 3px solid var(--cyan); padding: 8px 12px; background: var(--deep); border-radius: 0 10px 10px 0; font-size: .92rem; min-height: 44px; }
.msg.exc { border-color: var(--gold); }
/* identity */
.id { display: grid; gap: 12px; }
.tilebig { --c: var(--p); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.tilebig .sq { width: 92px; height: 92px; border-radius: 14px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--deep)); display: grid; place-items: center; align-content: center; box-shadow: 0 0 24px color-mix(in srgb, var(--c) 35%, transparent); }
.tilebig .sq small { font: 600 .74rem var(--mono); color: var(--muted); }
.tilebig .sq b { font: 700 2.4rem/1 var(--display); color: var(--c); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.cfg { font: 600 .95rem/1.6 var(--mono); word-break: break-word; }
.cfg .sub { white-space: nowrap; }
table.shells { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.shells th, table.shells td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.shells td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.cap { height: 6px; border-radius: 4px; background: #ffffff12; overflow: hidden; min-width: 50px; }
.cap i { display: block; height: 100%; background: var(--cyan); }
.callout { border: 1px solid color-mix(in srgb, var(--gold) 60%, transparent); background: color-mix(in srgb, var(--gold) 10%, var(--deep)); border-radius: 12px; padding: 10px 12px; font-size: .88rem; display: grid; gap: 4px; }
.callout b { color: var(--gold); }
/* tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tabs button { background: none; border: 1px solid transparent; color: var(--muted); font: 600 .95rem var(--display); padding: 8px 14px; border-radius: 10px; cursor: pointer; letter-spacing: .02em; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--line); background: var(--panel); }
.tabp { display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
/* orbital boxes */
.boxes { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.sh { display: grid; gap: 4px; justify-items: center; }
.sh .lab { font: 700 .85rem var(--mono); }
.sh .bx { display: flex; gap: 3px; }
.ob { width: 34px; height: 38px; border-radius: 6px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--deep)); color: var(--text); font: 700 1rem var(--mono); cursor: pointer; display: grid; place-items: center; padding: 0; }
.ob.sel { box-shadow: 0 0 0 2px var(--text), 0 0 16px var(--c); }
.ob.new { animation: pop .9s ease; }
.sh.next .ob { border-style: dashed; opacity: .55; }
@keyframes pop { 0% { transform: scale(1.4); background: var(--c); } 100% { transform: scale(1); } }
.mad svg { width: 100%; max-width: 360px; height: auto; display: block; }
.explore { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 .8rem var(--mono); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
.chip.on { border-color: var(--c, var(--cyan)); background: color-mix(in srgb, var(--c, var(--cyan)) 22%, var(--panel2)); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--deep); display: grid; gap: 2px; }
.fact b { font: 700 1.3rem var(--mono); }
/* periodic table */
.pt-wrap { overflow-x: auto; padding-bottom: 4px; }
.pt { display: grid; grid-template-columns: repeat(18, minmax(40px, 1fr)); grid-template-rows: repeat(7, auto) 12px repeat(2, auto); gap: 3px; min-width: 780px; }
.el { --c: #444; aspect-ratio: 1 / 1.05; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 26%, var(--deep)); color: var(--text); cursor: pointer; display: grid; align-content: center; justify-items: center; padding: 1px; font: inherit; line-height: 1.05; }
.el b { font: 700 .95rem var(--display); }
.el small { font: 600 .55rem var(--mono); color: var(--muted); }
.el.dim { opacity: .18; }
.el.cur { box-shadow: 0 0 0 2px var(--text); }
.el:hover { filter: brightness(1.3); }
.ph { display: grid; place-items: center; font: 600 .55rem var(--mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
.lgd { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; }
.lgd span { display: flex; align-items: center; gap: 6px; }
.lgd i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.pinfo { min-height: 24px; font-size: .9rem; }
/* predict */
.pq { display: grid; gap: 8px; }
.pick2 { display: flex; gap: 8px; flex-wrap: wrap; }
.pick2 .btn.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--panel2)); }
.pick2 .btn.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel2)); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.vs .side { display: grid; gap: 8px; justify-items: center; text-align: center; }
.vs svg { width: 100%; max-width: 260px; height: auto; }
.bars { display: grid; gap: 6px; width: 100%; }
.bars div { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font: 600 .78rem var(--mono); }
.bars .tr { height: 8px; border-radius: 5px; background: #ffffff12; overflow: hidden; }
.bars .tr i { display: block; height: 100%; }
.bars .v { text-align: right; font-variant-numeric: tabular-nums; }
/* missions */
.missions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mis { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--deep); display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.mis .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--void); }
.mis.done { border-color: color-mix(in srgb, var(--good) 60%, transparent); }
.mis.done .ck { background: var(--good); border-color: var(--good); }
.mis details { margin-top: 4px; font-size: .84rem; color: var(--muted); }
.mis summary { cursor: pointer; color: var(--cyan); }
.prog { height: 10px; border-radius: 6px; background: #ffffff12; overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--s), var(--p), var(--d), var(--f)); }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(30px); opacity: 0; background: var(--panel2); border: 1px solid var(--good); padding: 10px 16px; border-radius: 10px; transition: .25s; z-index: 30; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
@media (max-width: 1180px) { .bench { grid-template-columns: 230px minmax(0, 1fr); } .bench .id { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 820px) {
  .bench, .two, .vs { grid-template-columns: minmax(0, 1fr); }
  .bench .id { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 420px; order: -1; }
  .ctl { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .missions, .facts { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="mark" aria-hidden="true"></span>Build an Atom</div>
    <div class="row"><span class="small muted">Jump to</span><select id="jump" aria-label="Jump to an element"></select></div>
  </header>

  <section class="bench">
    <div class="ctl">
      <div class="part"><div class="hd"><b><span class="dot" style="background:var(--proton)"></span>Protons</b><span class="count" id="cP">0</span></div>
        <div class="pm"><button class="btn" data-d="P,-10" aria-label="Remove 10 protons">−10</button><button class="btn" data-d="P,-1" aria-label="Remove a proton">−1</button><button class="btn" data-d="P,1" aria-label="Add a proton">+1</button><button class="btn" data-d="P,10" aria-label="Add 10 protons">+10</button></div>
        <span class="small muted">Protons set the atomic number, so they decide which element this is.</span></div>
      <div class="part"><div class="hd"><b><span class="dot" style="background:var(--neutron)"></span>Neutrons</b><span class="count" id="cN">0</span></div>
        <div class="pm"><button class="btn" data-d="N,-10" aria-label="Remove 10 neutrons">−10</button><button class="btn" data-d="N,-1" aria-label="Remove a neutron">−1</button><button class="btn" data-d="N,1" aria-label="Add a neutron">+1</button><button class="btn" data-d="N,10" aria-label="Add 10 neutrons">+10</button></div>
        <label class="check" for="autoN"><input type="checkbox" id="autoN" checked> Use the most common isotope</label></div>
      <div class="part"><div class="hd"><b><span class="dot" style="background:var(--cyan);box-shadow:0 0 8px var(--cyan)"></span>Electrons</b><span class="count" id="cE">0</span></div>
        <div class="pm"><button class="btn" data-d="E,-10" aria-label="Remove 10 electrons">−10</button><button class="btn" data-d="E,-1" aria-label="Remove an electron">−1</button><button class="btn" data-d="E,1" aria-label="Add an electron">+1</button><button class="btn" data-d="E,10" aria-label="Add 10 electrons">+10</button></div>
        <label class="check" for="autoE"><input type="checkbox" id="autoE" checked> Keep the atom neutral</label>
        <span class="small muted">Turn this off to make ions.</span></div>
      <div class="row"><button class="btn sm" id="reset">Start over with hydrogen</button></div>
    </div>

    <div style="display:grid;gap:10px;min-width:0">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="3D model of the atom" role="img"></canvas>
        <canvas id="bohr" aria-label="Enhanced Bohr diagram of the atom" role="img" hidden></canvas>
        <div class="ov tl"><div class="iso"><div class="nums"><span id="oA">1</span><span id="oZ">1</span></div><div style="display:flex;align-items:start"><span class="big" id="oS">H</span><span class="chg" id="oC"></span></div></div><span class="nm" id="oN">Hydrogen</span><span class="orbtag" id="oOrb"></span></div>
        <div class="ov tr">
          <button class="btn sm on" id="vCloud" aria-pressed="true">3D orbitals</button><button class="btn sm" id="vBohr" aria-pressed="false">Bohr+</button>
          <button class="btn sm" id="vSpin" aria-pressed="true">Rotate</button><button class="btn sm" id="vShell" aria-pressed="false">Shells</button><button class="btn sm" id="vHome">Reset view</button>
        </div>
        <div class="ov bl legend"><span><i style="background:var(--s)"></i>s</span><span><i style="background:var(--p)"></i>p</span><span><i style="background:var(--d)"></i>d</span><span><i style="background:var(--f)"></i>f</span><span><i style="background:var(--plus)"></i>+ phase</span><span><i style="background:var(--minus)"></i>− phase</span></div>
        <div class="ov br" id="oNote">Drag to rotate · scroll to zoom · nucleus enlarged about 10,000×</div>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>

    <aside class="id" id="idPanel"></aside>
  </section>

  <nav class="tabs" role="tablist" aria-label="Lab instruments">
    <button role="tab" id="t-orb" aria-selected="true" aria-controls="p-orb">Orbitals &amp; filling</button>
    <button role="tab" id="t-pt" aria-selected="false" aria-controls="p-pt">Periodic table</button>
    <button role="tab" id="t-pred" aria-selected="false" aria-controls="p-pred">Predict &amp; reveal</button>
    <button role="tab" id="t-mis" aria-selected="false" aria-controls="p-mis">Missions</button>
  </nav>
  <section class="tabp" id="p-orb" role="tabpanel" aria-labelledby="t-orb"></section>
  <section class="tabp" id="p-pt" role="tabpanel" aria-labelledby="t-pt" hidden></section>
  <section class="tabp" id="p-pred" role="tabpanel" aria-labelledby="t-pred" hidden></section>
  <section class="tabp" id="p-mis" role="tabpanel" aria-labelledby="t-mis" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../shared/elements.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const C = window.CHEM, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LCOL = ['#ff4fa8', '#ffb02e', '#3ad687', '#3f9dff'];
const sup = C.sup, EL = C.ELEMENTS, L = C.L;
const blockOf = e => e.group == null ? 'f' : (e.group <= 2 || e.Z === 2) ? 's' : e.group >= 13 ? 'p' : 'd';
const BCOL = { s: LCOL[0], p: LCOL[1], d: LCOL[2], f: LCOL[3] };
const ORB = [['s'], ['pₓ', 'p_y', 'p_z'], ['d_xy', 'd_yz', 'd_xz', 'd_x²−y²', 'd_z²'], ['f_z³', 'f_xz²', 'f_yz²', 'f_xyz', 'f_z(x²−y²)', 'f_x(x²−3y²)', 'f_y(3x²−y²)']];
const orbName = (n, l, m) => n + ORB[l][m].replace('p_y', 'p<sub>y</sub>').replace('p_z', 'p<sub>z</sub>').replace(/_(.+)$/, '<sub>$1</sub>');
const orbText = (n, l, m) => n + ORB[l][m].replace('_', '');
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3000); }

/* ═══ atom state ═══ */
const commonN = Z => Math.max(0, Math.round(EL[Z - 1].mass) - Z);
const A = { Z: 1, N: 0, E: 1, autoN: true, autoE: true, sel: null, newBox: null, view: 'cloud', spin: !REDUCE, shells: false, tab: 'orb', ptMode: 'block', ptCountry: '', viewedL: new Set() };
const cfg = () => C.config(A.Z, A.E);
const el = () => EL[A.Z - 1];
function shellsOf(c) { const m = {}; c.forEach(s => { m[s.n] = (m[s.n] || 0) + s.e; }); return m; }
function outer(c) { if (!c.length) return { n: 0, e: 0 }; const n = Math.max(...c.map(s => s.n)); return { n, e: c.filter(s => s.n === n && s.l <= 1).reduce((a, s) => a + s.e, 0) }; }

        p.setXYZ(i, vx * r, vy * r, vz * r); const c = val >= 0 ? cP : cM; colors.set([c.r, c.g, c.b], i * 3); }
      g.setAttribute('color', new T.BufferAttribute(colors, 3)); g.computeVertexNormals();
      const mat = new T.MeshPhongMaterial({ vertexColors: true, transparent: true, opacity: op, shininess: 90, specular: 0x666666, emissive: 0x150a05, side: T.DoubleSide, depthWrite: false });
      const mesh = new T.Mesh(g, mat); lobes.add(mesh);
      const glow = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: op * .25, side: T.BackSide, blending: T.AdditiveBlending, depthWrite: false })); glow.scale.setScalar(1.06); lobes.add(glow);
    };
    make(1, false, .42);
    const nodes = s.n - s.l - 1; for (let k = 1; k <= nodes; k++) make(k / (nodes + 1) * .62, k % 2 === 1, .32); /* inner regions beyond each radial node flip phase */
    if (cloud) cloud.material.opacity = .28;
  }
  function home() { const c = cfg(), maxN = c.length ? Math.max(...c.map(s => s.n)) : 1, need = Math.max(rn(maxN), A.sel ? rn(A.sel.n) * 1.1 : 0, 2.2); rot.td = need * 3.5; rot.x = .35; rot.y = .6; }
  function rebuild() { buildNucleus(); buildCloud(); buildRings(); orbital(); home(); }
  function resize() { const w = stage.clientWidth, h = stage.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  /* drag to rotate, wheel or pinch to zoom */
  let drag = null; const pts = new Map();
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (drag.pd) rot.td *= drag.pd / d; drag.pd = d; return; }
    rot.y += (e.clientX - prev[0]) * .008; rot.x = Math.max(-1.5, Math.min(1.5, rot.x + (e.clientY - prev[1]) * .008)); });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2 && drag) drag.pd = 0; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); rot.td = Math.max(2, Math.min(60, rot.td * (1 + Math.sign(e.deltaY) * .1))); }, { passive: false });
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (!document.hidden && A.view === 'cloud') {
      if (A.spin && !pts.size) rot.y += dt * .25;
      rot.d += (rot.td - rot.d) * .12;
      root.rotation.set(rot.x, rot.y, 0);
      cam.position.set(0, 0, rot.d); cam.lookAt(0, 0, 0);
      if (cloudData && !REDUCE) { /* electrons have no paths: re-sample a few positions each frame so the cloud shimmers */
        const p = cloud.geometry.attributes.position, k = Math.max(20, cloudData.N * .03 | 0);
        for (let j = 0; j < k; j++) { const i = Math.random() * cloudData.N | 0, o = cloudData.orbs[cloudData.own[i]]; samplePoint(o.n, o.l, o.m, p.array, i * 3); }
        p.needsUpdate = true; }
      if (nucleus && !REDUCE) nucleus.rotation.y += dt * .6;
      R.render(scene, cam);
    }
    requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(stage); resize(); requestAnimationFrame(frame);
  return { ok: true, rebuild, orbital, home, resize };
})();

/* ═══ Bohr+ (2D): shells as rings, electrons grouped and colored by subshell ═══ */
const B = (function () {
  const cv = $('#bohr'), g = cv.getContext('2d'); let t0 = performance.now();
  function draw() {
    if (A.view !== 'bohr') return;
    const dpr = Math.min(2, devicePixelRatio || 1), w = stage.clientWidth, h = stage.clientHeight; if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const c = cfg(), sh = shellsOf(c), ns = Object.keys(sh).map(Number), maxN = ns.length ? Math.max(...ns) : 1;
    const cx = w / 2, cy = h / 2 + 10, nucR = 30, avail = Math.min(w * .5, h / 2) - 26, step = (avail - nucR - 8) / Math.max(1, maxN);
    const tt = REDUCE ? 0 : (performance.now() - t0) / 1000;
    g.lineWidth = 1;
    for (let n = 1; n <= maxN; n++) {
      const r = nucR + 8 + step * n; g.strokeStyle = 'rgba(95,212,255,.28)'; g.setLineDash([3, 5]); g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.stroke(); g.setLineDash([]);
      const subs = c.filter(s => s.n === n), tot = subs.reduce((a, s) => a + s.e, 0); let i = 0; const spin = tt * .35 / n;
      subs.forEach(s => { for (let k = 0; k < s.e; k++, i++) { const a = -Math.PI / 2 + spin + i / Math.max(1, tot) * 6.2832; const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        g.fillStyle = LCOL[s.l]; g.shadowColor = LCOL[s.l]; g.shadowBlur = 8; g.beginPath(); g.arc(x, y, Math.max(2.6, Math.min(5.5, step / 7)), 0, 6.2832); g.fill(); g.shadowBlur = 0; } });
    }
    /* shell labels in a column on the right, on a dark backing so the rings never collide with the text */
    g.font = '600 11px "JetBrains Mono", monospace'; g.textAlign = 'left';
    const lw = 150, lh = 34, lx = w - lw - 12, ly0 = Math.max(110, cy - maxN * lh / 2);
    g.fillStyle = 'rgba(6,5,14,.72)'; g.fillRect(lx - 8, ly0 - 16, lw + 8, maxN * lh + 6);
    for (let n = 1; n <= maxN; n++) { const y = ly0 + (n - 1) * lh; let x = lx; g.fillStyle = '#a8a5d3'; g.fillText(`n = ${n} · ${sh[n] || 0} of ${2 * n * n}`, x, y);
      c.filter(s => s.n === n).forEach(s => { const txt = s.k + sup(s.e); g.fillStyle = LCOL[s.l]; g.fillText(txt, x, y + 14); x += g.measureText(txt).width + 6; }); }
    const gr = g.createRadialGradient(cx - 8, cy - 8, 2, cx, cy, nucR); gr.addColorStop(0, '#ff9aa6'); gr.addColorStop(1, '#a3233a'); g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, nucR, 0, 6.2832); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '700 12px "JetBrains Mono", monospace'; g.fillText(`${A.Z} p⁺`, cx, cy - 2); g.fillStyle = '#e3e6f5'; g.font = '600 11px "JetBrains Mono", monospace'; g.fillText(`${A.N} n⁰`, cx, cy + 13);
  }
  function loop() { if (A.view === 'bohr' && !document.hidden) draw(); requestAnimationFrame(loop); }
  if (!REDUCE) requestAnimationFrame(loop);
  new ResizeObserver(() => draw()).observe(stage);
  return { draw };
})();

/* ═══ wiring ═══ */
function setView(v) {
  if (v === 'cloud' && !G.ok) v = 'bohr';
  const was = A.view; A.view = v; $('#gl').hidden = v !== 'cloud'; $('#bohr').hidden = v !== 'bohr';
  $('#vCloud').classList.toggle('on', v === 'cloud'); $('#vBohr').classList.toggle('on', v === 'bohr'); $('#vCloud').setAttribute('aria-pressed', v === 'cloud'); $('#vBohr').setAttribute('aria-pressed', v === 'bohr');
  $('#vSpin').hidden = $('#vShell').hidden = $('#vHome').hidden = v !== 'cloud';
  $('#oNote').textContent = v === 'cloud' ? 'Drag to rotate · scroll to zoom · nucleus enlarged about 10,000×' : 'Enhanced Bohr model: rings are shells, dots are electrons colored by subshell';
  if (was !== v) { G.orbital(); overlay(); if (v === 'bohr') B.draw(); }
}
$$('[data-d]').forEach(b => b.onclick = () => { const [k, d] = b.dataset.d.split(','); change(k, +d); });
$('#autoN').onchange = ev => { A.autoN = ev.target.checked; if (A.autoN) { A.N = commonN(A.Z); update(); } };
$('#autoE').onchange = ev => { A.autoE = ev.target.checked; if (A.autoE) { A.E = A.Z; pickDefaultOrbital(true); update(); } };
$('#reset').onclick = () => load(1);
$('#vCloud').onclick = () => setView('cloud'); $('#vBohr').onclick = () => setView('bohr');
$('#vSpin').onclick = () => { A.spin = !A.spin; $('#vSpin').classList.toggle('on', A.spin); $('#vSpin').setAttribute('aria-pressed', A.spin); };
$('#vShell').onclick = () => { A.shells = !A.shells; $('#vShell').classList.toggle('on', A.shells); $('#vShell').setAttribute('aria-pressed', A.shells); G.rebuild(); };
$('#vHome').onclick = () => G.home();
$('#vSpin').classList.toggle('on', A.spin); $('#vSpin').setAttribute('aria-pressed', A.spin);
$('#jump').innerHTML = EL.map(e => `<option value="${e.Z}">${e.Z} · ${e.sym} · ${esc(e.name)}</option>`).join('');
$('#jump').onchange = ev => load(+ev.target.value);
if (!G.ok) { setView('bohr'); $('#vCloud').disabled = true; $('#vCloud').title = 'The 3D view could not load on this device'; }

/* open on oxygen so the first view shows a p orbital with paired and unpaired electrons */
A.Z = 8; A.N = 8; A.E = 8; A.sel = { n: 2, l: 1, m: 2 }; A.viewedL.add(1);
$('#msg').textContent = 'This is oxygen: 8 protons, 8 neutrons, 8 electrons. Add or remove particles on the left, click any orbital box below to see its shape, or pick an element from the periodic table.';
update();
A.ready = true; /* missions count only what the student does, not the opening atom */
})();
