<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene Detectives</title>
<meta name="description" content="CSI-style genetics formative assessment game for high school biology: blood typing, DNA base pairing, gel electrophoresis, and Punnett squares.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c;--bg2:#0e1628;--panel:#131d33;--panel2:#1a2742;--line:#283b62;
  --text:#e8eef9;--muted:#9fb0cf;--accent:#3ee6c4;--accent-ink:#03231c;--accent2:#7c9cff;
  --tape:#ffd23f;--bad:#ff6b81;--good:#4ade80;--warn:#fbbf24;--blood:#c81d3a;
  --radius:16px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);line-height:1.5;
  background:radial-gradient(900px 500px at 85% -10%,#18305c 0%,transparent 60%),radial-gradient(700px 400px at -10% 110%,#0f3a3a 0%,transparent 60%),var(--bg);}
a{color:var(--accent)}
.tape{height:26px;background:repeating-linear-gradient(-45deg,var(--tape) 0 20px,#0d0d0d 20px 40px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tape span{background:var(--tape);color:#111;font:700 .72rem var(--mono);letter-spacing:.22em;padding:2px 14px;white-space:nowrap}
#turnbar:empty{display:none}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 18px;background:rgba(10,15,28,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.03em;cursor:pointer;background:none;border:0;color:var(--text);font-size:1.05rem;padding:0}
.logo b{color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 .78rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill strong{color:var(--text)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font:600 .8rem var(--sans);cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
.turnbar{margin:8px -18px -10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:rgba(14,22,40,.95);border-bottom:1px solid var(--line)}
.tchip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:2px solid transparent;background:var(--panel);font-weight:600;font-size:.9rem;transition:all .2s}
.tchip .dot{width:10px;height:10px;border-radius:50%}
.tchip .sc{font-family:var(--mono);color:var(--muted)}
.tchip.active{transform:scale(1.06);box-shadow:0 0 0 3px rgba(62,230,196,.15)}
.tchip.active::before{content:'▶';font-size:.7rem}
main{max-width:1180px;margin:0 auto;padding:26px 16px 90px}
button{font:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:12px 20px;border-radius:12px;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s,opacity .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.warn{background:var(--tape);color:#1a1300}
.btn.small{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.row{display:flex;align-items:center;flex-wrap:wrap}
.gap{gap:10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{line-height:1.15;margin:.2em 0 .4em}
h2{font-size:1.7rem}
.sec{margin-top:28px;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:20px}

/* HOME */
.hero{text-align:center;padding:30px 0 10px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-.02em;margin:.15em 0}
.hero h1 span{color:var(--accent);text-shadow:0 0 28px rgba(62,230,196,.45)}
.lead{max-width:640px;margin:0 auto 26px;color:var(--muted);font-size:1.1rem}
.badge{display:inline-block;font:700 .72rem var(--mono);letter-spacing:.2em;padding:6px 12px;border:1px dashed var(--tape);color:var(--tape);border-radius:6px}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:760px;margin:0 auto}
.mode{text-align:left;cursor:pointer;color:var(--text);background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:22px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--accent)}
.mode .big{font-size:2rem}
.mode h3{margin:8px 0 4px;font-size:1.25rem}
.mode p{margin:0;color:var(--muted);font-size:.95rem}
.skills-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
.skills-strip span{font:600 .8rem var(--mono);padding:6px 12px;border-radius:999px;background:rgba(62,230,196,.08);border:1px solid rgba(62,230,196,.3);color:var(--accent)}
details.how{max-width:760px;margin:24px auto 0;text-align:left}
details.how summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--muted)}
details.how ol{margin:0;padding-left:22px;color:var(--muted)}
details.how li{margin:6px 0}

/* SETUP */
.setup{max-width:620px;margin:0 auto}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input.tx,select.tx{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input.tx:focus,select.tx:focus{outline:2px solid var(--accent);outline-offset:1px}
.team-row{display:flex;gap:10px;align-items:center;margin:8px 0}
.team-row .dot{width:16px;height:16px;border-radius:50%;flex:none}
.countbtns{display:flex;gap:8px;flex-wrap:wrap}
.countbtns button{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:700;cursor:pointer}
.countbtns button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* CASES */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.case-card{cursor:pointer;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:0;overflow:hidden;background:var(--panel);transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.case-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.case-card .top{padding:18px 18px 12px;background:linear-gradient(135deg,rgba(124,156,255,.16),rgba(62,230,196,.08));border-bottom:1px dashed var(--line);position:relative}
.case-card .top .ico{font-size:2.2rem}
.case-card .stamp{position:absolute;right:14px;top:14px;font:700 .68rem var(--mono);letter-spacing:.14em;color:var(--bad);border:2px solid var(--bad);padding:2px 8px;border-radius:4px;transform:rotate(6deg);opacity:.8}
.case-card h3{margin:6px 0 2px}
.case-card .body{padding:14px 18px 18px;color:var(--muted);font-size:.93rem;flex:1}
.codebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.codebox input{max-width:200px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}

/* BRIEF */
.dossier{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:820px){.dossier{grid-template-columns:1fr}}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font:600 .82rem var(--mono);color:var(--muted);margin:6px 0 12px}
.story{font-size:1.08rem}
.mission li{margin:6px 0}

/* SUSPECTS */
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.sus{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);transition:opacity .3s,filter .3s}
.sus .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--mono);color:#0a0f1c}
.sus .nm{font-weight:700;margin-top:8px}
.sus .rl{color:var(--muted);font-size:.85rem}
.sus .al{color:var(--muted);font-size:.82rem;margin-top:6px;font-style:italic}
.sus .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.sus .tag{font:600 .7rem var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,107,129,.12);color:var(--bad);border:1px solid rgba(255,107,129,.35)}
.sus .tag.ok{background:rgba(62,230,196,.1);color:var(--accent);border-color:rgba(62,230,196,.35)}
.sus.out{opacity:.5;filter:grayscale(.8)}
.sus.out::after{content:'EXCLUDED';position:absolute;right:10px;top:12px;font:700 .68rem var(--mono);letter-spacing:.12em;color:var(--bad);border:2px solid var(--bad);padding:1px 6px;border-radius:4px;transform:rotate(8deg)}
.sus.guilty{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,107,129,.25)}
.sus.guilty::after{content:'GUILTY';position:absolute;right:10px;top:12px;font:700 .8rem var(--mono);letter-spacing:.12em;color:#fff;background:var(--bad);padding:2px 8px;border-radius:4px;transform:rotate(8deg)}
.sus.pickable{cursor:pointer}
.sus.pickable:hover{border-color:var(--accent)}
.sus.picked{border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,230,196,.3)}

/* BOARD */
.board-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.progress{height:10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow:hidden;margin:16px 0 6px}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.stn{cursor:pointer;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));transition:transform .15s,border-color .15s}
.stn:hover{transform:translateY(-3px);border-color:var(--accent)}
.stn .ico{font-size:2rem}
.stn h3{margin:8px 0 2px}
.stn .st{font:600 .75rem var(--mono);margin-top:10px;display:flex;gap:6px;align-items:center}
.stn .dots{display:flex;gap:4px;margin-top:8px}
.stn .dots i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.stn .dots i.g{background:var(--good)}.stn .dots i.r{background:var(--warn)}
.stn.done{border-color:rgba(74,222,128,.5)}

/* STATION */
.station-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.station-head h2{margin:.1em 0}
.intro{background:rgba(124,156,255,.08);border-left:3px solid var(--accent2);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.step{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin:16px 0;overflow:hidden}
.step-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.step-h .t{display:flex;align-items:center;gap:10px;font-weight:700}
.step-h .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font:700 .85rem var(--mono)}
.step.ok .step-h .n{background:var(--good);color:#032;border-color:var(--good)}
.step.rev .step-h .n{background:var(--warn);color:#2a1a00;border-color:var(--warn)}
.step-b{padding:18px 16px}
.step.locked .step-b{color:var(--muted);font-style:italic}
.ptchip{font:600 .75rem var(--mono);color:var(--muted)}
.q{font-size:1.12rem;font-weight:600;margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);cursor:pointer;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{font:700 .8rem var(--mono);width:24px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--panel2)}
.opt.wrong{border-color:var(--bad);opacity:.55;text-decoration:line-through}
.opt.right{border-color:var(--good);background:rgba(74,222,128,.1)}
.opt:disabled{cursor:default}
.why{margin:14px 0 0;color:var(--muted)}
.msg{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:600}
.msg.good{background:rgba(74,222,128,.12);color:var(--good);border:1px solid rgba(74,222,128,.35)}
.msg.bad{background:rgba(255,107,129,.1);color:var(--bad);border:1px solid rgba(255,107,129,.35)}
.hintbox{margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(251,191,36,.1);border:1px dashed var(--warn);color:#fde68a}
.reveal{margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:var(--warn);font-weight:600}
.submit-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}

/* BLOOD */
.wells{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:4px 0 20px;padding:16px;background:#0b1222;border-radius:14px;border:1px solid var(--line)}
.well{text-align:center}
.well .lb{font:700 .85rem var(--mono);margin-top:4px}
.typegrid{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:8px;max-width:440px}
.tbtn{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:700 1.05rem var(--mono);cursor:pointer}
.tbtn.sel{border-color:var(--accent);background:rgba(62,230,196,.14)}
.tbtn.right{border-color:var(--good);background:rgba(74,222,128,.16)}
.tbtn:disabled{cursor:default}

/* DNA */
.seqbox{background:#0b1222;border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.seqlabel{font:600 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0}
.seq{font:700 1.25rem var(--mono);letter-spacing:.12em;white-space:nowrap}
.seqin{font:700 1.2rem var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--accent);width:min(100%,420px)}
.seqin:focus{outline:2px solid var(--accent)}
.align{display:grid;grid-template-columns:40px repeat(12,30px) 40px;gap:4px;margin-top:12px;font:700 1rem var(--mono);align-items:center}
.align div{height:32px;display:grid;place-items:center;border-radius:6px}
.align .b{background:var(--panel2)}
.align .e{border:1px dashed var(--line);color:var(--accent)}
.align .end{color:var(--muted);font-size:.8rem}
.base-A{color:#f87171}.base-T{color:#fbbf24}.base-C{color:#60a5fa}.base-G{color:#4ade80}
.dbtable{width:100%;border-collapse:collapse;margin-bottom:14px}
.dbtable td,.dbtable th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.dbtable th{font:600 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dbtable .mono{font:600 1rem var(--mono);letter-spacing:.08em;white-space:nowrap}

/* GEL */
.gelwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.gelwrap svg{max-width:100%;height:auto;border-radius:12px}
.gelopts{display:flex;gap:8px;flex-wrap:wrap}
.legend{font-size:.9rem;color:var(--muted)}
.legend b{font-family:var(--mono);color:var(--text)}

/* PUNNETT */
.punnett{display:grid;grid-template-columns:70px repeat(2,90px);grid-template-rows:56px repeat(2,90px);gap:6px;margin:6px 0 16px}
.punnett .g{display:grid;place-items:center;font:700 1.3rem var(--mono);color:var(--accent2);background:rgba(124,156,255,.08);border-radius:10px}
.punnett .corner{font:600 .7rem var(--mono);color:var(--muted);text-align:center;display:grid;place-items:center}
.pcell{border-radius:12px;border:2px dashed var(--line);background:var(--bg2);color:var(--text);font:700 1.4rem var(--mono);cursor:pointer}
.pcell:hover:not(:disabled){border-color:var(--accent)}
.pcell.filled{border-style:solid;border-color:var(--accent2)}
.pcell.rec{background:rgba(255,107,129,.12)}
.pcell:disabled{cursor:default}
.probs{display:flex;gap:8px;flex-wrap:wrap}

/* EXCLUSION */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--text);cursor:pointer;font-weight:600}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .72rem var(--mono);color:#0a0f1c}
.chip.sel{border-color:var(--bad);background:rgba(255,107,129,.12)}
.chip.sel::after{content:'✕';color:var(--bad);font-weight:800}
.chip:disabled{cursor:default}
.done-row{display:flex;justify-content:center;margin-top:24px}

/* ACCUSE + RESULTS */
.center{text-align:center}
.handoff{max-width:560px;margin:40px auto;text-align:center}
.handoff .lock{font-size:3.5rem}
.scoreboard{display:grid;gap:10px;margin:16px 0}
.sb-row{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.sb-row .rk{font:700 1.2rem var(--mono);color:var(--muted)}
.sb-row.first{border-color:var(--tape);box-shadow:0 0 0 2px rgba(255,210,63,.2)}
.sb-row .pts{font:700 1.2rem var(--mono)}
.mastery{width:100%;border-collapse:collapse;font-size:.92rem}
.mastery th,.mastery td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.mastery th{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px;min-width:80px}
.bar i{display:block;height:100%}
.tablewrap{overflow-x:auto}
.evtable td{padding:8px 10px;border-bottom:1px solid var(--line)}

/* MODAL / TOAST */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.75);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:40px 14px;overflow-y:auto}
.modal.hidden{display:none}
.modal-card{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative}
.modal-card .x{position:absolute;right:14px;top:12px}
.keyt{width:100%;border-collapse:collapse;font-size:.92rem}
.keyt td,.keyt th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.keyt th{color:var(--muted);font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:70;padding:12px 20px;border-radius:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.codes{font:600 1rem var(--mono);display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.codes span{padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
@media print{.tape,header.top,.turnbar,.noprint{display:none!important}body{background:#fff;color:#000}.card,.sb-row{background:#fff;border-color:#bbb}}
@media (max-width:560px){h2{font-size:1.35rem}.align{grid-template-columns:30px repeat(12,22px) 30px;font-size:.85rem}.punnett{grid-template-columns:56px repeat(2,74px);grid-template-rows:48px repeat(2,74px)}}
</style>
</head>
<body>

/* ---------------- Seeded randomness (same code = same case for everyone) ---------------- */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^(h>>>16))>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rngFor = code => mulberry32(hashStr(code.toUpperCase()));
const pick = (r,a) => a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const COMP = {A:'T',T:'A',C:'G',G:'C'};
const comp = s => s.split('').map(b=>COMP[b]).join('');
const fmt = s => (s.match(/.{1,3}/g)||[]).join(' ');
const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function h(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------------- Case generation ---------------- */
function pickMCQ(r,topic){
  const e = pick(r,BANK[topic]);
  const opts = shuffle(r, e.a.map((t,i)=>({t, ok:i===0})));
  return {q:e.q, opts, ans:opts.findIndex(o=>o.ok), hint:e.hint, why:e.why};
}
function wellDots(r,clump){
  const d=[];
  if(clump){
    const n=5+Math.floor(r()*3);
    for(let c=0;c<n;c++){const a=r()*6.283,rad=8+r()*30,cx=Math.cos(a)*rad,cy=Math.sin(a)*rad;
      for(let k=0;k<11;k++) d.push([cx+(r()-.5)*15, cy+(r()-.5)*15, 2.4+r()*1.8]);}
  } else {
    for(let k=0;k<90;k++){const a=r()*6.283,rad=Math.sqrt(r())*44;d.push([Math.cos(a)*rad,Math.sin(a)*rad,1.5]);}
  }
  return d;
}
function genBlood(r,S,c,ex){
  const scene = pick(r,TYPES), others = TYPES.filter(t=>t!==scene);
  S.forEach(s=>{ s.blood = s.id===ex ? pick(r,others) : s.id===c ? scene : (r()<0.65 ? scene : pick(r,others)); });
  const wells = {A:scene.startsWith('A'), B:scene.includes('B'), Rh:scene.endsWith('+')};
  return { scene, wells, dots:{A:wellDots(r,wells.A),B:wellDots(r,wells.B),Rh:wellDots(r,wells.Rh)},
           excluded:S.filter(s=>s.blood!==scene).map(s=>s.id), mcq:pickMCQ(r,'blood') };
}
function mutate(r,seq,n){
  const arr=seq.split(''); shuffle(r,[...arr.keys()]).slice(0,n).forEach(i=>{arr[i]=pick(r,'ATCG'.split('').filter(b=>b!==arr[i]));});
  return arr.join('');
}
function genDNA(r,S,c,ex){
  let answer=''; for(let i=0;i<12;i++) answer+=pick(r,['A','T','C','G']);
  const recovered = comp(answer); // shown 5'→3'; student builds answer 3'→5'
  S.forEach(s=>{ s.seq = s.id===ex ? mutate(r,answer,1+(r()<0.5?1:0)) : s.id===c ? answer : (r()<0.7 ? answer : mutate(r,answer,1)); });
  return { recovered, answer, excluded:S.filter(s=>s.seq!==answer).map(s=>s.id), mcq:pickMCQ(r,'dna') };
}
function genGel(r,S,c,ex){
  const pool=[900,800,700,600,500,400,300,200];
  const scene = shuffle(r,pool).slice(0,3).sort((a,b)=>b-a);
  const extras = pool.filter(x=>!scene.includes(x)).concat([150,250,350,450,550,650,750,850]);
  S.forEach(s=>{
    let bands;
    if(s.id===ex || (s.id!==c && r()<0.3)) bands = shuffle(r,scene).slice(0,2).concat(shuffle(r,extras).slice(0,2));
    else bands = scene.concat(shuffle(r,extras).slice(0, s.id===c ? 1 : 1+Math.floor(r()*2)));
    s.bands = [...new Set(bands)].sort((a,b)=>b-a);
  });
  const target = pick(r,scene);
  const near = LADDER.filter(x=>x!==target).sort((a,b)=>Math.abs(a-target)-Math.abs(b-target)).slice(0,3);
  return { scene, target, options:shuffle(r,[target,...near]),
           excluded:S.filter(s=>!scene.every(b=>s.bands.includes(b))).map(s=>s.id), mcq:pickMCQ(r,'gel') };
}
function punnettOf(p1,p2){
  const top=[p1[0],p1[1]], side=[p2[0],p2[1]], cells=[];
  side.forEach(a=>top.forEach(b=>{ cells.push(a===a.toUpperCase() ? a+b : (b===b.toUpperCase() ? b+a : a+b)); }));
  return {top, side, cells, prob: cells.filter(x=>x==='kk').length*25};
}
function genPunnett(r,S,c,ex){
  const OK=[['Kk','Kk'],['Kk','kk'],['kk','Kk'],['kk','kk']], NO=[['KK','Kk'],['Kk','KK'],['KK','kk'],['kk','KK'],['KK','KK']];
  S.forEach(s=>{ s.parents = s.id===ex ? pick(r,NO) : s.id===c ? pick(r,OK) : (r()<0.75 ? pick(r,OK) : pick(r,NO)); });
  const het = S.filter(s=>s.parents.includes('Kk'));
  const f = het.length ? pick(r,het) : pick(r,S);
  return { featured:{id:f.id, p1:f.parents[0], p2:f.parents[1], ...punnettOf(f.parents[0],f.parents[1])},
           excluded:S.filter(s=>!s.parents.every(p=>p.includes('k'))).map(s=>s.id), mcq:pickMCQ(r,'punnett') };
}
function buildCase(code){
  code = String(code||'').trim().toUpperCase();
  const m = code.match(/^([A-Z]{2})-(\d{4})$/); if(!m) return null;
  const tpl = CASES.find(c=>c.id===m[1]); if(!tpl) return null;
  const r = rngFor(code);
  const names = shuffle(r,NAMES).slice(0,5), roles = shuffle(r,tpl.roles);
  const suspects = names.map((n,i)=>({id:i, name:n, role:roles[i].role, alibi:roles[i].alibi, color:SUS_COLORS[i]}));
  const culprit = Math.floor(r()*5);
  const decoys = shuffle(r,[0,1,2,3,4].filter(i=>i!==culprit));
  // each station is guaranteed to rule out one specific decoy → all 4 stations are needed
  const st = { blood:genBlood(r,suspects,culprit,decoys[0]), dna:genDNA(r,suspects,culprit,decoys[1]),
               gel:genGel(r,suspects,culprit,decoys[2]), punnett:genPunnett(r,suspects,culprit,decoys[3]) };
  return {code, tpl, suspects, culprit, st};
}

function startGame(code){
  const g = buildCase(code); if(!g) return false;
  S.game=g; S.items={};

    S.items[st+'.'+sp]={attempts:0,resolved:false,correct:false,revealed:false,hint:false,wrong:[],msg:null,points:0,by:null};
  }));
  S.ui={ blood:{sel:null}, dna:{val:''}, gel:{sel:null}, punnett:{cells:['','','',''],prob:null}, ex:{blood:[],dna:[],gel:[],punnett:[]} };
  const names = S.mode==='solo' ? [S.setup.solo.trim()||'Detective'] : S.setup.names.slice(0,S.setup.count).map((n,i)=>n.trim()||TEAM_NAMES[i]);
  S.players = names.map((n,i)=>({name:n, color:S.mode==='solo'?'#3ee6c4':TEAM_COLORS[i], score:0, log:[], hints:0, vote:null}));
  S.turn=0; S.start=Date.now(); S.end=0; S.acc=null; S.station=null; S.screen='brief';
  return true;
}
const cur = () => S.players[S.turn];
const stationDone = st => S.items[st+'.ex'].resolved;
const isExcluded = sid => ORDER.some(st=>stationDone(st) && S.game.st[st].excluded.includes(sid));

/* ---------------- Grading ---------------- */
function attempt(id, ok, msg){
  const it=S.items[id]; if(it.resolved) return;
  const [st,step]=id.split('.');
  it.attempts++;
  const p=cur(), skill = step==='ex' ? 'reason' : st;
  let pts=0;
  if(ok){
    pts=Math.round(BASE[step]*DECAY[it.attempts-1]);
    Object.assign(it,{resolved:true,correct:true,by:p.name,points:pts});
    p.score+=pts;
    it.msg={type:'good', text:`✔ Correct! +${pts}${S.mode==='team'?' for '+h(p.name):''}`};
    toast(`+${pts} ${S.mode==='team'?p.name:''}`,'good');
  } else {
    let t = msg || 'Not quite.';
    if(it.attempts>=MAX_TRIES){ it.resolved=true; it.revealed=true; t+=' No tries left—the answer is revealed below.'; }
    else if(S.mode==='team'){ const nx=S.players[(S.turn+1)%S.players.length]; t+=` ⚡ Steal chance: ${h(nx.name)} for ${Math.round(BASE[step]*DECAY[it.attempts])} pts!`; }
    else t+=` Try again for ${Math.round(BASE[step]*DECAY[it.attempts])} pts.`;
    it.msg={type:'bad', text:t};
    toast('✕ Not quite','bad');
  }
  p.log.push({item:id, skill, ok, attempt:it.attempts, pts});
  if(S.mode==='team') S.turn=(S.turn+1)%S.players.length;
  if(it.resolved){ const nxt={mcq:'lab',lab:'ex'}[step]; S.scrollTo = nxt ? `step-${st}-${nxt}` : 'stationDone'; }
  render();
}
function checkLab(st){
  const g=S.game, d=g.st[st], u=S.ui;
  if(st==='blood'){
    const s=u.blood.sel; if(s===d.scene) return [true];
    const has={A:s.startsWith('A'),B:s.includes('B'),Rh:s.endsWith('+')};
    const off=['A','B','Rh'].filter(k=>has[k]!==d.wells[k]).map(k=>'Anti-'+k);
    return [false, `${s} doesn’t match the wells. Look again at the ${off.join(' and ')} well${off.length>1?'s':''}.`];
  }
  if(st==='dna'){
    const v=u.dna.val;
    if(v.length!==12) return [false, `Your strand has ${v.length} bases, but the recovered strand has 12.`];
    const n=[...v].filter((b,i)=>b===d.answer[i]).length;
    return [n===12, `${n} of 12 bases are correct.`];
  }
  if(st==='gel'){
    const s=u.gel.sel; if(s===d.target) return [true];
    return [false, s>d.target ? `${s} bp is too large—the ★ band traveled farther (lower) than that.` : `${s} bp is too small—the ★ band didn’t travel that far.`];
  }
  if(st==='punnett'){
    const f=d.featured, n=u.punnett.cells.filter((c,i)=>c===f.cells[i]).length, pOk=u.punnett.prob===f.prob;
    return [n===4&&pOk, `${n} of 4 boxes correct; probability is ${pOk?'correct':'not correct'}.`];
  }
}
function checkEx(st){
  const want=S.game.st[st].excluded, got=S.ui.ex[st];
  const extra=got.filter(i=>!want.includes(i)).length, miss=want.filter(i=>!got.includes(i)).length;
  if(!extra&&!miss) return [true];
  const parts=[]; if(extra) parts.push(`you excluded ${extra} suspect${extra>1?'s':''} the evidence does NOT rule out`); if(miss) parts.push(`you missed ${miss} suspect${miss>1?'s':''} who should be excluded`);
  return [false, parts.join(', and ').replace(/^./,c=>c.toUpperCase())+'.'];
}

/* ---------------- Actions ---------------- */
const act = {
  home(){ if(S.game && !S.end && S.screen!=='home' && !confirm('Leave this case? Progress will be lost.')) return; S.game=null; S.screen='home'; render(); },
  mode(m){ S.mode=m; S.screen='setup'; render(); },
  setSolo(v){ S.setup.solo=v; },
  setCount(n){ S.setup.count=n; render(); },
  setName(i,v){ S.setup.names[i]=v; },
  toCases(){ S.screen='cases'; render(); },
  pickCase(id){ startGame(newCode(id)); render(); window.scrollTo(0,0); },
  enterCode(){ const v=document.getElementById('codeIn').value; if(!startGame(v)){ toast('That case code isn’t valid (example: GH-4821)','bad'); return;} render(); window.scrollTo(0,0); },
  go(scr){ S.screen=scr; render(); window.scrollTo(0,0); },
  openStation(st){ S.station=st; S.screen='station'; render(); window.scrollTo(0,0); },
  mcq(st,i){ const id=st+'.mcq', q=S.game.st[st].mcq, it=S.items[id];
    if(it.resolved||it.wrong.includes(i)) return;
    if(i!==q.ans) it.wrong.push(i);
    attempt(id, i===q.ans, 'That’s not it.'); },
  bloodSel(t){ S.ui.blood.sel=t; render(); },
  gelSel(v){ S.ui.gel.sel=v; render(); },
  cell(i){ const seq=['KK','Kk','kk'], c=S.ui.punnett.cells; c[i]=seq[(seq.indexOf(c[i])+1)%3]; render(); },
  prob(p){ S.ui.punnett.prob=p; render(); },
  dnaInput(el){ const v=el.value.toUpperCase().replace(/[^ATCG]/g,'').slice(0,12); if(el.value!==v) el.value=v; S.ui.dna.val=v;
    document.getElementById('dnaLive').innerHTML=dnaAlign(); const b=document.getElementById('dnaSubmit'); if(b) b.disabled=!v.length; },
  labSubmit(st){ const [ok,msg]=checkLab(st); attempt(st+'.lab', ok, msg); },
  exToggle(st,id){ const a=S.ui.ex[st], k=a.indexOf(id); k>=0?a.splice(k,1):a.push(id); render(); },
  exSubmit(st){ const [ok,msg]=checkEx(st); attempt(st+'.ex', ok, msg); },
  hint(id){ const it=S.items[id]; if(it.hint||it.resolved) return; it.hint=true; const p=cur(); p.score-=HINT_COST; p.hints++; toast(`Hint used: −${HINT_COST} ${S.mode==='team'?p.name:''}`,'bad'); render(); },
  toAccuse(){ S.acc={i:0, sel:null, phase:'pick'}; S.screen='accuse'; render(); window.scrollTo(0,0); },
  accSel(id){ S.acc.sel=id; render(); },
  lockVote(){ const a=S.acc; if(a.sel===null) return; S.players[a.i].vote=a.sel; a.i++; a.sel=null;
    if(a.i<S.players.length){ a.phase='handoff'; render(); } else finish(); },
  ready(){ S.acc.phase='pick'; render(); window.scrollTo(0,0); },
  replay(){ startGame(newCode(S.game.tpl.id)); render(); window.scrollTo(0,0); },
  otherCase(){ S.game=null; S.screen='cases'; render(); },
  copyReport(){ copyText(fullReport()); },
  csv(){ downloadCSV(); },
  scale(){ S.scale=(S.scale+1)%3; document.documentElement.style.fontSize=[16,18,20][S.scale]+'px'; },
  teacher(){ openTeacher(); },
  closeModal(){ document.getElementById('modal').classList.add('hidden'); },
  pin(){ if(document.getElementById('pinIn').value===TEACHER_PIN){ S.teacherOK=true; openTeacher(); } else toast('Wrong PIN','bad'); },
  keyLoad(){ S.keyCode=document.getElementById('keyIn').value.trim().toUpperCase(); openTeacher(); },
  genCodes(){ const id=document.getElementById('genCase').value, n=+document.getElementById('genN').value||6;
    const set=new Set(); while(set.size<n) set.add(newCode(id));
    document.getElementById('codesOut').innerHTML=[...set].map(c=>`<span>${c}</span>`).join(''); }
};
function finish(){
  const g=S.game;
  S.players.forEach(p=>{ const ok=p.vote===g.culprit, pts=ok?ACCUSE_RIGHT:ACCUSE_WRONG; p.score+=pts; p.log.push({item:'accuse',skill:'reason',ok,attempt:1,pts}); });
  S.end=Date.now(); S.screen='result'; render(); window.scrollTo(0,0);
}

function wellSVG(dots,clump,label){
  return `<div class="well"><svg width="128" height="128" viewBox="-64 -64 128 128" aria-label="${label} well">
    <defs><radialGradient id="wg${label}" cx="50%" cy="40%"><stop offset="0%" stop-color="${clump?'#f7dfe3':'#e8a3ad'}"/><stop offset="100%" stop-color="${clump?'#e9c6cc':'#cf6b7b'}"/></radialGradient></defs>

  </svg><div class="lb">${label}</div></div>`;
}
const gelY = size => 52 + Math.log10(1000/size)*300;
function gelSVG(lanes){
  const W=70+lanes.length*66, H=410;
  const x0=70;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Gel electrophoresis">
  <defs><linearGradient id="gelbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14204a"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
  <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="${x0-8}" y="8" width="${W-x0}" height="${H-16}" rx="10" fill="url(#gelbg)" stroke="#2c3f6e"/>
  <text x="${x0-14}" y="26" fill="#9fb0cf" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" text-anchor="end">−</text>
  <text x="${x0-14}" y="${H-14}" fill="#ff6b81" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" text-anchor="end">+</text>`;
  LADDER.forEach(sz=>{ s+=`<text x="${x0-14}" y="${gelY(sz)+4}" fill="#9fb0cf" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" text-anchor="end">${sz}</text>`; });
  lanes.forEach((ln,i)=>{
    const cx=x0+26+i*66;
    s+=`<rect x="${cx-22}" y="22" width="44" height="9" rx="2" fill="#070b18" stroke="#2c3f6e"/>`;
    s+=`<text x="${cx}" y="${H-22}" fill="${ln.color||'#e8eef9'}" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">${h(ln.label)}</text>`;
    ln.bands.forEach(b=>{
      const y=gelY(b), col= ln.ladder ? '#7c9cff' : (ln.color||'#3ee6c4');
      s+=`<rect x="${cx-21}" y="${y-3}" width="42" height="6" rx="2" fill="${col}" opacity="${ln.ladder?.75:.95}" filter="url(#glow)"/>`;
      if(ln.star===b) s+=`<text x="${cx+26}" y="${y+6}" fill="#ffd23f" font-size="18">★</text>`;
    });
  });
  return s+'</svg>';
}
function dnaAlign(){
  const d=S.game.st.dna, v=S.ui.dna.val;
  let top='<div class="end">5′</div>'+[...d.recovered].map(b=>`<div class="b base-${b}">${b}</div>`).join('')+'<div class="end">3′</div>';
  let bot='<div class="end">3′</div>'+Array.from({length:12},(_,i)=>`<div class="e ${v[i]?'base-'+v[i]:''}">${v[i]||''}</div>`).join('')+'<div class="end">5′</div>';
  return `<div class="align">${top}${bot}</div><div class="muted small" style="margin-top:6px">${v.length}/12 bases</div>`;
}

    body=`<div class="gelwrap"><div>${gelSVG([{label:'Ladder',bands:LADDER,ladder:true},{label:'Scene',bands:d.scene,star:d.target,color:'#3ee6c4'}])}</div>
      <div style="flex:1;min-width:240px"><p class="q">What is the size of the scene band marked ★?</p>
      <div class="gelopts">${d.options.map(o=>`<button class="tbtn ${sel===o?'sel':''} ${R&&o===d.target?'right':''}" style="padding:10px 14px" ${R?'disabled':''} onclick="act.gelSel(${o})">${o} bp</button>`).join('')}</div>
      ${!R?`<div class="submit-row"><button class="btn" ${sel?'':'disabled'} onclick="act.labSubmit('gel')">Submit reading</button></div>`:''}
      ${it.revealed?`<div class="reveal">Answer: ${d.target} bp</div>`:''}</div></div>`;
  }
  if(st==='punnett'){
    const f=d.featured, s=g.suspects[f.id], u=S.ui.punnett, cells=R?f.cells:u.cells;
    body=`<p class="q">Complete the Punnett square for <span style="color:${s.color}">${h(s.name)}</span>’s parents (${f.p1} × ${f.p2}), then choose the probability of a <b>kk</b> child.</p>
      <p class="muted small">Click a box to cycle: KK → Kk → kk.</p>
      <div class="row" style="gap:28px;align-items:flex-start">
      <div class="punnett"><div class="corner">P2 ↓<br>P1 →</div>${f.top.map(a=>`<div class="g">${a}</div>`).join('')}
        ${[0,1].map(r=>`<div class="g">${f.side[r]}</div>${[0,1].map(c=>{const i=r*2+c,v=cells[i];return `<button class="pcell ${v?'filled':''} ${v==='kk'?'rec':''}" ${R?'disabled':''} onclick="act.cell(${i})">${v||'?'}</button>`;}).join('')}`).join('')}</div>
      <div><p style="margin:0 0 8px;font-weight:600">Probability of kk:</p>
        <div class="probs">${[0,25,50,75,100].map(p=>`<button class="tbtn ${(R?f.prob:u.prob)===p?(R?'right':'sel'):''}" style="padding:10px 14px" ${R?'disabled':''} onclick="act.prob(${p})">${p}%</button>`).join('')}</div></div></div>
      ${!R?`<div class="submit-row"><button class="btn" ${u.cells.every(Boolean)&&u.prob!==null?'':'disabled'} onclick="act.labSubmit('punnett')">Submit Punnett square</button></div>`:''}
      ${it.revealed?`<div class="reveal">Answer: ${f.cells.join(', ')} → ${f.prob}% chance of kk</div>`:''}`;
  }
  return stepWrap(st,'lab',2,'Lab Analysis',locked,body);
}
function stepEx(st){
  const g=S.game, d=g.st[st], it=S.items[st+'.ex'], locked=!S.items[st+'.lab'].resolved, R=it.resolved;
  const P={blood:'Medical records show each suspect’s blood type. Select every suspect the blood evidence EXCLUDES.',
    dna:'Database sequences (3′ → 5′). Select every suspect whose sequence does NOT match the complementary strand.',
    gel:'Suspect samples have now been run. Select every suspect who is MISSING at least one band found in the scene sample.',
    punnett:'Each suspect’s parents’ genotypes are below. Select every suspect who could NOT be kk.'}[st];
  let rec='';
  if(st==='blood') rec=`<table class="dbtable"><tr><th>Suspect</th><th>Blood type</th></tr>${g.suspects.map(s=>`<tr><td>${h(s.name)}</td><td class="mono">${s.blood}</td></tr>`).join('')}</table><p class="muted small">Scene sample: <b>${S.items['blood.lab'].resolved?d.scene:'?'}</b></p>`;
  if(st==='dna') rec=`<table class="dbtable"><tr><th>Suspect</th><th>Database sequence</th></tr>${g.suspects.map(s=>`<tr><td>${h(s.name)}</td><td class="mono">3′ ${[...s.seq].map((b,i)=>`<span class="base-${b}">${b}</span>${i%3===2?' ':''}`).join('')} 5′</td></tr>`).join('')}</table>
    <p class="muted small">Your complementary strand: <span class="mono" style="font-family:var(--mono)">3′ ${fmt(d.answer)} 5′</span></p>`;
  if(st==='gel') rec=`<div class="gelwrap"><div style="overflow-x:auto;max-width:100%">${gelSVG([{label:'Ladder',bands:LADDER,ladder:true},{label:'Scene',bands:d.scene,color:'#3ee6c4'},...g.suspects.map(s=>({label:initials(s.name),bands:s.bands,color:s.color}))])}</div>
    <div class="legend">${g.suspects.map(s=>`<div><b style="color:${s.color}">${initials(s.name)}</b> = ${h(s.name)}</div>`).join('')}</div></div>`;
  if(st==='punnett') rec=`<table class="dbtable"><tr><th>Suspect</th><th>Parent 1</th><th>Parent 2</th></tr>${g.suspects.map(s=>`<tr><td>${h(s.name)}</td><td class="mono">${s.parents[0]}</td><td class="mono">${s.parents[1]}</td></tr>`).join('')}</table>`;
  const chosen = R ? d.excluded : S.ui.ex[st];
  const body=`<p class="q">${P}</p>${rec}
    <div class="chips">${g.suspects.map(s=>`<button class="chip ${chosen.includes(s.id)?'sel':''}" ${R?'disabled':''} onclick="act.exToggle('${st}',${s.id})">${avatar(s)}${h(s.name)}</button>`).join('')}</div>
    ${!R?`<div class="submit-row"><button class="btn" onclick="act.exSubmit('${st}')">Submit exclusions</button><span class="muted small">${S.ui.ex[st].length} selected</span></div>`:
      `<p class="why">🗂️ Ruled out: <b>${d.excluded.map(i=>h(g.suspects[i].name)).join(', ')}</b></p>`}`;
  return stepWrap(st,'ex',3,'Evidence Exclusion',locked,body);
}
function vStation(){
  const st=S.station, g=S.game, m=META[st];
  return `<section class="pop">
    <div class="station-head"><button class="btn ghost small" onclick="act.go('board')">← Case board</button>
      <div><div class="eyebrow">${m.icon} Station ${ORDER.indexOf(st)+1} · ${m.sub}</div><h2>${m.title}</h2><p class="muted" style="margin:0">Evidence: ${h(g.tpl.evidence[st])}</p></div></div>
    <div class="intro">${INTRO[st]}</div>
    ${stepMCQ(st)}${stepLab(st)}${stepEx(st)}
    ${stationDone(st)?`<div class="done-row" id="stationDone"><button class="btn" onclick="act.go('board')">Station complete — back to the case board →</button></div>`:''}
  </section>`;
}
function vAccuse(){
  const g=S.game, a=S.acc, done=ORDER.filter(stationDone).length, p=S.players[a.i];
  if(a.phase==='handoff') return `<section class="handoff card pop"><div class="lock">🔒</div><h2>Accusation locked</h2>
    <p class="muted">Hide the screen and pass the device to</p><h2 style="color:${p.color}">${h(p.name)}</h2>
    <button class="btn" onclick="act.ready()">We’re ${h(p.name)} — ready</button></section>`;
  return `<section class="pop">
    <div class="eyebrow">Case ${g.code} · Final Accusation</div>
    <h2>${S.mode==='team'?`<span style="color:${p.color}">${h(p.name)}</span>, choose secretly`:'Who did it?'}</h2>
    ${done<4?`<div class="msg bad">⚠️ Only ${done}/4 stations are complete, so more than one suspect may still fit the evidence. <button class="btn ghost small" onclick="act.go('board')">Back to the board</button></div>`:''}
    <p class="muted">Choose the one suspect who matches all of the evidence. Correct: +${ACCUSE_RIGHT}. Wrong: ${ACCUSE_WRONG}.</p>
    <div class="suspects">${g.suspects.map(s=>suspectCard(s,{pick:true,picked:a.sel===s.id,noOut:false})).join('')}</div>
    <div class="submit-row"><button class="btn warn" ${a.sel===null?'disabled':''} onclick="act.lockVote()">⚖️ Lock in accusation${a.sel!==null?': '+h(g.suspects[a.sel].name):''}</button>
    ${S.mode==='team'?`<span class="muted small">Team ${a.i+1} of ${S.players.length}</span>`:''}</div>
  </section>`;
}
function mastery(p){
  return SKILLS.map(([k,label])=>{ const L=p.log.filter(x=>x.skill===k); const c=L.filter(x=>x.ok).length;
    return {k,label,att:L.length,cor:c,pct:L.length?Math.round(c/L.length*100):null}; });
}
const pctColor = v => v===null?'var(--line)':v>=80?'var(--good)':v>=50?'var(--warn)':'var(--bad)';
function vResult(){
  const g=S.game, c=g.suspects[g.culprit], ranked=S.players.slice().sort((a,b)=>b.score-a.score), secs=Math.round((S.end-S.start)/1000);
  return `<section class="pop">
    <div class="eyebrow">Case ${g.code} · Closed</div><h2>${g.tpl.icon} ${h(g.tpl.title)}: Case solved</h2>
    <div class="dossier">
      <div class="card"><h3>The culprit</h3>
        <div class="suspects" style="grid-template-columns:1fr">${suspectCard(c,{guilty:true,noOut:true,tags:false,alibi:true})}</div>
        <p class="muted small">${h(c.name)} was the only suspect consistent with all four lines of evidence: blood type <b>${c.blood}</b>, a matching DNA sequence, every scene band present, and parents (${c.parents.join(' × ')}) who could produce a kk child.</p></div>
      <div class="card"><h3>${S.mode==='team'?'Final standings':'Your result'}</h3>
        <div class="scoreboard">${ranked.map((p,i)=>`<div class="sb-row ${i===0&&S.players.length>1?'first':''}"><span class="rk">${S.players.length>1?(i===0?'🏆':'#'+(i+1)):'🕵️'}</span>
          <span><b style="color:${p.color}">${h(p.name)}</b><br><span class="muted small">Accused ${h(g.suspects[p.vote].name)} ${p.vote===g.culprit?'✔':'✕'}</span></span>
          <span class="muted small">${p.hints} hint${p.hints!==1?'s':''}</span><span class="pts">${p.score}</span></div>`).join('')}</div>
        <p class="muted small">Time: ${Math.floor(secs/60)}m ${secs%60}s</p></div>
    </div>
    <h3 class="sec">Skills report (formative)</h3>
    <div class="card tablewrap"><table class="mastery"><tr><th>${S.mode==='team'?'Team':'Student'}</th>${SKILLS.map(s=>`<th>${s[1]}</th>`).join('')}</tr>
      ${S.players.map(p=>`<tr><td><b style="color:${p.color}">${h(p.name)}</b></td>${mastery(p).map(m=>`<td>${m.pct===null?'<span class="muted">—</span>':`${m.cor}/${m.att} correct<div class="bar"><i style="width:${m.pct}%;background:${pctColor(m.pct)}"></i></div>`}</td>`).join('')}</tr>`).join('')}
    </table><p class="muted small" style="margin-top:10px">Counts every attempt answered by that ${S.mode==='team'?'team':'student'} (first tries and retries). Under 50% = reteach; 50–79% = practice; 80%+ = mastery.</p>
    ${S.players.map(p=>{const weak=mastery(p).filter(m=>m.pct!==null&&m.pct<60).map(m=>m.label);return weak.length?`<p class="small"><b>${h(p.name)}</b> → review: ${weak.join(', ')}</p>`:'';}).join('')}</div>
    <h3 class="sec">How the evidence pointed</h3>
    <div class="card tablewrap"><table class="mastery evtable">${ORDER.map(st=>`<tr><td>${META[st].icon} <b>${META[st].title}</b></td><td>Ruled out: ${g.st[st].excluded.map(i=>h(g.suspects[i].name)).join(', ')}</td></tr>`).join('')}</table></div>
    <div class="submit-row noprint" style="justify-content:center;margin-top:24px">
      <button class="btn" onclick="act.replay()">🔁 Same case, new culprit</button>
      <button class="btn ghost" onclick="act.otherCase()">📂 Another case</button>
      <button class="btn ghost" onclick="act.copyReport()">📋 Copy report</button>
      <button class="btn ghost" onclick="act.csv()">⬇️ Download CSV</button>
      <button class="btn ghost" onclick="window.print()">🖨️ Print</button></div>
  </section>`;
}

/* ---------------- Reports ---------------- */
function fullReport(){
  const g=S.game, secs=Math.round((S.end-S.start)/1000);
  return [`GENE DETECTIVES — ${g.tpl.title} (Case ${g.code})`, `Date: ${new Date().toLocaleString()} · Time: ${Math.floor(secs/60)}m ${secs%60}s`, `Culprit: ${g.suspects[g.culprit].name}`, '',
    ...S.players.map(p=>[`${S.mode==='team'?'Team':'Student'}: ${p.name}`, `  Score: ${p.score} · Hints: ${p.hints} · Accusation: ${g.suspects[p.vote].name} (${p.vote===g.culprit?'correct':'incorrect'})`,
      ...mastery(p).map(m=>`  ${m.label}: ${m.pct===null?'—':`${m.cor}/${m.att} (${m.pct}%)`}`)].join('\n'))].join('\n');
}
function downloadCSV(){
  const g=S.game, secs=Math.round((S.end-S.start)/1000);
  const head=['case_code','case_title','mode','name','score','hints','accused','accusation_correct',...SKILLS.map(s=>s[1]+' %'),'time_seconds','date'];
  const rows=S.players.map(p=>[g.code,g.tpl.title,S.mode,p.name,p.score,p.hints,g.suspects[p.vote].name,p.vote===g.culprit?'yes':'no',...mastery(p).map(m=>m.pct===null?'':m.pct),secs,new Date().toISOString().slice(0,10)]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`gene-detectives-${g.code}.csv`; a.click();
}
function copyText(t){
  const ok=()=>toast('Report copied','good');
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(t).then(ok,()=>fallback());
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){toast('Copy failed','bad');}ta.remove();}
}

/* ---------------- Teacher key ---------------- */
function openTeacher(){
  const card=document.getElementById('modalCard');
  if(!S.teacherOK){
    card.innerHTML=`<button class="iconbtn x" onclick="act.closeModal()">✕</button><div class="eyebrow">Teacher tools</div><h2>Enter PIN</h2>
      <p class="muted small">Default PIN is set at the top of index.html (TEACHER_PIN).</p>
      <div class="row gap"><input id="pinIn" type="password" class="tx" style="max-width:180px" onkeydown="if(event.key==='Enter')act.pin()"><button class="btn" onclick="act.pin()">Unlock</button></div>`;
  } else {
    const code=S.keyCode||(S.game&&S.game.code)||'';
    const g=code?buildCase(code):null;
    card.innerHTML=`<button class="iconbtn x" onclick="act.closeModal()">✕</button><div class="eyebrow">Teacher tools</div><h2>Answer key</h2>
      <div class="row gap"><input id="keyIn" class="tx" style="max-width:180px;font-family:var(--mono)" value="${h(code)}" placeholder="GH-4821" onkeydown="if(event.key==='Enter')act.keyLoad()"><button class="btn small" onclick="act.keyLoad()">Show key</button></div>
      ${g?keyTable(g):code?'<p class="msg bad">Invalid code.</p>':'<p class="muted">Enter a case code to see its answers.</p>'}
      <h3 class="sec">Generate case codes</h3><p class="muted small">Give each team or student a different code so every group has a different culprit.</p>
      <div class="row gap"><select id="genCase" class="tx" style="max-width:260px">${CASES.map(c=>`<option value="${c.id}">${c.icon} ${h(c.title)}</option>`).join('')}</select>
      <input id="genN" type="number" min="1" max="40" value="6" class="tx" style="max-width:90px"><button class="btn small" onclick="act.genCodes()">Generate</button></div>
      <div id="codesOut" class="codes"></div>`;
  }
  document.getElementById('modal').classList.remove('hidden');
  const f=document.getElementById('pinIn'); if(f) f.focus();
}
function keyTable(g){
  const d=g.st, n=i=>h(g.suspects[i].name), f=d.punnett.featured;
  return `<p style="margin-top:14px">${g.tpl.icon} <b>${h(g.tpl.title)}</b> — Culprit: <b style="color:var(--bad)">${n(g.culprit)}</b> (${h(g.suspects[g.culprit].role)})</p>
  <table class="keyt"><tr><th>Station</th><th>Concept check</th><th>Lab answer</th><th>Excludes</th></tr>
  <tr><td>🩸 Blood</td><td>${h(d.blood.mcq.opts[d.blood.mcq.ans].t)}</td><td>${d.blood.scene}</td><td>${d.blood.excluded.map(n).join(', ')}</td></tr>
  <tr><td>🧬 DNA</td><td>${h(d.dna.mcq.opts[d.dna.mcq.ans].t)}</td><td style="font-family:var(--mono)">3′ ${fmt(d.dna.answer)} 5′</td><td>${d.dna.excluded.map(n).join(', ')}</td></tr>
  <tr><td>📊 Gel</td><td>${h(d.gel.mcq.opts[d.gel.mcq.ans].t)}</td><td>${d.gel.target} bp (scene bands: ${d.gel.scene.join(', ')})</td><td>${d.gel.excluded.map(n).join(', ')}</td></tr>
  <tr><td>🔲 Punnett</td><td>${h(d.punnett.mcq.opts[d.punnett.mcq.ans].t)}</td><td>${f.p1} × ${f.p2}: ${f.cells.join(', ')} → ${f.prob}%</td><td>${d.punnett.excluded.map(n).join(', ')}</td></tr></table>`;
}

/* ---------------- Chrome: HUD, turn bar, toast ---------------- */
function renderHud(){
  const hud=document.getElementById('hud'), g=S.game, inGame=g&&['brief','board','station','accuse'].includes(S.screen);
  hud.innerHTML = (inGame?`<span class="pill">Case <strong>${g.code}</strong></span><span class="pill">⏱ <strong id="timer">${elapsed()}</strong></span>${S.mode==='solo'?`<span class="pill">Score <strong>${S.players[0].score}</strong></span>`:''}`:'')
    + `<button class="iconbtn" onclick="act.scale()" title="Bigger text for projectors">A⁺</button><button class="iconbtn" onclick="act.teacher()">🔑 Teacher</button>`;
  const tb=document.getElementById('turnbar');
  tb.innerHTML = (S.mode==='team'&&g&&['board','station'].includes(S.screen)) ? `<div class="turnbar">${S.players.map((p,i)=>`<div class="tchip ${i===S.turn?'active':''}" style="${i===S.turn?`border-color:${p.color}`:''}"><span class="dot" style="background:${p.color}"></span>${h(p.name)} <span class="sc">${p.score}</span></div>`).join('')}</div>` : '';
}
function elapsed(){ const s=Math.round(((S.end||Date.now())-S.start)/1000); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
setInterval(()=>{ const t=document.getElementById('timer'); if(t&&S.game&&!S.end) t.textContent=elapsed(); },1000);
let toastT;
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(type||''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',1800); }

/* ---------------- Render ---------------- */
function render(){
  const views={home:vHome,setup:vSetup,cases:vCases,brief:vBrief,board:vBoard,station:vStation,accuse:vAccuse,result:vResult};
  document.getElementById('app').innerHTML=(views[S.screen]||vHome)();
  renderHud();
  if(S.scrollTo){ const el=document.getElementById(S.scrollTo); S.scrollTo=null; if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60); }
}
render();
</script>
</body>
</html>
