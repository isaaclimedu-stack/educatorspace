<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Brain Explorer</title>
<meta name="description" content="Interactive 3D brain for high school biology: rotate the brain, slice it in sagittal, coronal and horizontal planes, and click any region to learn its functions, everyday skills and what happens when it is damaged.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1c;--bg2:#0e1628;--panel:#131d33;--panel2:#1a2742;--line:#283b62;
  --text:#e8eef9;--muted:#9fb0cf;--accent:#3ee6c4;--accent-ink:#03231c;--accent2:#7c9cff;
  --bad:#ff6b81;--good:#4ade80;--warn:#fbbf24;--radius:16px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);line-height:1.5;
  background:radial-gradient(900px 500px at 85% -10%,#18305c 0%,transparent 60%),radial-gradient(700px 400px at -10% 110%,#0f3a3a 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(10,15,28,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.03em;font-size:1.05rem}
.logo b{color:var(--accent)}
.logo svg{width:22px;height:22px;color:var(--accent)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 .78rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill strong{color:var(--text)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:14px;padding:14px 16px 18px;max-width:1700px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.side{align-self:start;display:grid;gap:14px}
.eyebrow{font:600 .7rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.grp{display:grid;gap:8px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vb{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;font-size:.88rem}
.vb svg{width:16px;height:16px;flex:none;color:var(--muted)}
.vb:hover{border-color:var(--accent)}
.vb.on{border-color:var(--accent);background:rgba(62,230,196,.12)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:6px 4px;border-radius:7px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:not(.on):hover{color:var(--text)}
.slider{display:grid;gap:6px}
.slider[hidden]{display:none}
.slider .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slider output{font:600 .75rem var(--mono);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
.lbtn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.lbtn:hover{border-color:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem}
.sw{position:relative;width:38px;height:22px;border-radius:22px;background:#2a3a5e;border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:19px}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.search{position:relative}
.search input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:.9rem}
.search input:focus{outline:none;border-color:var(--accent)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;z-index:20;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.results button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 11px;text-align:left;cursor:pointer;font-size:.88rem}
.results button:hover,.results button.act{background:var(--panel2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.center{min-width:0;display:grid;gap:10px;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tags .lab{font:600 .7rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage{position:relative;height:calc(100vh - 150px);min-height:520px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 38%,#22324f 0%,#121b2e 55%,#0a0f1c 100%)}
.stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage canvas:active{cursor:grabbing}
.vtag{position:absolute;left:14px;top:12px;font:600 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.vtag b{color:var(--text)}
.orient{position:absolute;inset:0;pointer-events:none}
.orient span{position:absolute;transform:translate(-50%,-50%);font:600 .64rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#b9c8e6;background:rgba(10,15,28,.55);border:1px solid rgba(124,156,255,.25);padding:2px 7px;border-radius:999px;white-space:nowrap;transition:opacity .2s}
.tip{position:fixed;pointer-events:none;background:#0b1222;border:1px solid var(--line);color:var(--text);padding:5px 10px;border-radius:8px;font-size:.82rem;font-weight:600;opacity:0;transition:opacity .1s;z-index:40;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,15,28,.82);z-index:5;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.loading div{text-align:center;display:grid;gap:10px;justify-items:center}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading p{margin:0;font:600 .8rem var(--mono);color:var(--muted)}
.quizbar{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(11,18,34,.94);border:1px solid var(--accent);border-radius:14px;padding:8px 10px 8px 16px;align-items:center;gap:12px;z-index:4;max-width:calc(100% - 24px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.quizbar.show{display:flex;flex-wrap:wrap}
.quizbar .q{font-size:.95rem}
.quizbar .q b{color:var(--accent);font-size:1.05rem}
.quizbar .fb{font-size:.82rem;font-weight:600}
.quizbar .sc{font:600 .75rem var(--mono);color:var(--muted)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(19,29,51,.9);font-weight:700;font-size:1rem;cursor:pointer}
.zoom button:hover{border-color:var(--accent)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:calc(100% - 80px);font-size:.75rem;color:var(--muted);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}
.info{align-self:start;position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto;padding:18px}
.info h2{font-size:1.55rem;line-height:1.15;margin:6px 0 2px}
.info .aka{color:var(--muted);font-size:.88rem}
.info .where{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0 2px;font-size:.92rem}
.info h3{font:600 .7rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
.info ul{margin:0;padding-left:18px}
.info li{margin:3px 0;font-size:.93rem}
.info p{margin:0;font-size:.93rem}
.fact{border-left:3px solid var(--accent2);padding:4px 0 4px 12px;color:#cfdaf0}
.cat{display:inline-flex;align-items:center;gap:7px;font:600 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.show{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.88rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mtags span{font-size:.75rem;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.welcome dl{margin:6px 0 0}
.welcome dt{font-weight:700;margin-top:10px;font-size:.93rem}
.welcome dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.picks{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1240px){.app{grid-template-columns:240px minmax(0,1fr)}.info{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:820px){.app{grid-template-columns:1fr}.stage{height:62vh;min-height:380px}.side{order:2}.center{order:1}.info{order:3}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5a3 3 0 0 0-3 3 3 3 0 0 0-2.5 4.6A3.2 3.2 0 0 0 5 17a3 3 0 0 0 4.5 2.6V3.6z"/><path d="M14.5 3.5a3 3 0 0 1 3 3 3 3 0 0 1 2.5 4.6A3.2 3.2 0 0 1 19 17a3 3 0 0 1-4.5 2.6V3.6z"/></svg><span>Brain <b>Explorer</b></span></div>
  <div class="hud"><span class="pill">View <strong id="hudView">Left side</strong></span><span class="pill" id="hudCut">No cut</span></div>
</header>

<div class="app">
  <aside class="side">
    <section class="card grp">
      <span class="eyebrow">Turn the brain</span>
      <div class="views" id="views"></div>
      <p class="hint">Drag to rotate. Scroll or pinch to zoom. Right-drag or two fingers to move it.</p>
    </section>
    <section class="card grp">
      <span class="eyebrow">Cut it open</span>
      <div class="seg" id="cutSeg"><button data-c="none">None</button><button data-c="sagittal">Sagittal</button><button data-c="coronal">Coronal</button><button data-c="horizontal">Horizontal</button></div>
      <div class="slider" id="cutCtl" hidden>
        <div class="row"><span class="hint" id="cutDesc"></span></div>
        <input type="range" id="cutPos" min="-1" max="1" step="0.005" aria-label="Cut position">
        <div class="row"><output id="cutOut"></output><button class="lbtn" id="flip">Flip side</button></div>
      </div>
    </section>
    <section class="card grp">
      <span class="eyebrow">Colour</span>
      <div class="seg" id="modeSeg"><button data-m="natural">Natural</button><button data-m="lobes">Lobes</button><button data-m="areas">Areas</button></div>
      <div class="tog"><span>See-through cortex</span><button class="sw" id="ghostSw" aria-label="See-through cortex"></button></div>
      <div class="tog"><span>Quiz me</span><button class="sw" id="quizSw" aria-label="Quiz mode"></button></div>
    </section>
    <section class="card grp search">
      <span class="eyebrow">Find a structure</span>
      <input id="q" type="search" placeholder="e.g. hippocampus, memory" autocomplete="off" aria-label="Find a structure">
      <div class="results" id="results"></div>
    </section>
  </aside>

  <main class="center">
    <div class="tags" id="tags"></div>
    <div class="stage" id="stage">
      <div class="vtag" id="vtag"></div>
      <div class="orient" id="orient"></div>
      <div class="quizbar" id="quizbar"><span class="q">Find: <b id="qT"></b></span><span class="fb" id="qFb"></span><span class="sc" id="qSc"></span><button class="lbtn" id="qSkip">Skip</button></div>
      <div class="legend" id="legend"></div>
      <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zre" aria-label="Reset view" style="font-size:.85rem">⟲</button></div>
      <div class="loading" id="loading"><div><div class="spin"></div><p id="loadMsg">Building the brain…</p></div></div>
    </div>
  </main>

  <aside class="card info" id="info"></aside>
</div>
<div class="tip" id="tip"></div>

<script src="../shared/fullscreen.js"></script>

function dolly(k) { const off = camera.position.clone().sub(controls.target); const L = Math.min(controls.maxDistance, Math.max(controls.minDistance, off.length() * k)); camera.position.copy(controls.target).add(off.setLength(L)); }
document.addEventListener('keydown', e => { if (e.target.matches('input')) return; if (e.key === 'Escape') { S.sel = null; S.tag = null; marker.visible = false; refresh(); } });

const UNDERSIDE = new Set(['ofc', 'fusiform', 'parahippocampal', 'lingual']);
function presentIds() {
  /* parts the student can actually reach from this angle and cut */
  const set = new Set(), cam = camera.position, cut = S.cut !== 'none', sag = S.cut === 'sagittal';
  const camDir = cam.clone().sub(controls.target).normalize(), below = camDir.y < -0.35;
  if (!S.ghost) {
    const arr = S.mode === 'lobes' ? CER.idL : CER.idA, P = CER.mesh.geometry.attributes.position.array, N = CER.mesh.geometry.attributes.normal.array, v = new THREE.Vector3();
    for (let i = 0; i < arr.length; i += 5) { v.set(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); if (plane.distanceToPoint(v) < 0) continue;
      const tx = cam.x - v.x, ty = cam.y - v.y, tz = cam.z - v.z; if (N[i * 3] * tx + N[i * 3 + 1] * ty + N[i * 3 + 2] * tz < 0.35 * Math.hypot(tx, ty, tz)) continue;
      const X = Math.abs(v.x); if (X < 0.075 && !sag) continue;
      if (!sag && Math.abs(camDir.x) > 0.5 && Math.sign(v.x) !== Math.sign(camDir.x)) continue;   /* far hemisphere is hidden */
      const id = ID_LIST[arr[i]]; if (UNDERSIDE.has(id) && !below && !cut) continue; set.add(id); }
    if (cut) set.add('white_matter');
  }
  if (camDir.y < 0.6 || cut) { set.add('cerebellum'); set.add('pons'); set.add('medulla'); }
  if (sag || S.ghost || (cut && plane.distanceToPoint(new THREE.Vector3(0, -0.12, -0.1)) > -0.05 && Math.abs(plane.distanceToPoint(new THREE.Vector3(0, -0.12, -0.1))) < 0.12)) set.add('midbrain');
  for (const id in DEEP) { const s = DEEP[id]; if (S.ghost || (cut && s.box.intersectsPlane(plane)) || (s.out && (below || sag))) set.add(id); }
  set.delete('cortex'); set.delete(undefined); return set;
}

/* where to look for each structure: [view, cut, position, flip] */
const LATERAL = ['frontal', 'parietal', 'temporal', 'occipital', 'm1', 'premotor', 'dlpfc', 'broca', 's1', 'spl', 'smg', 'angular', 'a1', 'wernicke', 'itg', 'cerebellum', 'pons', 'medulla'];
const MEDIAL = ['mpfc', 'sma', 'paracentral', 'precuneus', 'cuneus', 'lingual', 'cingulate', 'v1', 'cc', 'fornix', 'hypothalamus', 'pineal', 'ventricle4', 'midbrain', 'ventricle3'];
const BELOW = ['ofc', 'fusiform', 'parahippocampal', 'olfactory', 'optic_chiasm', 'mammillary', 'pituitary'];
const DEEPCUT = { thalamus: ['coronal', -0.12], caudate: ['horizontal', 0.1], putamen: ['horizontal', 0.03], globus_pallidus: ['horizontal', 0.02], internal_capsule: ['horizontal', 0.03], insula: ['horizontal', 0.02], lat_ventricle: ['horizontal', 0.13], hippocampus: ['coronal', -0.04], amygdala: ['coronal', 0.22], substantia_nigra: ['coronal', -0.075], white_matter: ['coronal', -0.1], cortex: ['coronal', -0.1] };
function showMe(id) {
  if (S.quiz) return;
  const needAreas = !['frontal', 'parietal', 'temporal', 'occipital', 'cingulate'].includes(id);
  if (needAreas && S.mode === 'lobes' && !STRUCTS.some(s => s.id === id) && !['cerebellum', 'pons', 'medulla', 'midbrain', 'white_matter'].includes(id)) S.mode = 'areas';
  if (S.ghost && !STRUCTS.some(s => s.id === id)) { S.ghost = false; applyGhost(); }
  S.flip = false;
  if (id === 'broca_r' || id === 'wernicke_r') { setCut('none'); setView('right'); }
  else if (LATERAL.includes(id)) { setCut('none'); setView('left'); }
  else if (MEDIAL.includes(id)) { S.pos.sagittal = id === 'v1' || id === 'cuneus' || id === 'lingual' ? -0.03 : 0; setCut('sagittal'); }
  else if (BELOW.includes(id)) { setCut('none'); setView('bottom'); }
  else if (DEEPCUT[id]) { const [c, p] = DEEPCUT[id]; S.pos[c] = p; setCut(c); }
  else { setCut('none'); setView('left'); }
  S.sel = id; marker.visible = false; refresh();
}

function refresh() { document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode)); document.querySelectorAll('#tags .chip').forEach(b => b.classList.toggle('on', b.dataset.t === S.tag)); colorAll(); refreshInfo(); $('#vtag').innerHTML = S.ghost ? '<b>See-through</b> cortex' : ''; }
function renderLegend() {
  const L = $('#legend'); if (S.mode !== 'lobes') { L.innerHTML = S.mode === 'natural' ? '<span>Natural colour. Click any part to name it.</span>' : ''; return; }
  L.innerHTML = ['frontal', 'parietal', 'temporal', 'occipital', 'cingulate', 'cerebellum'].map(i => `<span><i class="dot" style="background:${REG[i].c}"></i>${REG[i].n}</span>`).join('');
}
function refreshInfo() {
  const box = $('#info');
  if (S.quiz) { const q = S.quiz, l = q.last;
    box.innerHTML = `<span class="eyebrow">Quiz</span><h2>Find the structure</h2><p class="muted">Click the part named at the top of the brain. You get two tries, then it lights up. Turn the brain, cut it open or switch colours at any time. The quiz only asks for parts you can reach in the current view.</p><h3>Score</h3><p style="font:700 1.6rem var(--mono)">${q.score} / ${q.total}</p>${l ? `<h3>Last answer: ${esc(REG[l].n)}</h3><p>${esc(REG[l].where)}</p><ul>${REG[l].fn.slice(0, 3).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}`; return; }
  const id = S.sel;
  if (!id) {
    if (S.tag) { const ids = Object.keys(REG).filter(i => REG[i].tags.includes(S.tag) && WHERE_OK(i));
      box.innerHTML = `<span class="eyebrow">Light up by function</span><h2>${TAGS[S.tag]}</h2><p class="muted">Parts of the brain involved in this, lit up on the model. Some are deep inside: pick one to cut straight to it.</p><h3>Structures</h3><div class="picks">${ids.map(i => `<button class="chip" data-pick="${i}"><i class="dot" style="background:${REG[i].c};display:inline-block;margin-right:6px;vertical-align:-1px"></i>${esc(REG[i].n)}</button>`).join('')}</div>`;
      box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => showMe(b.dataset.pick)); return; }
    box.innerHTML = `<div class="welcome"><span class="eyebrow">Getting started</span><h2>Click any part of the brain</h2><p class="muted">Each part opens here with what it does, everyday skills that use it, what happens when it’s damaged, and a fact worth remembering.</p>
      <h3>Three ways to cut</h3><dl><dt>Sagittal</dt><dd>Splits the brain into left and right. Right down the middle is “midsagittal”.</dd><dt>Coronal (frontal)</dt><dd>Splits it into front and back, like slicing a loaf from ear to ear.</dd><dt>Horizontal (axial, transverse)</dt><dd>Splits it into top and bottom, parallel to the floor. Most CT and MRI slices look like this.</dd></dl>
      <h3>Direction words</h3><dl><dt>Anterior / posterior</dt><dd>Toward the front / the back.</dd><dt>Superior / inferior</dt><dd>Toward the top / the bottom.</dd><dt>Medial / lateral</dt><dd>Toward the midline / toward the side.</dd></dl>
      <h3>Try this</h3><div class="picks">${['hippocampus', 'broca', 'thalamus', 'amygdala', 'cerebellum', 'v1'].map(i => `<button class="chip" data-pick="${i}">${esc(REG[i].n)}</button>`).join('')}</div></div>`;
    box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => showMe(b.dataset.pick)); return;
  }
  const R = REG[id];
  box.innerHTML = `<span class="cat"><i class="dot" style="background:${R.c}"></i>${esc(R.cat)}</span><h2>${esc(R.n)}</h2>${R.aka ? `<div class="aka">${esc(R.aka)}</div>` : ''}
    <div class="where"><b>Where:</b> ${esc(R.where)}</div>
    <h3>What it does</h3><ul>${R.fn.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${R.sk && R.sk.length ? `<h3>Skills & everyday examples</h3><ul>${R.sk.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${R.dmg ? `<h3>If it’s damaged</h3><p>${esc(R.dmg)}</p>` : ''}
    ${R.fact ? `<h3>Did you know?</h3><p class="fact">${esc(R.fact)}</p>` : ''}
    <div class="mtags">${R.tags.map(t => `<span>${TAGS[t]}</span>`).join('')}</div>
    <div class="show"><button class="btn" id="showMe">Show me where it is</button><button class="btn ghost" id="clr">Clear</button></div>`;
  $('#showMe').onclick = () => showMe(id); $('#clr').onclick = () => { S.sel = null; marker.visible = false; refresh(); };
}
const MODEL_IDS = new Set([...LATERAL, ...MEDIAL, ...BELOW, ...Object.keys(DEEPCUT), 'broca_r', 'wernicke_r']);
const WHERE_OK = id => MODEL_IDS.has(id);

/* pointer: hover names, click selects (drags rotate) */
const tip = $('#tip'); let down = null, hoverT = 0;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || e.buttons || S.quiz || !CER) { tip.style.opacity = 0; return; }
  const now = performance.now(); if (now - hoverT < 45) return; hoverT = now;
  const h = pick(e.clientX, e.clientY); if (h && REG[h.id]) { tip.textContent = REG[h.id].n; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 12 + 'px'; tip.style.opacity = 1; } else tip.style.opacity = 0;
});
renderer.domElement.addEventListener('pointerleave', () => tip.style.opacity = 0);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5 || !CER) { down = null; return; } down = null;
  const h = pick(e.clientX, e.clientY); tip.style.opacity = 0;
  if (S.quiz) { if (h) answer(h.id); return; }
  if (!h) { S.sel = null; marker.visible = false; refresh(); return; }
  S.sel = h.id; marker.position.copy(h.p); marker.visible = true; refresh();
});

/* quiz */
function nextQ(keep) {
  const q = S.quiz; if (!q) return; q.busy = false; q.tries = 0; const ids = [...presentIds()].filter(i => REG[i]);
  if (!(keep && q.target && ids.includes(q.target))) { const c = ids.filter(i => i !== q.target); q.target = c[Math.floor(Math.random() * c.length)]; }
  $('#qT').textContent = REG[q.target].n; $('#qFb').textContent = ''; $('#qSc').textContent = `${q.score} / ${q.total}`; refreshInfo();
}
function flash(id, ok) { S.sel = id; const qz = S.quiz; S.quiz = null; colorAll(); S.quiz = qz; setTimeout(() => { S.sel = null; colorAll(); }, ok ? 800 : 1500); }
function answer(id) {
  const q = S.quiz; if (q.busy) return;
  if (id === q.target) { q.score++; q.total++; q.last = id; q.busy = true; $('#qFb').textContent = '✓ Correct'; $('#qFb').style.color = 'var(--good)'; flash(id, true); setTimeout(() => nextQ(), 850); }
  else { q.tries++; $('#qFb').style.color = 'var(--bad)';
    if (q.tries >= 2) { q.total++; q.last = q.target; q.busy = true; $('#qFb').textContent = `That’s the ${REG[id].n}. Here’s the answer.`; flash(q.target, false); setTimeout(() => nextQ(), 1700); }
    else $('#qFb').textContent = `That’s the ${REG[id].n}. Try again.`; }
  $('#qSc').textContent = `${q.score} / ${q.total}`; refreshInfo();
}
$('#qSkip').onclick = () => { const q = S.quiz; if (!q || q.busy) return; q.total++; q.last = q.target; q.busy = true; flash(q.target, false); setTimeout(() => nextQ(), 1500); };

/* search */
const qi = $('#q'), res = $('#results'); let hits = [], act = 0;
qi.addEventListener('input', () => { const s = qi.value.trim().toLowerCase(); if (!s) { res.style.display = 'none'; return; }
  hits = [...MODEL_IDS].filter(id => REG[id] && (REG[id].n + ' ' + (REG[id].aka || '') + ' ' + REG[id].cat + ' ' + REG[id].fn.join(' ') + ' ' + REG[id].tags.map(t => TAGS[t]).join(' ')).toLowerCase().includes(s))
    .sort((a, b) => REG[b].n.toLowerCase().startsWith(s) - REG[a].n.toLowerCase().startsWith(s)).slice(0, 12); act = 0;
  res.innerHTML = hits.length ? hits.map((id, i) => `<button data-id="${id}" class="${i ? '' : 'act'}"><i class="dot" style="background:${REG[id].c}"></i>${esc(REG[id].n)}</button>`).join('') : '<div style="padding:9px 11px;color:var(--muted)">No match</div>';
  res.style.display = 'block'; res.querySelectorAll('button').forEach(b => b.onmousedown = ev => { ev.preventDefault(); choose(b.dataset.id); }); });
qi.addEventListener('blur', () => setTimeout(() => res.style.display = 'none', 120));
qi.addEventListener('keydown', e => { if (!hits.length) return; if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; res.querySelectorAll('button').forEach((b, i) => b.classList.toggle('act', i === act)); } else if (e.key === 'Enter') choose(hits[act]); });
function choose(id) { qi.value = ''; res.style.display = 'none'; if (S.quiz) $('#quizSw').click(); showMe(id); }

/* boot */
resize(); setView('left', true); requestAnimationFrame(loop); refreshInfo();
build().then(() => { applyCut(); applyGhost(); refresh(); $('#loading').classList.add('done'); window.__ready = true; })
  .catch(err => { $('#loadMsg').textContent = 'Something went wrong building the model: ' + err.message; console.error(err); });
window.__S = S; window.__api = { setView, setCut, showMe, refresh, pick }; window.__present = presentIds; window.__cam = { camera, controls };
</script>
</body>
</html>
